<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>风声 · 搜索</title>
<meta name="description" content="风声知识底座 · 加权搜索 · 词条检索 · 高亮匹配">
<style>
:root {
  --p: #3d5a3e;
  --p-light: #5a7d5b;
  --fire: #c46a3a;
  --fire-light: #e08a3c;
  --cream: #f7f4ef;
  --cream-deep: #ede7dc;
  --ink: #1a2b26;
  --ink-soft: #5a6b65;
  --wood: #c8956d;
  --line: rgba(61,90,62,0.12);
  --shadow-sm: 0 2px 8px rgba(61,90,62,0.06);
  --shadow-md: 0 8px 24px rgba(61,90,62,0.10);
  --shadow-lg: 0 20px 48px rgba(61,90,62,0.14);
  --pillar-culture: #3d5a3e;
  --pillar-mission: #c46a3a;
  --pillar-vision: #6b5fa8;
  --pillar-value: #c8956d;
  --layer-matter: #3d5a3e;
  --layer-emotion: #c8956d;
  --layer-spirit: #c46a3a;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--cream);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}

/* ===== Nav ===== */
.nav{position:sticky;top:0;z-index:100;background:rgba(247,244,239,0.88);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
.nav-inner{max-width:1240px;margin:0 auto;padding:14px 32px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;flex-shrink:0}
.brand-mark{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--p),var(--p-light));display:grid;place-items:center;color:white;font-weight:800}
.nav-divider{width:1px;height:20px;background:var(--line)}
.nav-back{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;font-size:14px;color:var(--ink-soft);transition:all .2s}
.nav-back:hover{background:rgba(61,90,62,0.06);color:var(--p)}
.nav-back svg{flex-shrink:0}

/* ===== Main ===== */
main{flex:1;max-width:1240px;width:100%;margin:0 auto;padding:32px 32px 60px}

/* ===== Search Hero ===== */
.search-hero{position:relative;margin-bottom:24px}
.search-hero::before{content:'';position:absolute;top:-120px;right:-120px;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(196,106,58,0.10) 0%,transparent 70%);pointer-events:none}
.search-hero-title{font-size:32px;font-weight:800;letter-spacing:-0.5px;margin-bottom:8px}
.search-hero-sub{font-size:14px;color:var(--ink-soft);margin-bottom:24px}

.search-wrapper{position:relative;max-width:720px}
.search-box{display:flex;align-items:center;gap:12px;padding:16px 20px;background:white;border:1.5px solid var(--line);border-radius:14px;box-shadow:var(--shadow-sm);transition:all .2s}
.search-box:focus-within{border-color:var(--p);box-shadow:var(--shadow-md)}
.search-box svg{color:var(--ink-soft);flex-shrink:0}
.search-box input{flex:1;border:none;outline:none;font-size:15px;color:var(--ink);background:transparent;font-family:inherit}
.search-box input::placeholder{color:var(--ink-soft)}
.search-clear{width:28px;height:28px;border-radius:50%;background:var(--cream);border:none;cursor:pointer;display:none;align-items:center;justify-content:center;font-size:14px;color:var(--ink-soft);flex-shrink:0;transition:all .15s}
.search-clear:hover{background:var(--cream-deep);color:var(--ink)}
.search-clear.visible{display:flex}
.search-spinner{display:none;width:20px;height:20px;border:2px solid var(--line);border-top-color:var(--p);border-radius:50%;animation:spin .6s linear infinite;flex-shrink:0}
.search-spinner.visible{display:block}
@keyframes spin{to{transform:rotate(360deg)}}

/* Suggestions dropdown */
.suggestions{position:absolute;top:calc(100% + 6px);left:0;right:0;background:white;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-md);overflow:hidden;z-index:50;display:none}
.suggestions.active{display:block}
.suggest-item{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;transition:background .15s;border-bottom:1px solid var(--line)}
.suggest-item:last-child{border-bottom:none}
.suggest-item:hover{background:rgba(61,90,62,0.04)}
.suggest-item .si-icon{font-size:18px;flex-shrink:0;width:24px;text-align:center}
.suggest-item .si-content{flex:1;min-width:0}
.suggest-item .si-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.suggest-item .si-desc{font-size:12px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.suggest-item .si-meta{font-size:11px;color:var(--ink-soft);flex-shrink:0;padding:2px 8px;background:rgba(61,90,62,0.06);border-radius:4px}
.suggest-loading{display:flex;align-items:center;gap:12px;padding:16px;color:var(--ink-soft);font-size:13px;justify-content:center}
.suggest-empty{padding:16px;text-align:center;color:var(--ink-soft);font-size:13px}

/* ===== Filters ===== */
.filters-section{display:flex;flex-wrap:wrap;gap:24px;margin-bottom:28px;align-items:flex-start}
.filter-group{display:flex;flex-direction:column;gap:6px}
.filter-label{font-size:11px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.5px}
.filter-chips{display:flex;flex-wrap:wrap;gap:6px}
.filter-chip{font-size:12px;padding:5px 12px;border-radius:100px;background:white;border:1px solid var(--line);color:var(--ink-soft);cursor:pointer;transition:all .15s;white-space:nowrap;user-select:none}
.filter-chip:hover{background:rgba(61,90,62,0.06);border-color:var(--p)}
.filter-chip.active{background:var(--p);color:white;border-color:var(--p);font-weight:600}
.filter-chip .count{font-size:10px;opacity:0.7;margin-left:4px}

/* ===== Results Header ===== */
.results-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:20px}
.results-count{font-size:15px;font-weight:700;color:var(--ink)}
.results-count .num{color:var(--p);font-size:18px}
.results-sort{font-size:12px;color:var(--ink-soft);display:flex;align-items:center;gap:4px}

/* ===== Results List ===== */
.results-list{display:flex;flex-direction:column;gap:0}
.result-card{background:white;border:1px solid var(--line);transition:all .2s;cursor:pointer;padding:20px 24px}
.result-card:first-child{border-radius:14px 14px 0 0}
.result-card:last-child{border-radius:0 0 14px 14px}
.result-card:only-child{border-radius:14px}
.result-card + .result-card{border-top:none}
.result-card:hover{background:rgba(247,244,239,0.5);border-color:rgba(61,90,62,0.2)}
.result-card:hover + .result-card{border-top-color:rgba(61,90,62,0.2)}
.result-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:8px}
.result-name{font-size:16px;font-weight:700;color:var(--ink);flex:1;min-width:0}
.result-score{font-size:11px;font-weight:700;color:white;background:var(--p);padding:3px 8px;border-radius:6px;flex-shrink:0}
.result-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.result-meta .meta-tag{font-size:11px;padding:3px 8px;border-radius:4px;font-weight:600;white-space:nowrap}
.meta-tag.entryType{background:rgba(61,90,62,0.08);color:var(--p)}
.meta-tag.severity-hard{background:rgba(196,106,58,0.1);color:var(--fire)}
.meta-tag.severity-medium{background:rgba(200,149,109,0.12);color:var(--wood)}
.meta-tag.severity-soft{background:rgba(107,95,168,0.08);color:var(--pillar-vision)}
.meta-tag.priority-P0{background:rgba(196,106,58,0.12);color:var(--fire);font-weight:700}
.meta-tag.priority-P1{background:rgba(200,149,109,0.1);color:var(--wood)}
.meta-tag.priority-P2{background:rgba(61,90,62,0.08);color:var(--p)}
.meta-tag.priority-P3{background:rgba(107,95,168,0.08);color:var(--pillar-vision)}
.meta-tag.priority{background:rgba(61,90,62,0.06);color:var(--ink-soft)}
.result-desc{font-size:14px;color:var(--ink-soft);line-height:1.7;margin-bottom:8px}
.result-desc mark{background:rgba(196,106,58,0.2);color:var(--ink);padding:1px 3px;border-radius:2px;font-weight:500}
.result-highlights{display:flex;flex-wrap:wrap;gap:4px}
.highlight-tag{font-size:10px;padding:2px 6px;border-radius:3px;background:rgba(61,90,62,0.06);color:var(--p);border:1px solid rgba(61,90,62,0.15)}

/* ===== Empty State ===== */
.empty-state{text-align:center;padding:60px 20px}
.empty-icon{font-size:48px;margin-bottom:16px;opacity:0.3}
.empty-title{font-size:18px;font-weight:700;color:var(--ink);margin-bottom:8px}
.empty-desc{font-size:14px;color:var(--ink-soft);max-width:400px;margin:0 auto}

/* ===== Error State ===== */
.error-state{text-align:center;padding:40px 20px;background:rgba(196,106,58,0.06);border:1px solid rgba(196,106,58,0.2);border-radius:14px;margin-bottom:20px}
.error-title{font-size:15px;font-weight:700;color:var(--fire);margin-bottom:6px}
.error-desc{font-size:13px;color:var(--ink-soft)}

/* ===== Pagination ===== */
.pagination{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:28px;flex-wrap:wrap}
.page-btn{padding:8px 14px;border-radius:8px;background:white;border:1px solid var(--line);color:var(--ink);font-size:13px;cursor:pointer;transition:all .15s;min-width:36px;text-align:center}
.page-btn:hover:not(:disabled):not(.active){background:rgba(61,90,62,0.06);border-color:var(--p)}
.page-btn.active{background:var(--p);color:white;border-color:var(--p);font-weight:600}
.page-btn:disabled{opacity:0.35;cursor:not-allowed}
.page-ellipsis{padding:8px 4px;font-size:13px;color:var(--ink-soft)}

/* ===== Footer ===== */
footer{background:var(--cream-deep);padding:32px 32px 20px;color:var(--ink-soft);font-size:13px;margin-top:auto}
.footer-inner{max-width:1240px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px}
.footer-links{display:flex;gap:20px}
.footer-links a{color:var(--ink-soft)}
.footer-links a:hover{color:var(--p)}

/* ===== Responsive ===== */
@media(max-width:960px){
  .nav-inner{padding:12px 20px}
  main{padding:24px 20px 48px}
  .search-hero-title{font-size:24px}
  .filters-section{gap:16px}
  .result-card{padding:16px 18px}
}
@media(max-width:600px){
  .nav-inner{padding:10px 16px;gap:10px}
  main{padding:20px 16px 40px}
  .search-hero-title{font-size:20px}
  .search-box{padding:12px 14px}
  .search-box input{font-size:14px}
  .filters-section{gap:12px}
  .filter-group{width:100%}
  .result-card-head{flex-direction:column;gap:8px}
  .result-name{font-size:15px}
  .result-meta{gap:4px}
  .pagination{gap:4px}
  .page-btn{padding:6px 10px;font-size:12px;min-width:28px}
}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="/" class="brand"><div class="brand-mark">风</div><span>风声</span></a>
    <div class="nav-divider"></div>
    <a href="/knowledge/" class="nav-back">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3L5 8l5 5"/></svg>
      知识底座
    </a>
  </div>
</nav>

<main>
  <!-- Search Hero -->
  <section class="search-hero">
    <h1 class="search-hero-title">知识搜索</h1>
    <p class="search-hero-sub">在风声知识底座中检索词条，支持加权匹配与高亮展示</p>
    <div class="search-wrapper">
      <div class="search-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" id="searchInput" placeholder="输入关键词搜索词条..." autocomplete="off" autofocus>
        <button class="search-clear" id="searchClear" aria-label="清除搜索">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>
        </button>
        <div class="search-spinner" id="searchSpinner"></div>
      </div>
      <div class="suggestions" id="suggestions"></div>
    </div>
  </section>

  <!-- Filters -->
  <section class="filters-section" id="filtersSection">
    <div class="filter-group" id="entryTypeGroup">
      <span class="filter-label">类型</span>
      <div class="filter-chips" id="entryTypeChips"></div>
    </div>
    <div class="filter-group" id="severityGroup">
      <span class="filter-label">严重度</span>
      <div class="filter-chips" id="severityChips"></div>
    </div>
    <div class="filter-group" id="layerGroup">
      <span class="filter-label">层级</span>
      <div class="filter-chips" id="layerChips"></div>
    </div>
  </section>

  <!-- Results Header -->
  <div class="results-header" id="resultsHeader" style="display:none">
    <div class="results-count" id="resultsCount"></div>
    <div class="results-sort" id="resultsSort"></div>
  </div>

  <!-- Error State -->
  <div class="error-state" id="errorState" style="display:none">
    <div class="error-title" id="errorTitle"></div>
    <div class="error-desc" id="errorDesc"></div>
  </div>

  <!-- Results -->
  <div class="results-list" id="resultsList"></div>

  <!-- Empty State -->
  <div class="empty-state" id="emptyState">
    <div class="empty-icon">&#128269;</div>
    <div class="empty-title">输入关键词开始搜索</div>
    <div class="empty-desc">支持按词条名称、别名、消费者问题、一句话答案等字段进行加权搜索</div>
  </div>

  <!-- Pagination -->
  <div class="pagination" id="pagination" style="display:none"></div>
</main>

<footer>
  <div class="footer-inner">
    <div>&copy; 风声 · 知识底座</div>
    <div class="footer-links">
      <a href="/knowledge/">知识底座</a>
      <a href="/">首页</a>
    </div>
  </div>
</footer>

<script>
(function() {
  'use strict';

  // ========== State ==========
  const state = {
    query: '',
    results: [],
    total: 0,
    page: 1,
    pageSize: 20,
    totalPages: 1,
    loading: false,
    filters: { entryType: '', severity: '', layer: '' },
    filterOptions: { entryTypes: [], severities: [] },
    suggestTimer: null,
    suggestAbort: null,
    searchAbort: null,
  };

  // ========== DOM Refs ==========
  const $input = document.getElementById('searchInput');
  const $clear = document.getElementById('searchClear');
  const $spinner = document.getElementById('searchSpinner');
  const $suggestions = document.getElementById('suggestions');
  const $resultsHeader = document.getElementById('resultsHeader');
  const $resultsCount = document.getElementById('resultsCount');
  const $resultsSort = document.getElementById('resultsSort');
  const $resultsList = document.getElementById('resultsList');
  const $emptyState = document.getElementById('emptyState');
  const $errorState = document.getElementById('errorState');
  const $errorTitle = document.getElementById('errorTitle');
  const $errorDesc = document.getElementById('errorDesc');
  const $pagination = document.getElementById('pagination');
  const $entryTypeChips = document.getElementById('entryTypeChips');
  const $severityChips = document.getElementById('severityChips');
  const $layerChips = document.getElementById('layerChips');

  // ========== Layer Options ==========
  const LAYER_OPTIONS = [
    { value: 'matter', label: '物质' },
    { value: 'emotion', label: '情感' },
    { value: 'spirit', label: '精神' },
  ];

  // ========== Init ==========
  function init() {
    const params = new URLSearchParams(window.location.search);
    const q = params.get('q') || '';
    if (q) {
      $input.value = q;
      state.query = q;
      $clear.classList.add('visible');
      doSearch();
    }
    renderLayerChips();
    setupEvents();
  }

  // ========== Events ==========
  function setupEvents() {
    $input.addEventListener('input', onInput);
    $input.addEventListener('keydown', onKeydown);
    $input.addEventListener('focus', onFocus);
    $clear.addEventListener('click', onClear);
    document.addEventListener('click', onDocClick);
  }

  function onInput() {
    const val = $input.value.trim();
    state.query = val;
    if (val) {
      $clear.classList.add('visible');
    } else {
      $clear.classList.remove('visible');
      hideSuggestions();
      showEmptyState('init');
    }
    debounceSuggest(val);
  }

  function onKeydown(e) {
    if (e.key === 'Enter') {
      hideSuggestions();
      doSearch();
    }
    if (e.key === 'Escape') {
      hideSuggestions();
      $input.blur();
    }
  }

  function onFocus() {
    if (state.query && state.query.length >= 1) {
      fetchSuggest(state.query);
    }
  }

  function onClear() {
    $input.value = '';
    state.query = '';
    state.results = [];
    state.total = 0;
    state.page = 1;
    state.totalPages = 1;
    state.filters = { entryType: '', severity: '', layer: '' };
    state.filterOptions = { entryTypes: [], severities: [] };
    $clear.classList.remove('visible');
    hideSuggestions();
    hideResults();
    hideError();
    showEmptyState('init');
    $input.focus();
    updateURL();
    renderFilters();
    renderLayerChips();
  }

  function onDocClick(e) {
    if (!$suggestions.contains(e.target) && e.target !== $input) {
      hideSuggestions();
    }
  }

  // ========== Debounce Suggest ==========
  function debounceSuggest(q) {
    clearTimeout(state.suggestTimer);
    if (!q || q.length < 1) {
      hideSuggestions();
      return;
    }
    state.suggestTimer = setTimeout(() => fetchSuggest(q), 300);
  }

  // ========== Fetch Suggest ==========
  async function fetchSuggest(q) {
    if (state.suggestAbort) state.suggestAbort.abort();
    const controller = new AbortController();
    state.suggestAbort = controller;

    try {
      const resp = await fetch('/api/search/suggest?q=' + encodeURIComponent(q), {
        signal: controller.signal,
      });
      if (!resp.ok) throw new Error('Suggest failed');
      const data = await resp.json();
      if (controller.signal.aborted) return;
      renderSuggestions(data.suggestions || []);
    } catch (err) {
      if (err.name === 'AbortError') return;
      hideSuggestions();
    }
  }

  function renderSuggestions(items) {
    if (!state.query || state.query.length < 1) {
      hideSuggestions();
      return;
    }
    if (!items.length) {
      $suggestions.innerHTML = '<div class="suggest-empty">无匹配词条</div>';
      $suggestions.classList.add('active');
      return;
    }
    let html = '';
    for (const item of items) {
      html += '<div class="suggest-item" data-id="' + escapeHtml(item.id) + '" data-name="' + escapeHtml(item.name) + '">' +
        '<span class="si-icon">&#128221;</span>' +
        '<div class="si-content">' +
        '<div class="si-name">' + highlightText(item.name, state.query) + '</div>' +
        '<div class="si-desc">' + escapeHtml(item.oneLineAnswer || '') + '</div>' +
        '</div>' +
        '<span class="si-meta">' + escapeHtml(item.subScene || item.domain || '') + '</span>' +
        '</div>';
    }
    $suggestions.innerHTML = html;
    $suggestions.classList.add('active');

    // Click handlers
    $suggestions.querySelectorAll('.suggest-item').forEach(el => {
      el.addEventListener('click', function() {
        const name = this.dataset.name;
        $input.value = name;
        state.query = name;
        $clear.classList.add('visible');
        hideSuggestions();
        doSearch();
      });
    });
  }

  function hideSuggestions() {
    $suggestions.classList.remove('active');
    $suggestions.innerHTML = '';
  }

  // ========== Fetch Search ==========
  async function doSearch(page) {
    if (!state.query || state.query.length < 2) {
      if (state.query.length === 1) {
        showError('提示', '请提供至少2个字符的搜索关键词');
      }
      return;
    }
    if (page) state.page = page;
    else state.page = 1;

    if (state.searchAbort) state.searchAbort.abort();
    const controller = new AbortController();
    state.searchAbort = controller;

    state.loading = true;
    showLoading();
    hideError();
    hideEmpty();

    let url = '/api/search/v2?q=' + encodeURIComponent(state.query) +
      '&page=' + state.page + '&pageSize=' + state.pageSize;
    if (state.filters.entryType) url += '&entryType=' + encodeURIComponent(state.filters.entryType);
    if (state.filters.severity) url += '&severity=' + encodeURIComponent(state.filters.severity);
    if (state.filters.layer) url += '&layer=' + encodeURIComponent(state.filters.layer);

    updateURL();

    try {
      const resp = await fetch(url, { signal: controller.signal });
      if (!resp.ok) {
        if (resp.status === 429) {
          showError('请求过于频繁', '请稍等片刻后再试 (30秒内最多5次搜索)');
        } else {
          showError('搜索失败', '服务器返回状态码 ' + resp.status);
        }
        hideLoading();
        return;
      }
      const data = await resp.json();
      if (controller.signal.aborted) return;

      state.results = data.results || [];
      state.total = data.total || 0;
      state.page = data.page || 1;
      state.pageSize = data.pageSize || 20;
      state.totalPages = data.totalPages || 1;
      state.filterOptions = data.filterOptions || { entryTypes: [], severities: [] };

      hideLoading();
      renderFilters();
      renderResults();
      renderPagination();
    } catch (err) {
      if (err.name === 'AbortError') return;
      showError('网络错误', '无法连接到搜索服务，请检查网络连接后重试');
      hideLoading();
    }
  }

  // ========== Render ==========
  function renderFilters() {
    // EntryType chips
    let etHtml = '<div class="filter-chip' + (!state.filters.entryType ? ' active' : '') + '" data-filter="entryType" data-value="">全部</div>';
    for (const et of (state.filterOptions.entryTypes || [])) {
      etHtml += '<div class="filter-chip' + (state.filters.entryType === et ? ' active' : '') + '" data-filter="entryType" data-value="' + escapeHtml(et) + '">' + escapeHtml(et) + '</div>';
    }
    $entryTypeChips.innerHTML = etHtml;

    // Severity chips
    let sevHtml = '<div class="filter-chip' + (!state.filters.severity ? ' active' : '') + '" data-filter="severity" data-value="">全部</div>';
    for (const sev of (state.filterOptions.severities || [])) {
      sevHtml += '<div class="filter-chip' + (state.filters.severity === sev ? ' active' : '') + '" data-filter="severity" data-value="' + escapeHtml(sev) + '">' + severityLabel(sev) + '</div>';
    }
    $severityChips.innerHTML = sevHtml;

    // Click handlers
    document.querySelectorAll('#entryTypeChips .filter-chip, #severityChips .filter-chip, #layerChips .filter-chip').forEach(chip => {
      chip.addEventListener('click', function() {
        const filter = this.dataset.filter;
        const value = this.dataset.value;
        state.filters[filter] = value;
        renderFilters();
        renderLayerChips();
        doSearch(1);
      });
    });
  }

  function renderLayerChips() {
    let html = '<div class="filter-chip' + (!state.filters.layer ? ' active' : '') + '" data-filter="layer" data-value="">全部</div>';
    for (const layer of LAYER_OPTIONS) {
      html += '<div class="filter-chip' + (state.filters.layer === layer.value ? ' active' : '') + '" data-filter="layer" data-value="' + layer.value + '">' + layer.label + '</div>';
    }
    $layerChips.innerHTML = html;
  }

  function renderResults() {
    if (!state.results.length) {
      $resultsList.innerHTML = '';
      $resultsHeader.style.display = 'none';
      $pagination.style.display = 'none';
      showEmptyState('noResults');
      return;
    }

    $resultsHeader.style.display = 'flex';
    $resultsCount.innerHTML = '共 <span class="num">' + state.total + '</span> 条结果';
    $resultsSort.innerHTML = '按匹配度排序';

    let html = '';
    for (const r of state.results) {
      const nameHl = highlightText(r.name, state.query);
      const descHl = highlightText(r.oneLineAnswer || '', state.query);
      const sevClass = r.severity ? 'severity-' + r.severity : '';
      const priClass = r.priority ? ('priority-' + r.priority) : 'priority';

      html += '<div class="result-card" data-id="' + escapeHtml(r.id) + '">' +
        '<div class="result-card-head">' +
        '<div class="result-name">' + nameHl + '</div>' +
        '<div class="result-score">' + r.score + '</div>' +
        '</div>' +
        '<div class="result-meta">';
      if (r.entryType) html += '<span class="meta-tag entryType">' + escapeHtml(r.entryType) + '</span>';
      if (r.severity) html += '<span class="meta-tag ' + sevClass + '">' + severityLabel(r.severity) + '</span>';
      if (r.priority) html += '<span class="meta-tag ' + priClass + '">' + escapeHtml(r.priority) + '</span>';
      html += '</div>' +
        '<div class="result-desc">' + descHl + '</div>' +
        '<div class="result-highlights">';
      if (r.highlights && r.highlights.length) {
        for (const h of r.highlights) {
          html += '<span class="highlight-tag">' + highlightLabel(h) + '</span>';
        }
      }
      html += '</div></div>';
    }
    $resultsList.innerHTML = html;
    $emptyState.style.display = 'none';
  }

  function renderPagination() {
    if (state.totalPages <= 1) {
      $pagination.style.display = 'none';
      return;
    }
    $pagination.style.display = 'flex';

    let html = '';
    // Prev
    html += '<button class="page-btn" data-page="' + (state.page - 1) + '"' + (state.page <= 1 ? ' disabled' : '') + '>&#8249; 上一页</button>';

    // Pages
    const maxVisible = 5;
    let start = Math.max(1, state.page - Math.floor(maxVisible / 2));
    let end = Math.min(state.totalPages, start + maxVisible - 1);
    if (end - start < maxVisible - 1) start = Math.max(1, end - maxVisible + 1);

    if (start > 1) {
      html += '<button class="page-btn" data-page="1">1</button>';
      if (start > 2) html += '<span class="page-ellipsis">...</span>';
    }
    for (let i = start; i <= end; i++) {
      html += '<button class="page-btn' + (i === state.page ? ' active' : '') + '" data-page="' + i + '"' + (i === state.page ? ' disabled' : '') + '>' + i + '</button>';
    }
    if (end < state.totalPages) {
      if (end < state.totalPages - 1) html += '<span class="page-ellipsis">...</span>';
      html += '<button class="page-btn" data-page="' + state.totalPages + '">' + state.totalPages + '</button>';
    }

    // Next
    html += '<button class="page-btn" data-page="' + (state.page + 1) + '"' + (state.page >= state.totalPages ? ' disabled' : '') + '>下一页 &#8250;</button>';

    $pagination.innerHTML = html;

    // Click handlers
    $pagination.querySelectorAll('.page-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        const page = parseInt(this.dataset.page, 10);
        if (page && page >= 1 && page <= state.totalPages) {
          doSearch(page);
          window.scrollTo({ top: $resultsList.offsetTop - 120, behavior: 'smooth' });
        }
      });
    });
  }

  // ========== Helpers ==========
  function highlightText(text, query) {
    if (!query || !text) return escapeHtml(text);
    const escaped = escapeHtml(text);
    const qEscaped = escapeHtml(query);
    // Escape regex special chars in query
    const qRegex = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const re = new RegExp('(' + qRegex + ')', 'gi');
    return escaped.replace(re, '<mark>$1</mark>');
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function severityLabel(sev) {
    const map = { hard: '硬性', medium: '中性', soft: '柔性' };
    return map[sev] || sev;
  }

  function highlightLabel(h) {
    const map = {
      'name:exact': '名称精确匹配',
      'name': '名称匹配',
      'alias': '别名匹配',
      'consumerQ:exact': '消费者问题精确匹配',
      'consumerQ': '消费者问题匹配',
      'oneLineAnswer': '一句话答案匹配',
      'def': '定义匹配',
      'subScene': '子场景匹配',
    };
    return map[h] || h;
  }

  function showLoading() {
    $spinner.classList.add('visible');
  }

  function hideLoading() {
    state.loading = false;
    $spinner.classList.remove('visible');
  }

  function showEmptyState(type) {
    $resultsList.innerHTML = '';
    $resultsHeader.style.display = 'none';
    $pagination.style.display = 'none';
    $emptyState.style.display = 'block';
    if (type === 'noResults') {
      $emptyState.querySelector('.empty-icon').innerHTML = '&#128270;';
      $emptyState.querySelector('.empty-title').textContent = '未找到匹配结果';
      $emptyState.querySelector('.empty-desc').textContent = '尝试更换关键词或调整筛选条件';
    } else {
      $emptyState.querySelector('.empty-icon').innerHTML = '&#128269;';
      $emptyState.querySelector('.empty-title').textContent = '输入关键词开始搜索';
      $emptyState.querySelector('.empty-desc').textContent = '支持按词条名称、别名、消费者问题、一句话答案等字段进行加权搜索';
    }
  }

  function hideEmpty() {
    $emptyState.style.display = 'none';
  }

  function hideResults() {
    $resultsList.innerHTML = '';
    $resultsHeader.style.display = 'none';
    $pagination.style.display = 'none';
  }

  function showError(title, desc) {
    $errorTitle.textContent = title;
    $errorDesc.textContent = desc;
    $errorState.style.display = 'block';
  }

  function hideError() {
    $errorState.style.display = 'none';
  }

  function updateURL() {
    const url = new URL(window.location);
    if (state.query) {
      url.searchParams.set('q', state.query);
    } else {
      url.searchParams.delete('q');
    }
    window.history.replaceState({}, '', url);
  }

  // ========== Start ==========
  init();
})();
</script>
</body>
</html>
