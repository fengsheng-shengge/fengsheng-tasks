<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>风声 · 掌握度测评</title>
<meta name="description" content="风声知识库掌握度测评 · 按业务模块与场景出题，检验对知识底座的掌握，错题可反查词条温习。">
<style>
:root{
  --p:#3d5a3e;--p-light:#5a7d5b;--fire:#c46a3a;--fire-light:#e08a3c;
  --cream:#f7f4ef;--cream-deep:#ede7dc;--ink:#1a2b26;--ink-soft:#5a6b65;
  --wood:#c8956d;--line:rgba(61,90,62,0.12);
  --shadow-sm:0 2px 8px rgba(61,90,62,0.06);
  --shadow-md:0 8px 24px rgba(61,90,62,0.10);
  --green:#4caf7d;--red:#d65b5b;--orange:#f0a24e;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--cream);color:var(--ink);line-height:1.6}
.wrap{max-width:860px;margin:0 auto;padding:32px 20px 80px}

/* Nav */
.nav{position:sticky;top:0;z-index:100;background:rgba(247,244,239,0.9);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
.nav-inner{max-width:1240px;margin:0 auto;padding:14px 32px;display:flex;align-items:center;gap:24px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px}
.brand-mark{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--p),var(--p-light));display:grid;place-items:center;color:white;font-weight:800}
.nav-back{font-size:13px;color:var(--ink-soft);cursor:pointer}
.nav-back:hover{color:var(--p)}

.head{text-align:center;padding:36px 0 16px}
.head .tag{display:inline-flex;align-items:center;gap:6px;padding:5px 14px;border-radius:100px;background:rgba(61,90,62,0.08);color:var(--p);font-size:13px;font-weight:500;margin-bottom:16px}
.head h1{font-size:32px;font-weight:800;letter-spacing:-0.5px;margin-bottom:10px}
.head p{color:var(--ink-soft);font-size:14px}
.head p b{color:var(--p)}

.step-title{display:flex;align-items:center;gap:10px;margin:28px 0 14px;font-weight:700}
.step-no{width:24px;height:24px;border-radius:50%;background:var(--p);color:white;display:grid;place-items:center;font-size:12px;flex-shrink:0}
.step-title span{font-size:15px}

/* 模块选择 */
.modules{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.module-card{background:white;border:1.5px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;transition:all .2s;display:flex;flex-direction:column;gap:4px}
.module-card .m-icon{font-size:22px}
.module-card .m-name{font-weight:700;font-size:14px}
.module-card .m-count{font-size:11px;color:var(--ink-soft)}
.module-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:var(--p)}
.module-card.selected{border-color:var(--fire);background:#fff8f2}

/* 场景 */
.scenes{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.scene-chip{padding:7px 16px;border-radius:100px;background:white;border:1px solid var(--line);font-size:13px;color:var(--ink-soft);cursor:pointer;transition:all .15s}
.scene-chip:hover{border-color:var(--p);color:var(--p)}
.scene-chip.selected{background:var(--p);color:white;border-color:var(--p);font-weight:600}
.quiz-panel{background:white;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-sm);overflow:hidden}
.q-progress{padding:12px 20px;background:var(--cream-deep);font-size:12px;color:var(--ink-soft);display:flex;justify-content:space-between;align-items:center}
.q-body{padding:24px 24px 20px}
.q-stem{font-size:16px;font-weight:700;margin-bottom:18px;line-height:1.7}
.q-mode{font-size:11px;padding:3px 10px;border-radius:100px;background:rgba(61,90,62,0.1);color:var(--p);margin-left:8px;font-weight:600;vertical-align:middle}
.q-options{display:flex;flex-direction:column;gap:10px}
.q-opt{padding:12px 16px;border:1.5px solid var(--line);border-radius:10px;cursor:pointer;font-size:14px;transition:all .15s;font-weight:500}
.q-opt:hover{border-color:var(--p);background:rgba(61,90,62,0.03)}
.q-opt.correct{border-color:var(--green);background:rgba(76,175,125,0.12);color:#2e7d5b}
.q-opt.wrong{border-color:var(--red);background:rgba(214,91,91,0.1);color:#b03a3a}
.q-opt.disabled{cursor:default;opacity:1}
.q-cta{display:flex;justify-content:space-between;align-items:center;padding:14px 24px;border-top:1px solid var(--line)}
.btn{padding:10px 24px;border-radius:8px;border:none;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s}
.btn-primary{background:var(--p);color:white}
.btn-primary:hover{background:var(--p-light)}
.btn-ghost{background:transparent;color:var(--p);border:1px solid var(--line)}
.btn-ghost:hover{border-color:var(--p)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.explain{margin-top:16px;padding:14px 16px;border-radius:10px;background:var(--cream);border-left:3px solid var(--p);font-size:13px;line-height:1.7}
.explain b{color:var(--p)}
.review-link{margin-top:10px;font-size:12px;color:var(--fire);cursor:pointer;text-decoration:underline}

/* 结果 */
.result-hero{text-align:center;padding:40px 24px;background:white;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-sm)}
.result-score{font-size:56px;font-weight:800;color:var(--p);margin:8px 0}
.result-level{font-size:16px;font-weight:700;margin-bottom:6px}
.result-sub{color:var(--ink-soft);font-size:13px;margin-bottom:24px}
.weak-modules{text-align:left;max-width:520px;margin:0 auto 20px}
.weak-title{font-size:13px;font-weight:700;color:var(--p);margin-bottom:10px}
.weak-bar{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:12px}
.weak-bar .w-name{width:70px;flex-shrink:0;color:var(--ink-soft)}
.weak-bar .w-track{flex:1;height:8px;background:var(--cream-deep);border-radius:100px;overflow:hidden}
.weak-bar .w-fill{height:100%;border-radius:100px}
.result-actions{display:flex;gap:12px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.review-list{list-style:none;margin-top:16px;display:flex;flex-direction:column;gap:10px}
.review-item{padding:14px 16px;background:#fff4f0;border-left:3px solid var(--fire);border-radius:8px;font-size:13px;cursor:pointer}
.review-item:hover{background:#ffeadf}
.review-item .r-k{font-weight:600;margin-right:6px}
.hidden{display:none!important}
</style>
</head>
<body>
<nav class="nav">
  <div class="nav-inner">
    <div class="brand"><div class="brand-mark">风</div><span>风声</span><span class="nav-back" onclick="history.back()" style="margin-left:8px">← 返回</span></div>
  </div>
</nav>

<div class="wrap">
  <div class="head">
    <div class="tag"><span style="display:inline-block;width:6px;height:6px;background:var(--p);border-radius:50%"></span> 掌握度自测</div>
    <h1>知识库 · 按业务模块测评</h1>
    <p>从 <b id="statTotal">0</b> 道真实词条派生题中检验掌握度，错题可一键反查词条温习。</p>
  </div>

  <!-- 第一步：选模块 -->
  <div id="stepModule">
    <div class="step-title"><span class="step-no">1</span><span>选择业务模块</span></div>
    <div class="modules" id="moduleList"></div>
  </div>

  <!-- 第二步：选场景 -->
  <div id="stepScene" class="hidden">
    <div class="step-title"><span class="step-no">2</span><span>选择场景（<span id="sceneModuleName"></span>）</span></div>
    <div class="scenes" id="sceneList"></div>
  </div>

  <!-- 第三步：答题 -->
  <div id="stepQuiz" class="hidden">
    <div class="step-title"><span class="step-no">3</span><span id="quizTitle">开始答题</span></div>
    <div class="quiz-panel">
      <div class="q-progress"><span id="qProgress"></span><span id="qScore"></span></div>
      <div class="q-body" id="qBody"></div>
      <div class="q-cta">
        <button class="btn btn-ghost" id="prevBtn" onclick="prevQ()">上一题</button>
        <button class="btn btn-primary" id="nextBtn" onclick="nextQ()">下一题</button>
      </div>
    </div>
  </div>

  <!-- 第四步：结果 -->
  <div id="stepResult" class="hidden"></div>
</div>

<script src="quiz-data.js"></script>
<script>
var QUIZ = window.KNOWLEDGE_QUIZ || [];
var state = { moduleIdx:-1, sceneIdx:-1, qs:[], cur:0, picks:{}, answered:0 };

// 模块 view
function renderModules(){
  document.getElementById('statTotal').textContent = QUIZ.reduce((n,m)=> n + m.scenes.reduce((a,s)=>a+s.questions.length,0), 0);
  var el = document.getElementById('moduleList'); el.innerHTML='';
  QUIZ.forEach(function(m, i){
    var n = m.scenes.reduce(function(a,s){return a+s.questions.length;},0);
    var d = document.createElement('div');
    d.className='module-card'; d.innerHTML='<div class="m-icon">'+m.icon+'</div><div class="m-name">'+m.domain+'</div><div class="m-count">'+n+' 题</div>';
    d.onclick=function(){ selectModule(i); };
    el.appendChild(d);
  });
}
function selectModule(i){
  state.moduleIdx=i; state.cur=0; state.picks={}; state.answered=0;
  document.getElementById('stepModule').classList.add('hidden');
  document.getElementById('stepScene').classList.remove('hidden');
  document.getElementById('sceneModuleName').textContent = QUIZ[i].domain;
  renderScenes();
}
function renderScenes(){
  var el=document.getElementById('sceneList'); el.innerHTML='';
  QUIZ[state.moduleIdx].scenes.forEach(function(s, j){
    var c=document.createElement('div'); c.className=s.scene?'scene-chip':'scene-chip';
    if(j===state.sceneIdx) c.className+=' selected';
    c.textContent = s.scene + ' ('+s.questions.length+')';
    c.onclick=function(){ startQuiz(j); };
    el.appendChild(c);
  });
}
function startQuiz(j){
  state.sceneIdx=j;
  var m=QUIZ[state.moduleIdx], s=m.scenes[j];
  state.qs=s.questions; state.cur=0; state.picks={}; state.answered=0;
  document.getElementById('quizTitle').textContent = m.domain + ' · ' + s.scene;
  document.getElementById('stepScene').classList.add('hidden');
  document.getElementById('stepQuiz').classList.remove('hidden');
  renderQ();
}
function shuffle(arr){ for(var i=arr.length-1;i>0;i--){var k=Math.floor(Math.random()*(i+1));var t=arr[i];arr[i]=arr[k];arr[k]=t;} return arr; }
function renderQ(){
  var q=state.qs[state.cur], qb=document.getElementById('qBody'), pg=document.getElementById('qProgress'), sc=document.getElementById('qScore');
  pg.textContent = '第 '+(state.cur+1)+' / '+state.qs.length+' 题';
  sc.textContent = sc.textContent = state.answered+' / '+state.qs.length+' 已答';
  qb.innerHTML='';
  var stem=document.createElement('div'); stem.className='q-stem';
  stem.innerHTML = (state.cur+1)+'. '+q.stem;
  if(q.type==='judge'){
    var mode=document.createElement('span'); mode.className='q-mode'; mode.textContent='判断题'; stem.appendChild(mode);
  } else {
    var mode2=document.createElement('span'); mode2.className='q-mode'; mode2.textContent='选择题'; stem.appendChild(mode2);
  }
  qb.appendChild(stem);
  var opts=document.createElement('div'); opts.className='q-options';
  if(q.type==='judge'){
    ['对','错'].forEach(function(txt){
      opts.appendChild(makeOpt(txt, txt==='对'?'true':'false', q));
    });
  } else {
    q.options.forEach(function(opt,k){
      opts.appendChild(makeOpt(opt, 'option'+k, q, k));
    });
  }
  qb.appendChild(opts);
  var picked = state.picks[state.cur];
  if(picked!==undefined) reveal(q, picked);
  document.getElementById('prevBtn').disabled = state.cur===0;
  document.getElementById('nextBtn').textContent = state.cur===state.qs.length-1 ? '交卷' : '下一题';
}
function makeOpt(label, val, q, k){
  var o=document.createElement('div'); o.className='q-opt'; o.textContent=label;
  o.dataset.val=val; o.dataset.k = k===undefined?'':k;
  o.onclick=function(){ pick(q,val,k); };
  return o;
}
function pick(q,val,k){
  if(state.picks[state.cur]!==undefined) return;
  state.picks[state.cur]=val;
  state.answered++;
  reveal(q);
}
function reveal(q){
  var qb=document.getElementById('qBody');
  var chosen = state.picks[state.cur];
  var opts=qb.querySelectorAll('.q-opt'); opts.forEach(function(o){ o.classList.add('disabled'); });
  if(q.type==='judge'){
    opts[ q.answer ? 0 : 1 ].classList.add('correct');
    if(chosen && String(q.answer)!==chosen) opts[ chosen==='true'?0:1 ].classList.add('wrong');
  } else {
    q.options.forEach(function(opt,k){ if(opt.indexOf(q.answer+'.')===0){ opts[k].classList.add('correct'); } });
    if(chosen){ var ck=parseInt(chosen.replace('option','')); if(q.options[ck].indexOf(q.answer+'.')!==0){ opts[ck].classList.add('wrong'); } }
  }
  // 解析说明
  if(chosen!==undefined){
    var isR = q.type==='judge' ? chosen===String(q.answer) : q.options[parseInt(chosen.replace('option',''))].indexOf(q.answer+'.')===0;
    var exp=document.createElement('div'); exp.className='explain';
    exp.innerHTML='<b>'+ (isR?'✓ 回答正确':'✗ 回答有误') +'</b>　'+(q.explanation||'');
    var rv=document.createElement('div'); rv.className='review-link';
    rv.textContent='📖 温习词条：'+ q.entry;
    rv.onclick=function(){ window.open('/dictionary/?q='+encodeURIComponent(q.entry)); };
    exp.appendChild(rv); qb.appendChild(exp);
  }
}
function nextQ(){
  if(state.cur===state.qs.length-1){ finish(); return; }
  state.cur++; renderQ();
}
function prevQ(){ if(state.cur>0){ state.cur--; renderQ(); } }
function finish(){
  var m=QUIZ[state.moduleIdx], s=m.scenes[state.sceneIdx];
  var qs=state.qs, total=qs.length, right=0, wrongs=[];
  qs.forEach(function(q,i){
    var p=state.picks[i];
    if(p===undefined){ wrongs.push({i:i,q:q,p:null}); return; }
    var ok = q.type==='judge' ? p===String(q.answer) : q.options[parseInt(p.replace('option',''))].indexOf(q.answer+'.')===0;
    if(ok) right++; else wrongs.push({i:i,q:q,p:p});
  });
  var pct=Math.round(right/total*100);
  var lvl = pct>=90? '掌握优秀' : pct>=70? '基本掌握' : pct>=50? '有待加强' : '需要重学';
  var tag = lvl==='掌握优秀'? 'var(--green)' : lvl==='基本掌握'? 'var(--orange)' : 'var(--red)';
  document.getElementById('stepQuiz').classList.add('hidden');
  document.getElementById('stepResult').classList.remove('hidden');
  var el=document.getElementById('stepResult');
  el.innerHTML='';
  var hero=document.createElement('div'); hero.className='result-hero';
  hero.innerHTML='<div style="font-size:13px;color:var(--ink-soft)">'+m.domain+' · '+s.scene+'　完成</div>'+
    '<div class="result-score">'+pct+'<span style="font-size:20px">%</span></div>'+
    '<div class="result-level" style="color:'+tag+'">'+lvl+'</div>'+
    '<div class="result-sub">答对 '+right+' / '+total+' 题</div>'+
    '<div class="result-actions">'+
    '<button class="btn btn-primary" onclick="location.reload()">再测一次</button>'+
    '<button class="btn btn-ghost" onclick="location.href=\'/dictionary/\'">去词典温习</button></div>';
  el.appendChild(hero);
  if(wrongs.length){
    var wk=document.createElement('div'); wk.className='weak-modules';
    wk.innerHTML='<div class="weak-title">错题温习清单（'+(total-right)+'）</div>';
    var ul=document.createElement('ul'); ul.className='review-list';
    wrongs.forEach(function(w){
      var li=document.createElement('li'); li.className='review-item';
      li.innerHTML='<span class="r-k">'+(w.i+1)+'.</span>'+w.q.stem;
      if(w.q.type!=='judge' && w.p!==undefined){ var ck=parseInt(w.p.replace('option','')); li.innerHTML+='<div style="color:var(--red);font-size:12px;margin-top:4px">你的答案：'+(w.q.options[ck]||'未答')+'</div>'; }
      var hint=document.createElement('div'); hint.className='review-link';
      hint.textContent='📖 温习词条：'+w.q.entry; hint.onclick=function(){ window.open('/dictionary/?q='+encodeURIComponent(w.q.entry)); };
      li.appendChild(hint); ul.appendChild(li);
    });
    wk.appendChild(ul); el.appendChild(wk);
  }
}
renderModules();
</script>
</body>
</html>
