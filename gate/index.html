<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>内部访问 · 风声聚匠星云</title>
<style>
:root{--bg:#f7f5f0;--card:#fff;--border:rgba(26,61,36,.12);--brand:#1a3d24;--brand-l:#2d5a3d;--tx:#555;--dk:#1a1a1a;--ts:#7a8478;--err:#c0392b}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft YaHei","PingFang SC",-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;line-height:1.6}
.card{width:100%;max-width:360px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:32px 28px;text-align:center}
.badge{display:inline-block;font-size:11px;font-weight:700;color:var(--brand);background:rgba(26,61,36,.07);border:1px solid rgba(26,61,36,.16);border-radius:20px;padding:4px 14px;margin-bottom:16px}
h1{font-size:22px;font-weight:800;color:var(--dk);margin-bottom:8px}
p.sub{font-size:13px;color:var(--ts);margin-bottom:22px}
form{display:flex;flex-direction:column;gap:12px}
input{width:100%;padding:12px 14px;font-size:15px;font-family:inherit;border:1.5px solid var(--border);border-radius:10px;background:#fff;color:var(--dk);outline:none;transition:border-color .2s}
input:focus{border-color:var(--brand)}
button{padding:12px 14px;font-size:15px;font-weight:700;font-family:inherit;color:#fff;background:var(--brand);border:none;border-radius:10px;cursor:pointer;transition:background .2s}
button:hover{background:var(--brand-l)}
button:disabled{opacity:.6;cursor:not-allowed}
.msg{min-height:20px;margin-top:12px;font-size:13px;color:var(--err)}
.back{display:inline-block;margin-top:18px;font-size:12px;color:var(--ts);text-decoration:none}
.back:hover{color:var(--brand)}

/* ===== 响应式：平板 ===== */
@media (max-width: 900px){
  /* body 是 flex 居中，页脚作为兄弟节点会被挤到卡片右侧，这里改为纵向排列 */
  body{flex-direction:column;align-items:stretch;justify-content:flex-start;padding:20px 16px}
  .card{max-width:100%}
}

/* ===== 响应式：手机 ===== */
@media (max-width: 768px){
  body{flex-direction:column;align-items:stretch;justify-content:flex-start;padding:16px 14px}
  .card{max-width:100%;padding:26px 20px;border-radius:14px}
  h1{font-size:20px}
  input,button{font-size:16px}
  footer{margin-top:20px}
}

/* ===== 响应式：窄屏 ===== */
@media (max-width: 380px){
  .card{padding:22px 16px}
  h1{font-size:19px}
}
</style>

<!-- V2.2 移动端全局补丁 -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style id="__fs_mobile_patch">
  /* === 1. 基础保护：禁止横向溢出 === */
  html, body { max-width: 100vw; overflow-x: hidden; -webkit-text-size-adjust: 100%; }
  body { min-height: 100dvh; }
  
  /* === 2. 图片视频防宽溢出 === */
  img, video, canvas, svg, iframe, object, embed { max-width: 100%; height: auto; }
  
  /* === 3. 触控目标 ≥ 44px (Apple 推荐) === */
  @media (max-width: 768px) {
    a, button, [role="button"], input, select, textarea {
      min-height: 44px;
      font-size: max(14px, 1rem); /* 避免 iOS 自动放大 */
    }
    input[type="text"], input[type="tel"], input[type="email"], select, textarea {
      font-size: 16px !important; /* iOS 聚焦不放大 */
    }
    .js-ad, .topbar, .top-nav { min-height: 48px; }
  }
  
  /* === 4. 480px 断点：核心折叠 === */
  @media (max-width: 480px) {
    /* 禁止横向滚动兜底 */
    * { max-width: 100%; box-sizing: border-box; }
    
    /* 固定/粘性顶部栏 桌面宽度强制收敛 */
    .top-nav, .topbar, .fs-top-nav, .mentor-top-bar, 
    [class*="top-nav"], [class*="topbar"], [class*="fixed-top"],
    .role-banner, .three-step-bar, .value-intro, .growth-bar,
    .search-section, .filter-zone, .proof-strip, .proof-cards,
    .kb-trust-grid, .kb-trust-card, .pillar-icons, .stats,
    .fs-guide-panel {
      width: 100% !important;
      max-width: 100vw !important;
      overflow-x: hidden !important;
    }
    
    /* 汉堡菜单替代：如果有 .nav-links 这类固定宽度 div，改为 auto-flow */
    .domain-tabs, .skill-tabs, .stage-tabs, .module-tabs,
    [class*="-tabs"], [class*="-links"], [class*="-nav-links"] {
      flex-wrap: wrap !important;
      max-width: 100vw !important;
    }
    
    /* 两列网格降为单列 */
    [class*="grid-2"], [class*="-grid-2"] { grid-template-columns: 1fr !important; }
    
    /* 三列及以上降为单列或双列 */
    [class*="grid-3"], [class*="-grid-3"], 
    [class*="grid-4"], [class*="-grid-4"],
    [class*="grid-5"], [class*="-grid-5"] { grid-template-columns: 1fr !important; }
    
    /* hero 标题缩字号 */
    h1, .hero h1 { font-size: 1.6rem !important; line-height: 1.3 !important; }
    h2 { font-size: 1.3rem !important; }
    h3 { font-size: 1.15rem !important; }
    
    /* 搜索框全宽 */
    input[type="search"], .search-input, .fs-search-input { width: 100% !important; max-width: 100% !important; }
  }
  
  /* === 5. 375px 断点：终极收敛 === */
  @media (max-width: 375px) {
    .hero h1 { font-size: 1.4rem !important; }
    .section-title { font-size: 1.15rem !important; }
    h1, .hero h1 { font-size: 1.4rem !important; }
    .care-grid, .benefits, .mentors { grid-template-columns: 1fr !important; }
    .care-grid > *, .benefits > * { grid-column: span 1 !important; }
  }
  
  /* === 6. safe-area-inset (iPhone) === */
  @supports (padding: max(0px)) {
    .topbar, .top-nav, .fs-top-nav { padding-top: max(16px, env(safe-area-inset-top)); }
  }
  
  /* === 7. 禁止用户缩放的 viewport 自动补充（如果页面有 user-scalable=no 就去掉）=== */
</style>

</head>
<body>
<main class="card">
  <div class="badge">内部页面</div>
  <h1>内部访问</h1>
  <p class="sub">此页面仅供内部使用，请输入访问口令。</p>
  <form id="gateForm">
    <input id="pass" type="password" placeholder="访问口令" autocomplete="current-password" required>
    <button type="submit" id="submitBtn">进入</button>
  </form>
  <div class="msg" id="msg"></div>
  <a class="back" href="/">← 返回首页</a>
</main>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var next = params.get('next') || '/';
  if (next.charAt(0) !== '/' || next.charAt(1) === '/') next = '/';
  var form = document.getElementById('gateForm');
  var input = document.getElementById('pass');
  var btn = document.getElementById('submitBtn');
  var msg = document.getElementById('msg');
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    msg.textContent = '';
    btn.disabled = true;
    fetch('/api/internal-gate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pass: input.value })
    }).then(function (r) {
      return r.json().then(function (j) { return { status: r.status, body: j }; });
    }).then(function (res) {
      btn.disabled = false;
      if (res.status === 200 && res.body && res.body.ok) {
        location.href = next;
      } else {
        msg.textContent = (res.body && res.body.error) || '口令不正确';
      }
    }).catch(function () {
      btn.disabled = false;
      msg.textContent = '网络异常，请稍后重试';
    });
  });
})();
</script>

</footer>

</script>
</body>
</html>
