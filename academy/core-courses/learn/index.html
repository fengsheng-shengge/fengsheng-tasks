function findCourseIdByDim(dim) {
  for (var k in COURSES) {
    if (COURSES[k].dim === dim) return parseInt(k);
  }
  return null;
}

function getProgress(dim) {
  try {
    return JSON.parse(localStorage.getItem('fs_course_progress') || '{}')[dim] || [];
  } catch(e) { return []; }
}
function saveProgress(dim, doneChapters) {
  var all;
  try { all = JSON.parse(localStorage.getItem('fs_course_progress') || '{}'); } catch(e) { all = {}; }
  all[dim] = doneChapters;
  localStorage.setItem('fs_course_progress', JSON.stringify(all));
}

function render() {
  var root = document.getElementById('course-root');
  var id = getQueryId();
  // v2：支持 ?dim=DIM-4 自动定位
  if (!id) {
    var dim = getQueryDim();
    if (dim) id = findCourseIdByDim(dim);
  }
  if (!id || !COURSES[id]) {
    root.innerHTML = '<div class="back-bar"><a href="/academy/core-courses/">← 返回核心课列表</a></div>' +
      '<div class="no-course">课程不存在 · <a href="/academy/core-courses/">查看全部 7 门课 →</a></div>';
    return;
  }
  var course = COURSES[id];
  var done = getProgress(course.dim);
  var pct = Math.round(done.length / course.chapters.length * 100);

  // header
  var html = '<div class="back-bar"><a href="/academy/core-courses/">← 返回核心课列表</a></div>' +
    '<div class="course-hdr">' +
      '<span class="ch-badge">' + course.dim + '</span>' +
      '<h1>' + course.name + '</h1>' +
      '<div class="ch-sub">' + course.desc + '</div>' +
      '<div class="ch-meta">' +
        '<span>📚 ' + course.chapters.length + ' 章节</span>' +
        '<span>⏱ ' + course.totalMin + ' 分钟</span>' +
        '<span>✅ 已完成 ' + done.length + '/' + course.chapters.length + '</span>' +
      '</div>' +
    '</div>';

  // progress
  html += '<div class="progress-box">' +
    '<div class="progress-bar"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +
    '<div class="progress-label">学习进度 · <span>' + pct + '%</span></div>' +
    '<div style="margin-top:12px;display:flex;gap:10px;flex-wrap:wrap">' +
      '<a href="/academy/exam/?dim=' + course.dim + '" style="display:inline-block;background:#1a3d24;color:#fff;font-size:13px;font-weight:700;padding:8px 18px;border-radius:8px;transition:background .15s" onmouseover="this.style.background=\'#2d5a3d\'" onmouseout="this.style.background=\'#1a3d24\'">📝 学完这门 · 考 ' + course.dim + '（10 题）→</a>' +
      '<a href="/academy/practice/" style="display:inline-block;background:#fdf9ef;color:#8a7040;font-size:13px;font-weight:600;padding:8px 18px;border-radius:8px;border:1px solid #e8e4da">🎭 去练场景对话</a>' +
      '<a href="/academy/profile/" style="display:inline-block;background:#fff;color:#666;font-size:13px;font-weight:600;padding:8px 18px;border-radius:8px;border:1px solid #e8e4da">📊 看能力画像</a>' +
    '</div>' +
  '</div>';

  // chapters
  html += '<div class="chapter-list">';
  course.chapters.forEach(function(ch, i) {
    var chClass = done.indexOf(i) >= 0 ? 'chapter done' : 'chapter';
    var tagText = ch.type.toUpperCase();
    var entryLink = ch.entryId ? '/entry/' + ch.entryId : null;
    html += '<div class="' + chClass + '" onclick="toggleChapter(this)">' +
      '<div class="chapter-top">' +
        '<span class="ch-top-num">' + String(i+1).padStart(2,'0') + '</span>' +
        '<span class="ch-top-title">' + ch.title + '</span>' +
        (ch.entryId ? '<span class="ch-top-tag ' + ch.type + '">LINK</span>' : '') +
        '<span class="ch-top-done">✓</span>' +
      '</div>' +
      '<div class="chapter-body">' +
        '<div class="ch-body-summary">' + ch.summary + '</div>' +
        (ch.points.length ? '<div class="ch-body-points"><strong>🎯 学习要点：</strong><ul>' +
          ch.points.map(function(p){ return '<li>' + p + '</li>'; }).join('') +
        '</ul></div>' : '') +
        (ch.ext && ch.ext.length ? '<div class="ch-body-ext">' +
          '<div class="ch-body-ext-title">📚 延伸学习 · 站外精选资源</div>' +
          ch.ext.map(function(e){ return '<div class="ch-body-ext-item">' +
            '<span class="ch-body-ext-plat">' + e.platform + '</span>' +
            '<div class="ch-body-ext-text">' +
              '<a href="' + e.url + '" target="_blank" rel="noopener">' + e.title + ' ↗</a>' +
              (e.why ? '<div class="why">' + e.why + '</div>' : '') +
            '</div>' +
          '</div>'; }).join('') +
        '</div>' : '') +
        '<div class="ch-body-actions">' +
          '<button class="ch-body-btn primary" onclick="markDone(' + id + ',' + i + ')">' +
            (done.indexOf(i) >= 0 ? '✓ 已完成' : '标记完成') +
          '</button>' +
          (entryLink ? '<a class="ch-body-btn secondary" href="' + entryLink + '" target="_blank">📖 查看知识底座 →</a>' : '') +
          '<a class="ch-body-btn secondary" href="/academy/practice/">🎭 去练习 →</a>' +
        '</div>' +
      '</div>' +
    '</div>';
  });
  html += '</div>';

  root.innerHTML = html;
}

function toggleChapter(el) {
  el.classList.toggle('chapter-open');
  // V2.2 七事件埋点: course_start（展开章节 = 开始学习）
  var title = el.querySelector('.ch-title');
  fsTrackSafe('course_start', { chapter: title ? title.textContent.trim() : '', action: 'toggle_open' });
}
function markDone(courseId, chIndex) {
  event.stopPropagation();
  var course = COURSES[courseId];
  var done = getProgress(course.dim);
  var pos = done.indexOf(chIndex);
  if (pos >= 0) done.splice(pos, 1); else done.push(chIndex);
  // V2.2 七事件埋点: course_start（完成/撤销完成 = 学习动作）
  fsTrackSafe('course_start', { course: course.name, dim: course.dim, chapter_idx: chIndex, action: pos >= 0 ? 'undo_done' : 'mark_done' });
  saveProgress(course.dim, done);
  render();
}

render();
</script>
</body>
</html>
