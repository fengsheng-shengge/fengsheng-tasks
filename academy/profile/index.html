*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#f7f5f0;color:#2b2b2b;line-height:1.6}

.ph-score-grade{font-size:11px;font-weight:700;margin-top:2px}

/* 雷达图 */
.radar-box{background:#fff;border:1px solid #e8e4da;border-radius:14px;padding:24px;margin-bottom:20px;text-align:center}
.radar-box .r-title{font-size:15px;font-weight:700;color:#1a3d24;margin-bottom:4px}
.radar-box .r-sub{font-size:12px;color:#999;margin-bottom:14px}
.radar-svg{width:340px;height:340px;margin:0 auto}
.radar-legend{display:flex;justify-content:center;gap:10px;margin-top:10px;font-size:11px;color:#999}
.radar-legend span{padding:2px 8px;border-radius:4px}

/* 维度表 */
.dim-table{background:#fff;border:1px solid #e8e4da;border-radius:14px;padding:16px 20px;margin-bottom:20px}
.dim-row{display:grid;grid-template-columns:64px 90px 1fr 50px 90px;gap:10px;padding:10px 0;border-bottom:1px solid #f0ece2;align-items:center;font-size:13px}
.dim-row:last-child{border-bottom:none}
.dim-row .d-code{font-size:10px;font-weight:700;color:#fff;background:#1a3d24;padding:2px 5px;border-radius:4px;text-align:center}
.dim-row .d-name{font-weight:600;color:#1a3d24;font-size:12.5px}
.dim-row .d-bar{background:#f0ece2;border-radius:4px;height:10px;overflow:hidden;position:relative}
.dim-row .d-fill{height:100%;border-radius:4px;transition:width .6s ease}
.dim-row .d-fill.strong{background:linear-gradient(90deg,#2d5a3d,#4a8c5f)}
.dim-row .d-fill.medium{background:linear-gradient(90deg,#8a7040,#b8995a)}
.dim-row .d-fill.weak{background:linear-gradient(90deg,#c25636,#d67a5c)}
.dim-row .d-score{font-weight:700;text-align:right;font-size:13px}
.dim-row .d-score.strong{color:#2d5a3d}
.dim-row .d-score.medium{color:#8a7040}
.dim-row .d-score.weak{color:#c25636}
.dim-row .d-action{font-size:11px;color:#1a3d24;text-align:right;font-weight:600}

/* 时间戳 */
.ts-row{text-align:center;font-size:11px;color:#aaa;margin-top:-12px;margin-bottom:20px}

.footer-note{max-width:880px;margin:40px auto 0;padding:22px 24px 34px;border-top:1px solid #e8e4da;font-size:12px;color:#999;text-align:center;line-height:1.9}

/* 趋势图 */
.trend-box{background:#fff;border:1px solid #e8e4da;border-radius:14px;padding:20px 24px;margin-bottom:20px}
.trend-box .t-title{font-size:14px;font-weight:700;color:#1a3d24;margin-bottom:4px}
.trend-box .t-sub{font-size:11.5px;color:#999;margin-bottom:14px}
.trend-empty{text-align:center;padding:28px;font-size:12px;color:#aaa}
.trend-empty .te-emoji{font-size:28px;margin-bottom:6px}
.dim-filter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.dim-filter .df-chip{font-size:11px;padding:3px 9px;border-radius:10px;background:#f0ece2;color:#6b5a3e;cursor:pointer;font-weight:600;transition:all .12s}
.dim-filter .df-chip:hover{background:#e8e4da}
.dim-filter .df-chip.on{background:#1a3d24;color:#fff}
</style>

  <p class="pg-sub">七维雷达图 · 测评+考核+练习分数回写 · 看得到自己的进步轨迹</p>

<script>
// ============================================================
//  能力画像 · 动态渲染
//  数据源：localStorage['fs_care_profile']（care-test 测评结果）
//  降级：无数据时显示骨架引导
// ============================================================

var DIM_ORDER = ['获客触达','需求洞察','专业方案','带看谈判','交易履约','售后复购','数字化协同'];
var DIM_ICONS = {'获客触达':'📣','需求洞察':'🔍','专业方案':'📐','带看谈判':'🤝','交易履约':'📝','售后复购':'💗','数字化协同':'🤖'};
var DIM_CODES = {'获客触达':'DIM-1','需求洞察':'DIM-2','专业方案':'DIM-3','带看谈判':'DIM-4','交易履约':'DIM-5','售后复购':'DIM-6','数字化协同':'DIM-7'};

// 默认骨架分数（无数据时降级）
var FALLBACK_SCORES = {'获客触达':65,'需求洞察':55,'专业方案':75,'带看谈判':40,'交易履约':85,'售后复购':50,'数字化协同':60};

// 维度弱项 → 学习路径建议
var DIM_ACTION = {
  '获客触达':    { weak:'/academy/core-courses/', strong:'/academy/practice/',  weakLabel:'去补门', strongLabel:'去练习' },
  '需求洞察':    { weak:'/academy/core-courses/', strong:'/academy/practice/',  weakLabel:'去补门', strongLabel:'去练习' },
  '专业方案':    { weak:'/academy/core-courses/', strong:'/academy/exam/',      weakLabel:'去补门', strongLabel:'复习' },
  '带看谈判':    { weak:'/academy/practice/',      strong:'/academy/exam/',      weakLabel:'去练习', strongLabel:'复习' },
  '交易履约':    { weak:'/academy/exam/',          strong:'/academy/core-courses/', weakLabel:'去考核', strongLabel:'复习' },
  '售后复购':    { weak:'/academy/core-courses/', strong:'/academy/practice/',  weakLabel:'去补门', strongLabel:'去练习' },
  '数字化协同':  { weak:'/academy/core-courses/', strong:'/academy/practice/',  weakLabel:'去补门', strongLabel:'去练习' },
};

function gradeOf(total) {
  if (total >= 80) return { label:'A 全面扎实，可做标杆', color:'#2d5a3d' };
  if (total >= 65) return { label:'B 整体扎实，部分可补强', color:'#3498db' };
  if (total >= 45) return { label:'C 能力缺口明显', color:'#f39c12' };
  return { label:'D 建议立即重点突破', color:'#e74c3c' };
}

function scoreClass(s) {
  if (s >= 65) return 'strong';
  if (s >= 45) return 'medium';
  return 'weak';
}

function formatDate(iso) {
  if (!iso) return '';
  try {
    var d = new Date(iso);
    return d.getFullYear() + '.' + String(d.getMonth()+1).padStart(2,'0') + '.' + String(d.getDate()).padStart(2,'0');
  } catch(e) { return iso; }
}

// === 雷达图 SVG 生成 ===
// 7 维 · 中心 (170,170) · 半径 140
function buildRadarSVG(scores) {
  var cx = 170, cy = 170, R = 140, n = 7;

  // 轴线 + 分层圆环
  var rings = '';
  [0.25, 0.5, 0.75, 1.0].forEach(function(r) {
    rings += '<circle cx="' + cx + '" cy="' + cy + '" r="' + (R * r) + '" fill="none" stroke="#e8e4da" stroke-width="1' + (r === 1 ? '' : ' stroke-dasharray="2,2"') + '"/>';
  });

  var axes = '';
  var labelElems = '';
  var points = [];

  for (var i = 0; i < n; i++) {
    var angle = (-90 + i * (360 / n)) * Math.PI / 180;
    var ax = cx + R * Math.cos(angle);
    var ay = cy + R * Math.sin(angle);
    axes += '<line x1="' + cx + '" y1="' + cy + '" x2="' + ax + '" y2="' + ay + '" stroke="#ccc" stroke-width="1"/>';

    var name = DIM_ORDER[i];
    var s = scores[name] || 50;
    var pr = Math.max(12, R * (s / 100));  // 最低 12px 半径（避免贴中心）
    var px = cx + pr * Math.cos(angle);
    var py = cy + pr * Math.sin(angle);
    points.push(px + ',' + py);

    // 维度标签（在最外圈外侧 24px 处）
    var lx = cx + (R + 22) * Math.cos(angle);
    var ly = cy + (R + 22) * Math.sin(angle);
    var anchor = Math.abs(Math.cos(angle)) < 0.1 ? 'middle' : (Math.cos(angle) > 0 ? 'start' : 'end');
    labelElems += '<text x="' + lx + '" y="' + ly + '" text-anchor="' + anchor + '" font-size="11" fill="#1a3d24" font-weight="700" dominant-baseline="middle">' + DIM_ICONS[name] + ' ' + name + '</text>';
  }

  return '<svg class="radar-svg" viewBox="0 0 340 340" xmlns="http://www.w3.org/2000/svg">' +
    rings + axes +
    '<polygon points="' + points.join(' ') + '" fill="rgba(26,61,36,.22)" stroke="#1a3d24" stroke-width="2"/>' +
    points.map(function(p) {
      var xy = p.split(',');
      return '<circle cx="' + xy[0] + '" cy="' + xy[1] + '" r="4.5" fill="#8a7040" stroke="#fff" stroke-width="1.5"/>';
    }).join('') +
    labelElems +
  '</svg>';
}

// === 主渲染 ===
function render() {
  var root = document.getElementById('profile-root');

  // === 双源合并 ===
  var care = null;
  try { care = JSON.parse(localStorage.getItem('fs_care_profile')); } catch(e) {}
  var examResults = {};
  try { examResults = JSON.parse(localStorage.getItem('fs_exam_results')) || {}; } catch(e) {}
  var history = [];
  try { history = JSON.parse(localStorage.getItem('fs_care_history')) || []; } catch(e) {}

  var careHasData = care && care.dim_scores && typeof care.dim_scores === 'object';

  var scores = {};
  var sources = {};
  for (var i = 0; i < DIM_ORDER.length; i++) {
    var n = DIM_ORDER[i];
    var careScore = careHasData && care.dim_scores[n] != null ? care.dim_scores[n] : null;
    var dimKey = 'DIM-' + (i + 1);
    var examScore = examResults[dimKey] ? examResults[dimKey].pct : null;

    if (careScore != null && examScore != null) {
      scores[n] = Math.max(careScore, examScore);
      sources[n] = careScore >= examScore ? '测评' : dimKey + '考核';
    } else if (careScore != null) {
      scores[n] = careScore; sources[n] = '测评';
    } else if (examScore != null) {
      scores[n] = examScore; sources[n] = dimKey + '考核';
    } else {
      scores[n] = FALLBACK_SCORES[n]; sources[n] = null;
    }
  }

  var hasAnyData = careHasData || Object.keys(examResults).length > 0;
  var total = Math.round(Object.keys(scores).reduce(function(a,k){ return a + scores[k]; }, 0) / 7);
  var grade = gradeOf(total);
  var weakest = DIM_ORDER.slice().sort(function(a,b){ return scores[a] - scores[b]; })[0];
  var strongest = DIM_ORDER.slice().sort(function(a,b){ return scores[b] - scores[a]; })[0];

  var html = '';

  if (hasAnyData) {
    var badgesHtml = '<div class="ph-badges">';
    badgesHtml += '<span class="ph-badge">💪 最强：' + strongest + ' ' + scores[strongest] + '（' + sources[strongest] + '）</span>';
    badgesHtml += '<span class="ph-badge">📌 弱项：' + weakest + ' ' + scores[weakest] + '（' + sources[weakest] + '）</span>';
    if (Object.keys(examResults).length > 0)
      badgesHtml += '<span class="ph-badge">📝 考核 ' + Object.keys(examResults).length + '/7 已考</span>';
    badgesHtml += '</div>';

    html += '<div class="profile-header">' +
      '<div class="ph-avatar">👤</div>' +
      '<div class="ph-main">' +
        '<div class="ph-name">我</div>' +
        '<div class="ph-sub">能力画像 · 综合分来自 <b>测评</b>' +
          (Object.keys(examResults).length > 0 ? ' + <b>' + Object.keys(examResults).length + ' 维度考核</b>' : '') + ' 双源合并</div>' +
        badgesHtml +
      '</div>' +
      '<div class="ph-score">' +
        '<div class="ph-score-num">' + total + '</div>' +
        '<div class="ph-score-label">综合分</div>' +
        '<div class="ph-score-grade" style="color:' + grade.color + '">' + grade.label.split(' ')[0] + '</div>' +
      '</div>' +
      '<div class="ph-actions">' +
        '<a class="ph-btn" href="/care-test/">🔄 重新测评</a>' +
        '<a class="ph-btn" href="/academy/exam/">📝 去考核</a>' +
      '</div>' +
    '</div>';
  } else {
    html += '<div class="banner-newuser">' +
      '<div class="b-icon">🎯</div>' +
      '<div class="b-body">' +
        '<div class="b-title">还没有你的能力画像</div>' +
        '<div class="b-desc">先花 15 分钟测一次，7 维度 35 道题。测完自动生成画像，后续考核分数也会自动回写合并。</div>' +
      '</div>' +
      '<a class="b-btn" href="/care-test/">开始测评 →</a>' +
    '</div>';
  }

  // 雷达图
  html += '<div class="radar-box">' +
    '<div class="r-title">我的能力雷达图</div>' +
    '<div class="r-sub">' + (hasAnyData ? '双源合并 · 综合分 ' + total + ' · ' + grade.label : '演示数据 · 测一次看你的真实画像') + '</div>' +
    buildRadarSVG(scores) +
    '<div class="radar-legend">' +
      '<span style="background:#1a3d24;color:#fff">⬤ 我的</span>' +
      '<span style="background:#e8e4da;color:#888">⬤ 基准线 50</span>' +
    '</div>' +
  '</div>';

  // 趋势图（history >= 2）
  if (history.length >= 2) html += buildTrendBox(history, scores);

  // 时间戳
  if (careHasData && care.timestamp) {
    html += '<div class="ts-row">上次测评：' + formatDate(care.timestamp) + ' · 共 ' + (care.question_count || 35) + ' 题' +
      (Object.keys(examResults).length > 0 ? ' · 考核 ' + Object.keys(examResults).length + ' 维度' : '') + '</div>';
  }

  // 维度表
  html += '<div class="dim-table">';
  var sorted = DIM_ORDER.slice().sort(function(a,b){ return scores[a] - scores[b]; });
  for (var j = 0; j < sorted.length; j++) {
    var dname = sorted[j];
    var dscore = scores[dname];
    var dc = scoreClass(dscore);
    var action = DIM_ACTION[dname][dc === 'weak' ? 'weak' : 'strong'];
    var actionLabel = dc === 'weak' ? DIM_ACTION[dname].weakLabel : DIM_ACTION[dname].strongLabel;
    var srcLabel = sources[dname] ? (' <span style="font-size:10px;color:#999;font-weight:normal">(' + sources[dname] + ')</span>') : '';
    html += '<div class="dim-row">' +
      '<span class="d-code">' + DIM_CODES[dname] + '</span>' +
      '<span class="d-name">' + DIM_ICONS[dname] + ' ' + dname + srcLabel + '</span>' +
      '<div class="d-bar"><div class="d-fill ' + dc + '" style="width:' + dscore + '%"></div></div>' +
      '<span class="d-score ' + dc + '">' + dscore + '</span>' +
      '<a class="d-action" href="' + action + '">' + actionLabel + ' →</a>' +
    '</div>';
  }
  html += '</div>';

  root.innerHTML = html;
}

// === 趋势图 SVG ===
function buildTrendBox(history, currentScores) {
  var W = 760, H = 180, padL = 40, padR = 20, padT = 20, padB = 32;
  var innerW = W - padL - padR, innerH = H - padT - padB;
  var recent = history.slice(-5);
  var sorted = Object.keys(currentScores).sort(function(a,b){ return currentScores[b] - currentScores[a]; });
  var defaultDims = [sorted[0], sorted[sorted.length - 1]];
  var colors = ['#2d5a3d', '#c25636', '#8a7040', '#0891b2', '#7c3aed'];
  var svg = buildTrendSVG(recent, defaultDims, W, H, padL, padR, padT, padB, innerW, innerH, colors);

  var filterChips = '';
  DIM_ORDER.forEach(function(dname) {
    var on = defaultDims.indexOf(dname) >= 0;
    filterChips += '<span class="df-chip' + (on ? ' on' : '') + '" data-dim="' + dname + '" data-on="' + (on ? '1' : '0') + '" onclick="toggleTrendDim(this)">' + DIM_ICONS[dname] + ' ' + dname + '</span>';
  });

  return '<div class="trend-box">' +
    '<div class="t-title">📈 进步轨迹 · 维度趋势图</div>' +
    '<div class="t-sub">最近 ' + recent.length + ' 次测评 · 每点为当次分数 · 默认显示最强 & 最弱维度</div>' +
    '<div class="dim-filter">' + filterChips + '</div>' +
    '<div id="trend-svg-wrap">' + svg + '</div>' +
  '</div>';
}

function buildTrendSVG(history, dims, W, H, padL, padR, padT, padB, innerW, innerH, colors) {
  var n = history.length;
  if (n < 1) return '';
  var xPositions = [];
  for (var i = 0; i < n; i++) xPositions.push(padL + (n === 1 ? innerW/2 : innerW*i/(n-1)));
  var yOf = function(s) { return padT + innerH * (1 - s / 100); };

  var lines = '', dots = '', labels = '';
  [0,25,50,75,100].forEach(function(v) {
    var y = yOf(v);
    lines += '<line x1="'+padL+'" y1="'+y+'" x2="'+(W-padR)+'" y2="'+y+'" stroke="#f0ece2" stroke-width="1"/>';
    labels += '<text x="'+(padL-6)+'" y="'+y+'" text-anchor="end" font-size="9" fill="#aaa" dominant-baseline="middle">'+v+'</text>';
  });
  history.forEach(function(h, i) {
    var x = xPositions[i];
    labels += '<text x="'+x+'" y="'+(H-10)+'" text-anchor="middle" font-size="9" fill="#aaa">'+formatDate(h.timestamp).slice(5)+'</text>';
  });
  dims.forEach(function(dname, di) {
    var color = colors[di % colors.length];
    var pts = [];
    for (var j = 0; j < n; j++) {
      var s = history[j].dim_scores[dname] != null ? history[j].dim_scores[dname] : 50;
      pts.push(xPositions[j] + ',' + yOf(s));
    }
    lines += '<polyline points="'+pts.join(' ')+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linecap="round"/>';
    for (var k = 0; k < n; k++) {
      var s2 = history[k].dim_scores[dname] != null ? history[k].dim_scores[dname] : 50;
      dots += '<circle cx="'+xPositions[k]+'" cy="'+yOf(s2)+'" r="3.5" fill="'+color+'" stroke="#fff" stroke-width="1.5"/>';
    }
    labels += '<circle cx="'+(padL+6+di*130)+'" cy="10" r="4" fill="'+color+'"/>';
    labels += '<text x="'+(padL+14+di*130)+'" y="13" font-size="10" fill="#333" font-weight="600">'+dname+'</text>';
  });
  return '<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">'+lines+dots+labels+'</svg>';
}

function toggleTrendDim(el) {
  var dim = el.getAttribute('data-dim');
  var on = el.getAttribute('data-on') === '1';
  el.setAttribute('data-on', on ? '0' : '1');
  el.classList.toggle('on');
  var history = [];
  try { history = JSON.parse(localStorage.getItem('fs_care_history')) || []; } catch(e) {}
  if (history.length < 2) return;
  var selected = [];
  document.querySelectorAll('.dim-filter .df-chip.on').forEach(function(c){ selected.push(c.getAttribute('data-dim')); });
  if (selected.length === 0) selected.push('获客触达');
  var W = 760, H = 180, padL = 40, padR = 20, padT = 20, padB = 32;
  var innerW = W - padL - padR, innerH = H - padT - padB;
  var colors = ['#2d5a3d', '#c25636', '#8a7040', '#0891b2', '#7c3aed'];
  var recent = history.slice(-5);
  var svg = buildTrendSVG(recent, selected, W, H, padL, padR, padT, padB, innerW, innerH, colors);
  document.getElementById('trend-svg-wrap').innerHTML = svg;
}

render();

// ===== 成就徽章系统 =====
var BADGES = [
  { id:'first-test', emoji:'🎯', name:'第一次测评', desc:'完成第一次能力测评', check:function(info){ return info.hasData; }},
  { id:'exam-all-b', emoji:'📝', name:'全维度考核通过', desc:'7 维度考核全部 ≥ 65 分', check:function(info){ var r=info.examResults; if(Object.keys(r).length<7) return false; return Object.keys(r).every(function(k){ return r[k].pct >= 65; }); }},
  { id:'exam-all-a', emoji:'🏅', name:'全维度考核 A 档', desc:'7 维度考核全部 ≥ 80 分', check:function(info){ var r=info.examResults; if(Object.keys(r).length<7) return false; return Object.keys(r).every(function(k){ return r[k].pct >= 80; }); }},
  { id:'trend-up', emoji:'📈', name:'稳步进步', desc:'最近 3 次测评综合分连续提升', check:function(info){ var h=info.history; if(h.length<3) return false; var t=[h[h.length-3].total,h[h.length-2].total,h[h.length-1].total]; return t[2]>t[1] && t[1]>t[0]; }},
  { id:'top-dim', emoji:'💪', name:'某维度 ≥ 85', desc:'任一维度分数达到 85+', check:function(info){ var s=info.scores; return Object.keys(s).some(function(k){ return s[k]!=null && s[k]>=85; }); }},
  { id:'balanced', emoji:'⚖️', name:'均衡发展', desc:'7 维度分数标准差 ≤ 15', check:function(info){ var s=info.scores; var vals=Object.keys(s).map(function(k){return s[k];}).filter(function(x){return x!=null;}); if(vals.length<7) return false; var avg=vals.reduce(function(a,b){return a+b;},0)/vals.length; var sd=Math.sqrt(vals.reduce(function(a,b){return a+(b-avg)*(b-avg);},0)/vals.length); return sd <= 15; }},
  { id:'practice-3', emoji:'🎭', name:'练过 3 个场景', desc:'完成 3 个场景练习对话', check:function(info){ try{ var p=JSON.parse(localStorage.getItem('fs_practice_done')||'[]'); return p.length>=3; }catch(e){return false;} }},
  { id:'course-50', emoji:'📚', name:'课程完成 50%', desc:'至少一门核心课完成 ≥ 50% 章节', check:function(info){ try{ var p=JSON.parse(localStorage.getItem('fs_course_progress')||'{}'); var dims=Object.keys(p); if(dims.length===0) return false; return dims.some(function(d){ var ids=COURSE_COUNT[d]||5; return p[d].length>=Math.ceil(ids/2); }); }catch(e){return false;} }},
];
var COURSE_COUNT = {};
try {
  var _c = ['DIM-1','DIM-2','DIM-3','DIM-4','DIM-5','DIM-6','DIM-7'];
  for (var i = 0; i < _c.length; i++) COURSE_COUNT[_c[i]] = i < 5 ? 5 : (i === 5 || i === 6 ? 4 : 5);
} catch(e) {}

function computeBadges(info) {
  var unlocked = [];
  BADGES.forEach(function(b) {
    if (b.check(info)) unlocked.push(b);
  });
  // 持久化（只存 id + 解锁时间）
  var stored = [];
  try { stored = JSON.parse(localStorage.getItem('fs_badges') || '[]'); } catch(e) {}
  var storedIds = stored.map(function(s){ return s.id; });
  BADGES.forEach(function(b) {
    if (unlocked.indexOf(b) >= 0 && storedIds.indexOf(b.id) < 0) {
      stored.push({ id: b.id, timestamp: new Date().toISOString() });
    }
  });
  localStorage.setItem('fs_badges', JSON.stringify(stored));
  return { unlocked: unlocked, all: BADGES, newly: stored.length - storedIds.length };
}

function renderBadges() {
  var care = null, examResults = {}, history = [];
  try { care = JSON.parse(localStorage.getItem('fs_care_profile')); } catch(e) {}
  try { examResults = JSON.parse(localStorage.getItem('fs_exam_results')) || {}; } catch(e) {}
  try { history = JSON.parse(localStorage.getItem('fs_care_history')) || []; } catch(e) {}
  var scores = {};
  var DIM_ORDER = ['获客触达','需求洞察','专业方案','带看谈判','交易履约','售后复购','数字化协同'];
  var hasData = care && care.dim_scores;
  DIM_ORDER.forEach(function(n, i) {
    var cs = hasData && care.dim_scores[n] != null ? care.dim_scores[n] : null;
    var es = examResults['DIM-' + (i+1)] ? examResults['DIM-' + (i+1)].pct : null;
    scores[n] = cs != null && es != null ? Math.max(cs, es) : (cs != null ? cs : es);
  });
  var info = { scores: scores, hasData: hasData || Object.keys(examResults).length > 0, examResults: examResults, history: history };
  var res = computeBadges(info);
  if (res.unlocked.length === 0) return '';

  var html = '<div class="badges-box" style="max-width:820px;margin:28px auto 0;padding:0 24px">' +
    '<h3 style="font-size:14px;font-weight:700;color:#1a3d24;margin-bottom:12px">🏆 我的成就 · ' + res.unlocked.length + '/' + res.all.length + ' 解锁' +
    (res.newly > 0 ? ' <span style="background:#8a7040;color:#fff;font-size:10px;padding:2px 8px;border-radius:10px;margin-left:8px">NEW ' + res.newly + ' 枚</span>' : '') + '</h3>' +
    '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px">';
  res.all.forEach(function(b) {
    var got = res.unlocked.indexOf(b) >= 0;
    html += '<div style="background:#fff;border:1px solid ' + (got ? '#8a7040' : '#e8e4da') + ';border-radius:10px;padding:12px 8px;text-align:center;' +
      (got ? 'background:linear-gradient(135deg,#fffbf3,#fff)' : 'opacity:.55') + '">' +
      '<div style="font-size:28px;margin-bottom:4px">' + (got ? b.emoji : '🔒') + '</div>' +
      '<div style="font-size:12px;font-weight:700;color:' + (got ? '#1a3d24' : '#aaa') + '">' + b.name + '</div>' +
      '<div style="font-size:10px;color:' + (got ? '#888' : '#ccc') + ';margin-top:2px;line-height:1.4">' + b.desc + '</div>' +
    '</div>';
  });
  html += '</div></div>';
  return html;
}

// 注入成就徽章区到 profile
var badgesHtml = renderBadges();
if (badgesHtml) {
  var footerNote = document.querySelector('.footer-note');
  if (footerNote) footerNote.insertAdjacentHTML('beforebegin', badgesHtml);
}
