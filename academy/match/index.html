<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人岗匹配 · 学习成长</title>
<meta name="description" content="根据你的能力画像，匹配最适合的岗位类型。">
<link rel="icon" href="/favicon.png" type="image/png">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#f7f5f0;color:#2b2b2b;line-height:1.6}
a{text-decoration:none;color:inherit}
.fs-top-nav{position:sticky;top:0;z-index:100;background:#f7f5f0;border-bottom:1px solid #e8e4da;padding:10px 32px;display:flex;align-items:center;gap:20px}
.fs-top-logo{display:flex;align-items:center;gap:8px;flex-shrink:0}
.fs-top-mark{width:30px;height:30px;background:#1a3d24;color:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}
.fs-top-name{font-size:14px;font-weight:700;color:#1a3d24;white-space:nowrap}
.fs-top-links{display:flex;gap:14px;font-size:13px;flex-wrap:wrap;flex:1;justify-content:center}
.fs-top-links a{color:#555;white-space:nowrap}
.fs-top-links a:hover,.fs-top-links a.active{color:#1a3d24;font-weight:600}
@media(max-width:960px){.fs-top-links{display:none}}

.loop-strip{max-width:880px;margin:24px auto 0;background:#fff;border:1px solid #e8e4da;border-radius:14px;display:flex;overflow:hidden}
.loop-strip a{flex:1;padding:12px 4px;text-align:center;font-size:12px;color:#666;border-right:1px dashed #e8e4da}
.loop-strip a:last-child{border-right:none}
.loop-strip a .ls-name{display:block;font-weight:700;font-size:14px;margin-bottom:2px}
.loop-strip a.hl{background:linear-gradient(135deg,#fdf9ef,#fffbf3);color:#8a7040}

.pg{max-width:880px;margin:24px auto;padding:0 24px}
.pg-h{font-size:26px;font-weight:800;color:#1a3d24;margin-bottom:6px}
.pg-sub{font-size:14px;color:#6b6b6b;margin-bottom:20px}

/* banner */
.banner{background:linear-gradient(135deg,#1a3d24,#2d5a3d);color:#fff;border-radius:14px;padding:24px;margin-bottom:20px}
.banner h2{font-size:20px;font-weight:800;margin-bottom:6px}
.banner p{font-size:13.5px;opacity:.9;margin-bottom:12px;line-height:1.7}
.banner a{display:inline-block;background:#fff;color:#1a3d24;font-weight:700;font-size:13px;padding:8px 18px;border-radius:8px}

/* match card */
.match-card{background:#fff;border:1px solid #e8e4da;border-radius:14px;padding:20px;margin-bottom:14px;position:relative;overflow:hidden}
.match-card.top{border-color:#8a7040;background:linear-gradient(135deg,#fffbf3,#fff)}
.match-card .rank{position:absolute;top:14px;right:14px;font-size:11px;font-weight:700;padding:3px 10px;border-radius:10px}
.match-card.top .rank{background:#8a7040;color:#fff}
.match-card .role-name{font-size:17px;font-weight:800;color:#1a3d24;margin-bottom:4px}
.match-card .role-desc{font-size:12.5px;color:#777;margin-bottom:14px;line-height:1.7}
.match-card .score-row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.match-card .score-row .sr-label{font-size:11px;color:#888}
.match-card .score-row .sr-bar{flex:1;height:6px;background:#e8e4da;border-radius:3px;overflow:hidden}
.match-card .score-row .sr-fill{height:100%;border-radius:3px;background:#1a3d24}
.match-card .score-row .sr-num{font-size:12px;font-weight:700;color:#1a3d24;min-width:44px;text-align:right}

.match-card .tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.match-card .tags span{font-size:10.5px;padding:3px 9px;border-radius:10px;font-weight:600}
.match-card .tags .tag-s{background:#e8f4ec;color:#2d5a3d}
.match-card .tags .tag-w{background:#ffe8e8;color:#c25636}

.match-card .path-row{font-size:12px;color:#555;line-height:1.8}
.match-card .path-row a{color:#1a3d24;font-weight:600}

/* dim radar */
.dim-radar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:16px 0}
.dim-radar .dr-item{text-align:center}
.dim-radar .dr-num{font-size:14px;font-weight:800;color:#1a3d24}
.dim-radar .dr-name{font-size:10px;color:#888}
.dim-radar .dr-bar{height:4px;background:#e8e4da;border-radius:2px;margin-top:2px;overflow:hidden}
.dim-radar .dr-fill{height:100%;border-radius:2px}
.dim-radar .dr-fill.strong{background:#2d5a3d}
.dim-radar .dr-fill.mid{background:#c25636}
.dim-radar .dr-fill.weak{background:#c25636}

.footer-note{max-width:880px;margin:40px auto 0;padding:22px 24px 34px;border-top:1px solid #e8e4da;font-size:12px;color:#999;text-align:center;line-height:1.9}
.footer-note a{color:#1a3d24;font-weight:600}

/* === role detail overlay === */
.rd-overlay{position:fixed;inset:0;background:rgba(26,61,36,.35);backdrop-filter:blur(4px);z-index:200;display:none;align-items:center;justify-content:center;padding:24px}
.rd-overlay.show{display:flex}
.rd-modal{background:#fff;border-radius:18px;width:100%;max-width:720px;max-height:85vh;overflow-y:auto;position:relative;box-shadow:0 24px 60px rgba(26,61,36,.25)}
.rd-close{position:absolute;top:14px;right:18px;width:32px;height:32px;border-radius:50%;background:#f7f5f0;border:none;cursor:pointer;font-size:16px;color:#666;z-index:2}
.rd-close:hover{background:#e8e4da}
.rd-hdr{padding:24px 26px 14px;border-bottom:1px solid #e8e4da;background:linear-gradient(135deg,#1a3d24,#2d5a3d);color:#fff}
.rd-hdr h3{font-size:20px;font-weight:800;margin-bottom:4px}
.rd-hdr p{font-size:13px;opacity:.9}
.rd-hdr .rd-match{display:inline-block;font-size:11px;background:rgba(255,255,255,.2);padding:3px 10px;border-radius:10px;margin-top:8px;font-weight:700}
.rd-body{padding:20px 26px}
.rd-section{margin-bottom:20px}
.rd-section h4{font-size:13px;font-weight:700;color:#1a3d24;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.rd-gaps{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:4px}
.rd-gaps .dg{background:#f7f5f0;border-radius:8px;padding:10px 6px;text-align:center;border-top:3px solid #2d5a3d}
.rd-gaps .dg.weak{border-top-color:#c25636;background:#ffe8e8}
.rd-gaps .dg.mid{border-top-color:#c25636;background:#fff8e7}
.rd-gaps .dg .dg-score{font-size:15px;font-weight:800;color:#1a3d24}
.rd-gaps .dg.weak .dg-score{color:#c25636}
.rd-gaps .dg.mid .dg-score{color:#8a7040}
.rd-gaps .dg .dg-name{font-size:10px;color:#888;margin-top:2px}
.rd-gaps .dg .dg-label{font-size:9px;margin-top:3px}
.rd-gaps .dg.weak .dg-label{color:#c25636}
.rd-gaps .dg.mid .dg-label{color:#8a7040}
.rd-plan{background:#fdf9ef;border:1px solid #e8e4da;border-radius:10px;padding:12px 14px;font-size:12.5px;color:#5a4a2a;line-height:1.9}
.rd-plan a{color:#1a3d24;font-weight:700}
.rd-plan ol{padding-left:20px;margin-top:4px}
.rd-plan li{margin-bottom:4px}
</style>
</head>
<body>

<nav class="fs-top-nav">
  <a class="fs-top-logo" href="/"><span class="fs-top-mark">风</span><span class="fs-top-name">风声</span></a>
  <div class="fs-top-links">
    <a href="/">首页</a>
    <a href="/workspace/">工作台</a>
    <a href="/knowledge/">知识底座</a>
    <a href="/curation/">策展引擎</a>
    <a href="/decoder/">话术解码</a>
    <a href="/assessment/">能力测评</a>
    <a class="active" href="/academy/">学习成长</a>
  </div>
</nav>

<div class="loop-strip">
  <a href="/assessment/">📋<span class="ls-name">测</span>能力测评</a>
  <a href="/academy/core-courses/">📖<span class="ls-name">学</span>核心课</a>
  <a href="/academy/practice/">🎭<span class="ls-name">练</span>场景</a>
  <a href="/academy/exam/">📝<span class="ls-name">考</span>考核</a>
  <a href="/academy/profile/">📊<span class="ls-name">评</span>画像</a>
  <a class="hl" href="/academy/match/">🎯<span class="ls-name">配</span>岗位</a>
</div>

<div id="root" class="pg"></div>

<div id="role-overlay" class="rd-overlay" onclick="if(event.target===this)closeRoleDetail()">
  <div class="rd-modal">
    <button class="rd-close" onclick="closeRoleDetail()">✕</button>
    <div id="role-detail-body"></div>
  </div>
</div>

<div class="footer-note"><a href="/academy/">← 返回学习成长首页</a><br>© 2026 fengsheng.tech</div>

<script>

// 7 维度
var DIMS = ['获客触达','需求洞察','专业方案','带看谈判','交易履约','售后复购','数字化协同'];

// 岗位类型定义（基于知识底座 JOB 域抽象）
var ROLES = [
  {
    key: 'sales', name: '综合型经纪人', icon: '🏠',
    desc: '全流程覆盖——从获客到售后都做。适合能力均衡、想全面发展的经纪人。',
    dimWeights: [0.15, 0.10, 0.15, 0.20, 0.20, 0.10, 0.10],
    strongDims: [4, 5, 3], // 带看谈判 / 交易履约 / 专业方案
    weakDimsFix: [],
    path: '/academy/core-courses/'
  },
  {
    key: 'acquisition', name: '获客型经纪人', icon: '📣',
    desc: '专注线上线下引流——朋友圈运营、短视频、社区驻守。适合外向、擅长社交的。',
    dimWeights: [0.40, 0.20, 0.05, 0.15, 0.05, 0.10, 0.05],
    strongDims: [0, 1],
    weakDimsFix: [4, 5], // 补带看和履约短板
    path: '/academy/core-courses/'
  },
  {
    key: 'negotiator', name: '谈判型经纪人', icon: '💼',
    desc: '高价成交能手——擅长价值挖掘和谈判。业主维护 + 客户谈判双强。',
    dimWeights: [0.10, 0.15, 0.25, 0.35, 0.10, 0.05, 0.00],
    strongDims: [3, 2],
    weakDimsFix: [0, 6],
    path: '/academy/core-courses/'
  },
  {
    key: 'aftersales', name: '服务型经纪人', icon: '💝',
    desc: '老客户关系王——成交后还能维持关系，复购转介绍率特别高。',
    dimWeights: [0.05, 0.15, 0.10, 0.10, 0.20, 0.35, 0.05],
    strongDims: [5, 4],
    weakDimsFix: [0, 3],
    path: '/academy/core-courses/'
  },
];

function loadScores() {
  var scores = {}, hasCare = false, hasExam = false;
  var care = null, examResults = {};
  try { care = JSON.parse(localStorage.getItem('fs_care_profile')); } catch(e) {}
  try { examResults = JSON.parse(localStorage.getItem('fs_exam_results')) || {}; } catch(e) {}
  hasCare = care && care.dim_scores;
  hasExam = Object.keys(examResults).length > 0;

  for (var i = 0; i < DIMS.length; i++) {
    var n = DIMS[i];
    var cs = hasCare && care.dim_scores[n] != null ? care.dim_scores[n] : null;
    var dimKey = 'DIM-' + (i+1);
    var es = examResults[dimKey] ? examResults[dimKey].pct : null;
    if (cs != null && es != null) scores[n] = Math.max(cs, es);
    else if (cs != null) scores[n] = cs;
    else if (es != null) scores[n] = es;
    else scores[n] = null;
  }
  return { scores: scores, hasData: hasCare || hasExam };
}

function computeRoleScore(role, scores) {
  var total = 0, wSum = 0;
  for (var i = 0; i < DIMS.length; i++) {
    var s = scores[DIMS[i]];
    if (s != null) { total += s * role.dimWeights[i]; wSum += role.dimWeights[i]; }
  }
  return wSum > 0 ? Math.round(total / wSum) : null;
}

var CURRENT_MATCH_INFO = null;

function showRoleDetail(roleKey) {
  var role = ROLES.find(function(r){ return r.key === roleKey; });
  if (!role) return;
  var info = CURRENT_MATCH_INFO || loadScores();
  var matchPct = computeRoleScore(role, info.scores) || 0;

  var body = '';
  body += '<div class="rd-hdr"><h3>' + role.icon + ' ' + role.name + '</h3><p>' + role.desc + '</p>' +
    '<span class="rd-match">匹配度 ' + matchPct + '%</span></div>';
  body += '<div class="rd-body">';
  body += '<div class="rd-section"><h4>📊 你的能力差距 vs 岗位要求</h4>';
  body += '<div class="rd-gaps">';
  for (var i = 0; i < DIMS.length; i++) {
    var s = info.scores[DIMS[i]];
    var isStrong = role.strongDims.indexOf(i) >= 0;
    var isWeak = role.weakDimsFix.indexOf(i) >= 0;
    var cls = isWeak && s != null && s < 65 ? 'weak' : (isStrong ? '' : 'mid');
    var label = isStrong ? '岗位核心' : (isWeak && s != null && s < 65 ? '⚠️ 补短板' : (s != null && s >= 65 ? '✅ 够格' : '—'));
    body += '<div class="dg ' + cls + '"><div class="dg-score">' + (s != null ? s : '-') + '</div>' +
      '<div class="dg-name">' + DIMS[i].slice(0,3) + '</div><div class="dg-label">' + label + '</div></div>';
  }
  body += '</div></div>';

  body += '<div class="rd-section"><h4>🎓 补短板学习路径</h4><div class="rd-plan"><ol>';
  var steps = [];
  role.weakDimsFix.forEach(function(di) {
    var s = info.scores[DIMS[di]];
    if (s != null && s < 65) {
      steps.push('<li><a href="/academy/core-courses/learn/?id=' + (di+1) + '">' + DIMS[di] + '核心课</a>（当前 ' + s + ' 分）→ 考 <a href="/academy/exam/?dim=DIM-' + (di+1) + '">DIM-' + (di+1) + '</a> ≥ 70</li>');
    }
  });
  if (steps.length === 0) steps.push('<li>当前各维度 ≥ 65 分，建议弱项提升到 75+</li>');
  steps.push('<li>去 <a href="/academy/practice/">场景练习</a> 练对话 → 把知识变反应</li>');
  steps.push('<li>去 <a href="/academy/exam/">岗位考核</a> → 分数回写 <a href="/academy/profile/">画像</a></li>');
  body += steps.join('') + '</ol></div></div>';

  body += '<div class="rd-section"><h4>🎯 立即开始</h4>' +
    '<a href="/academy/core-courses/" style="display:inline-block;background:#1a3d24;color:#fff;font-size:13px;font-weight:700;padding:10px 20px;border-radius:8px;margin-right:8px;text-decoration:none">📖 开始学</a>' +
    '<a href="/academy/profile/" style="display:inline-block;background:#fdf9ef;color:#8a7040;font-size:13px;font-weight:600;padding:10px 20px;border-radius:8px;border:1px solid #e8e4da;text-decoration:none">📊 看画像</a>' +
  '</div>';
  body += '</div>';

  document.getElementById('role-detail-body').innerHTML = body;
  document.getElementById('role-overlay').classList.add('show');
}
function closeRoleDetail() { document.getElementById('role-overlay').classList.remove('show'); }

function render() {
  var root = document.getElementById('root');
  var info = loadScores();

  if (!info.hasData) {
    root.innerHTML = '<div class="banner">' +
      '<h2>🎯 人岗匹配</h2>' +
      '<p>先测一次能力测评，匹配才能准确。35 道题，15 分钟，测完自动推荐最适合你的岗位类型。</p>' +
      '<a href="/care-test/">📋 开始测评 →</a></div>';
    return;
  }

  // 计算各岗位匹配分
  var roleScores = ROLES.map(function(r) {
    return { role: r, matchPct: computeRoleScore(r, info.scores) };
  }).filter(function(x){ return x.matchPct != null });
  roleScores.sort(function(a,b){ return b.matchPct - a.matchPct; });

  // 综合分 + 最强/弱项
  var totalScore = 0, validDims = 0;
  var dimList = [];
  for (var i = 0; i < DIMS.length; i++) {
    var s = info.scores[DIMS[i]];
    if (s != null) { totalScore += s; validDims++; dimList.push({name: DIMS[i], score: s, idx: i}); }
  }
  if (validDims > 0) totalScore = Math.round(totalScore / validDims);
  dimList.sort(function(a,b){ return b.score - a.score; });
  var top3 = dimList.slice(0, 3);
  var weak3 = dimList.slice(-3).reverse();

  var html = '';
  // header banner with summary
  html += '<div class="banner">' +
    '<h2>🎯 人岗匹配</h2>' +
    '<p>基于你的能力画像 · 综合分 <b>' + totalScore + '</b>' +
    ' · 最强 ' + top3.map(function(d){return d.name;}).join('/') +
    ' · 弱项 ' + weak3.map(function(d){return d.name;}).join('/') + '</p>' +
  '</div>';

  // 匹配卡
  html += '<h3 style="font-size:15px;font-weight:700;color:#1a3d24;margin-bottom:14px">💼 岗位类型匹配度</h3>';
  roleScores.forEach(function(rs, idx) {
    var role = rs.role;
    var isTop = idx === 0;
    html += '<div class="match-card' + (isTop ? ' top' : '') + '" style="cursor:pointer" onclick="showRoleDetail(\'' + role.key + '\')">' +
      '<div class="rank">' + (idx === 0 ? '🏆 最匹配' : (idx === 1 ? '🥈 次匹配' : (idx === 2 ? '🥉 备选' : ''))) + '</div>' +
      '<div class="role-name">' + role.icon + ' ' + role.name + '</div>' +
      '<div class="role-desc">' + role.desc + '</div>' +
      '<div class="score-row"><span class="sr-label">匹配度</span>' +
        '<div class="sr-bar"><div class="sr-fill" style="width:' + rs.matchPct + '%"></div></div>' +
        '<span class="sr-num">' + rs.matchPct + '%</span></div>';

    // 维度雷达简化版
    html += '<div class="dim-radar">';
    for (var i = 0; i < DIMS.length; i++) {
      var s = info.scores[DIMS[i]];
      var pct = s != null ? s : 0;
      // 对这个岗位的重要度：dimWeights 高 = 重要
      var isStrong = role.strongDims.indexOf(i) >= 0;
      var isWeak = role.weakDimsFix.indexOf(i) >= 0;
      var cls = isStrong ? 'strong' : (isWeak ? 'weak' : 'mid');
      html += '<div class="dr-item"><div class="dr-num" style="color:' + (isStrong ? '#2d5a3d' : (isWeak ? '#c25636' : '#1a3d24')) + '">' +
        (s != null ? s : '-') + '</div><div class="dr-name">' + DIMS[i].slice(0,3) + '</div>' +
        '<div class="dr-bar"><div class="dr-fill ' + cls + '" style="width:' + pct + '%"></div></div></div>';
    }
    html += '</div>';

    // 强项标签 / 补短板建议
    html += '<div class="tags">';
    if (isTop) html += '<span class="tag-s">✅ 你的优势方向</span>';
    role.strongDims.forEach(function(di) {
      if (info.scores[DIMS[di]] != null)
        html += '<span class="tag-s">💪 ' + DIMS[di] + ' ' + info.scores[DIMS[di]] + '</span>';
    });
    role.weakDimsFix.forEach(function(di) {
      if (info.scores[DIMS[di]] != null)
        html += '<span class="tag-w">📌 补 ' + DIMS[di] + ' ' + info.scores[DIMS[di]] + '</span>';
    });
    html += '</div>';

    // 学习路径
    html += '<div class="path-row">🎓 <strong>建议路径</strong>：' +
      (isTop ? '在 ' : '转 ');
    role.strongDims.forEach(function(di, k) {
      if (info.scores[DIMS[di]] != null) {
        html += '<a href="/academy/core-courses/learn/?id=' + (di+1) + '">' + DIMS[di] + '课</a>';
        if (k < role.strongDims.length - 1) html += '、';
      }
    });
    role.weakDimsFix.forEach(function(di) {
      if (info.scores[DIMS[di]] != null && info.scores[DIMS[di]] < 65) {
        html += ' → <a href="/academy/exam/">DIM-' + (di+1) + '考核</a>';
      }
    });
    html += '</div></div>';
  });

  root.innerHTML = html;
}

render();
</script>
</body>
</html>
