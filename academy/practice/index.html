<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#f7f5f0;color:#2b2b2b;line-height:1.6}
a{text-decoration:none;color:inherit}
.fs-top-nav{position:sticky;top:0;z-index:100;background:#f7f5f0;border-bottom:1px solid #e8e4da;padding:10px 32px;display:flex;align-items:center;gap:20px}
.fs-top-logo{display:flex;align-items:center;gap:8px;flex-shrink:0}
.fs-top-mark{width:30px;height:30px;background:#1a3d24;color:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}
.fs-top-name{font-size:14px;font-weight:700;color:#1a3d24;white-space:nowrap}
.fs-top-links{display:flex;gap:14px;font-size:13px;flex-wrap:wrap;flex:1;justify-content:center}
.fs-top-links a{color:#555;white-space:nowrap}
.fs-top-links a:hover,.fs-top-links a.active{color:#1a3d24;font-weight:600}
@media(max-width:960px){.fs-top-links{display:none}}

/* loop strip */
.loop-strip{max-width:880px;margin:24px auto 0;background:#fff;border:1px solid #e8e4da;border-radius:14px;display:flex;overflow:hidden}
.loop-strip a{flex:1;padding:12px 4px;text-align:center;font-size:12px;color:#666;border-right:1px dashed #e8e4da}
.loop-strip a:last-child{border-right:none}
.loop-strip a .ls-name{display:block;font-weight:700;font-size:14px;margin-bottom:2px}
.loop-strip a.hl{background:linear-gradient(135deg,#fdf9ef,#fffbf3);color:#8a7040}

.pg{max-width:880px;margin:24px auto;padding:0 24px}
.pg-h{font-size:26px;font-weight:800;color:#1a3d24;margin-bottom:6px}
.pg-sub{font-size:14px;color:#6b6b6b;margin-bottom:20px}

/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.p-card{background:#fff;border:1px solid #e8e4da;border-radius:12px;padding:18px;transition:transform .15s,box-shadow .15s;cursor:pointer}
.p-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(26,61,36,.08)}
.p-card.active{border-color:#1a3d24;background:linear-gradient(135deg,#fdf9ef,#fffbf3)}
.p-card .p-emoji{font-size:32px;margin-bottom:8px}
.p-card .p-scene{font-size:11px;font-weight:700;color:#8a7040;margin-bottom:4px}
.p-card.soft .p-scene{color:#b38600}
.p-grid-label{grid-column:1/-1;font-size:12px;font-weight:700;color:#8a7040;background:#fdf9ef;border-left:3px solid #c9a962;padding:8px 14px;border-radius:6px;letter-spacing:1px;margin-top:4px}
.p-card .p-name{font-size:15px;font-weight:700;color:#1a3d24;margin-bottom:6px}
.p-card .p-desc{font-size:12.5px;color:#777;line-height:1.7}

/* chat area */
.chat-box{max-width:880px;margin:20px auto 0;background:#fff;border:1px solid #e8e4da;border-radius:14px;overflow:hidden}
.chat-hdr{padding:14px 20px;background:#fdf9ef;border-bottom:1px solid #e8e4da;display:flex;align-items:center;gap:12px}
.chat-hdr .ch-title{font-size:14px;font-weight:700;color:#1a3d24;flex:1}
.chat-hdr .ch-turn{font-size:11px;color:#8a7040;background:#fff;padding:3px 10px;border-radius:10px;border:1px solid #e8e4da}
.chat-body{max-height:400px;overflow-y:auto;padding:16px 20px}
.msg{margin-bottom:14px;display:flex;gap:10px}
.msg .avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.msg.client .avatar{background:#ffe8e8}
.msg.me .avatar{background:#e8f4ec}
.msg .bubble{flex:1;padding:10px 14px;border-radius:10px;font-size:13.5px;line-height:1.7}
.msg.client .bubble{background:#faf5ea;color:#5a4a2a}
.msg.me .bubble{background:#e8f4ec;color:#1a3d24}
.msg .name{font-size:11px;color:#999;margin-bottom:3px}

/* choices */
.choices{padding:14px 20px;background:#faf5ea;border-top:1px solid #e8e4da}
.choices .c-label{font-size:11px;font-weight:700;color:#8a7040;margin-bottom:10px}
.choices button{display:block;width:100%;text-align:left;background:#fff;border:1px solid #e8e4da;padding:12px 14px;border-radius:10px;font-size:13.5px;color:#333;margin-bottom:8px;cursor:pointer;transition:all .12s;font-family:inherit}
.choices button:hover{background:#1a3d24;color:#fff;border-color:#1a3d24;transform:translateX(4px)}
.choices button:last-child{margin-bottom:0}
.choices button.disabled{opacity:.5;cursor:not-allowed}

/* feedback */
.feedback{max-width:880px;margin:16px auto 0;background:#fff;border:1px solid #e8e4da;border-radius:14px;padding:16px 20px}
.fback-title{font-size:14px;font-weight:700;color:#1a3d24;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.fback-title .fbadge{font-size:11px;padding:2px 8px;border-radius:4px}
.fgood{background:#e8f4ec;color:#2d5a3d}
.fbad{background:#ffe8e8;color:#c25636}
.fback-body{font-size:13px;color:#555;line-height:1.8}
.fback-body strong{color:#1a3d24}

.footer-note{max-width:880px;margin:40px auto 0;padding:22px 24px 34px;border-top:1px solid #e8e4da;font-size:12px;color:#999;text-align:center;line-height:1.9}
</style>

function render() {
  var root = document.getElementById('root');
  var html = '';

  if (!state.sceneId) {
    // 场景选择
    html += '<div class="pg"><h2 class="pg-h">🎭 场景练习</h2><p class="pg-sub">8 个真实场景 · 硬技能 3 + 软技能 5 · 选择题练反应 · 即时反馈价值观</p>' +
      '<div class="grid">' +
      '<div class="p-grid-label">📐 专业硬技能 · 客户服务时间线（3 场景）</div>' +
      HARD_SCENES.map(function(s) {
        return '<div class="p-card" onclick="enterScene(\'' + s.id + '\')">' +
          '<div class="p-emoji">' + s.icon + '</div>' +
          '<div class="p-scene">' + s.scene + '</div>' +
          '<div class="p-name">' + s.name + '</div>' +
          '<div class="p-desc">' + s.desc + '</div>' +
        '</div>';
      }).join('') +
      '<div class="p-grid-label">💞 软技能 · 价值观与判断（5 场景）</div>' +
      SOFT_SCENES.map(function(s) {
        return '<div class="p-card soft" onclick="enterScene(\'' + s.id + '\')">' +
          '<div class="p-emoji">' + s.icon + '</div>' +
          '<div class="p-scene">' + s.scene + '</div>' +
          '<div class="p-name">' + s.name + '</div>' +
          '<div class="p-desc">' + s.desc + '</div>' +
        '</div>';
      }).join('') +
      '</div></div>';
  } else {
    var ALL_SCENES = HARD_SCENES.concat(SOFT_SCENES);
    var scene = ALL_SCENES.find(function(s){ return s.id === state.sceneId; });
    var turns = scene.turns;

    // 场景 header
    html += '<div class="pg"><h2 class="pg-h">' + scene.icon + ' ' + scene.name + '</h2>' +
      '<p class="pg-sub">' + scene.scene + ' · ' + scene.intro + '</p></div>';

    // 对话区
    html += '<div class="chat-box"><div class="chat-hdr">' +
      '<div class="ch-title">' + scene.icon + ' ' + scene.name + '</div>' +
      '<div class="ch-turn">进度 ' + state.turnIdx + '/' + turns.length + '</div></div>' +
      '<div class="chat-body" id="chat-body">';

    // 渲染已发生的对话
    for (var i = 0; i <= state.turnIdx && i < turns.length; i++) {
      var t = turns[i];
      if (t.speaker) {
        html += '<div class="msg ' + (t.speaker === 'me' ? 'me' : 'client') + '">' +
          '<div class="avatar">' + (t.speaker === 'me' ? '🤵' : '👤') + '</div>' +
          '<div><div class="name">' + (t.speaker === 'me' ? '你（经纪人）' : '客户') + '</div>' +
          '<div class="bubble">' + t.text + '</div></div></div>';
      }
    }
    html += '</div>';

    // 如果还有选择没到，或者当前是 choice 节点
    if (state.turnIdx < turns.length && turns[state.turnIdx].choices) {
      var choiceIdx = state.stepIdx;
      var choice = turns[state.turnIdx].choices[choiceIdx];
      html += '<div class="choices">' +
        '<div class="c-label">👆 客户说完了，你准备怎么回？</div>' +
        turns[state.turnIdx].choices.map(function(c, ci) {
          var disabled = state.feedbackShown && ci !== choiceIdx ? ' disabled' : '';
          return '<button onclick="chooseOption(' + ci + ')"' + disabled + '>' + String.fromCharCode(65+ci) + '. ' + c.text + '</button>';
        }).join('') +
      '</div>';

      if (state.feedbackShown) {
        var fbClass = choice.feedback === 'good' ? 'fgood' : 'fbad';
        html += '</div></div>' + // close chat-box
          '<div class="feedback">' +
          '<div class="fback-title"><span class="fbadge ' + fbClass + '">' + (choice.feedback === 'good' ? '✅ 好做法' : '⚠️ 可以改进') + '</span>反馈</div>' +
          '<div class="fback-body">' + choice.fbText + '</div>' +
          '<div style="margin-top:14px;display:flex;gap:10px">' +
            '<button class="ch-body-btn primary" style="font-size:13px;padding:8px 20px;border-radius:8px;border:none;cursor:pointer" onclick="nextTurn()">' +
            (state.turnIdx + 1 >= turns.length ? '🏁 看结局' : '继续 →') + '</button>' +
            '<button class="ch-body-btn secondary" style="font-size:13px;padding:8px 20px;border-radius:8px;border:1px solid #e8e4da;background:#fff;cursor:pointer;color:#1a3d24" onclick="resetScene()">🔄 重玩</button>' +
          '</div>' +
        '</div>';
      } else {
        html += '</div></div>';
      }
    } else {
      // 客户/经纪人文本节点 → 自动进入下一个
      html += '</div></div>';
      // 自动推进到下一个 choice
      setTimeout(function() { nextTurn(); }, 500);
    }

    // 结局
    if (state.turnIdx >= turns.length) {
      // 存库：完成场景 → fs_practice_done[sceneId]
      try {
        var done = JSON.parse(localStorage.getItem('fs_practice_done') || '{}');
        if (!done[scene.id]) {
          done[scene.id] = { timestamp: new Date().toISOString() };
          localStorage.setItem('fs_practice_done', JSON.stringify(done));
        }
      } catch(e) {}

      html += '<div class="feedback" style="margin-top:20px">' +
        '<div class="fback-title">🏁 场景结局 <span style="font-size:10px;background:#e8f4ec;color:#2d5a3d;padding:2px 8px;border-radius:10px;margin-left:8px">✓ 已解锁徽章</span></div>' +
        '<div class="fback-body">' + scene.endMsg + '</div>' +
        '<div style="margin-top:14px;display:flex;gap:10px">' +
          '<button onclick="resetScene()" class="ch-body-btn primary" style="font-size:13px;padding:8px 20px;border-radius:8px;border:none;cursor:pointer">🔄 重玩这个</button>' +
          '<button onclick="backToList()" class="ch-body-btn secondary" style="font-size:13px;padding:8px 20px;border-radius:8px;border:1px solid #e8e4da;background:#fff;cursor:pointer;color:#1a3d24">🎭 选下一个场景</button>' +
          '<a href="/academy/profile/" style="display:inline-block;background:#fdf9ef;color:#8a7040;font-size:13px;padding:8px 20px;border-radius:8px;border:1px solid #e8e4da;text-decoration:none">🏆 看成就徽章 →</a>' +
        '</div>' +
      '</div>';
    }
  }

  root.innerHTML = html;
  // scroll to bottom
  var cb = document.getElementById('chat-body');
  if (cb) cb.scrollTop = cb.scrollHeight;
}

function enterScene(id) {
  state.sceneId = id; state.turnIdx = 0; state.stepIdx = 0; state.feedbackShown = false;
  render();
}
function chooseOption(i) {
  state.stepIdx = i;
  state.feedbackShown = true;
  render();
}
function nextTurn() {
  state.turnIdx++; state.stepIdx = 0; state.feedbackShown = false;
  render();
}
function resetScene() {
  state.turnIdx = 0; state.stepIdx = 0; state.feedbackShown = false;
  render();
}
function backToList() {
  state.sceneId = null;
  render();
}

render();
</script>
</body>
</html>
