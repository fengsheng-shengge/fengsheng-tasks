<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#f7f5f0;color:#2b2b2b;line-height:1.6}
a{text-decoration:none;color:inherit}
.fs-top-nav{position:sticky;top:0;z-index:100;background:#f7f5f0;border-bottom:1px solid #e8e4da;padding:10px 32px;display:flex;align-items:center;gap:20px}
.fs-top-logo{display:flex;align-items:center;gap:8px;flex-shrink:0}
.fs-top-mark{width:30px;height:30px;background:#1a3d24;color:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}
.fs-top-name{font-size:14px;font-weight:700;color:#1a3d24;white-space:nowrap}
.fs-top-links{display:flex;gap:14px;font-size:13px;flex-wrap:wrap;flex:1;justify-content:center}
.fs-top-links a{color:#555;white-space:nowrap}
.fs-top-links a:hover,.fs-top-links a.active{color:#1a3d24;font-weight:600}
@media(max-width:960px){.fs-top-links{display:none}}

/* loop strip */
.loop-strip{max-width:880px;margin:24px auto 0;background:#fff;border:1px solid #e8e4da;border-radius:14px;display:flex;overflow:hidden}
.loop-strip a{flex:1;padding:12px 4px;text-align:center;font-size:12px;color:#666;border-right:1px dashed #e8e4da}
.loop-strip a:last-child{border-right:none}
.loop-strip a .ls-name{display:block;font-weight:700;font-size:14px;margin-bottom:2px}
.loop-strip a.hl{background:linear-gradient(135deg,#fdf9ef,#fffbf3);color:#8a7040}

.pg{max-width:880px;margin:24px auto;padding:0 24px}
.pg-h{font-size:26px;font-weight:800;color:#1a3d24;margin-bottom:6px}
.pg-sub{font-size:14px;color:#6b6b6b;margin-bottom:20px}

/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.p-card{background:#fff;border:1px solid #e8e4da;border-radius:12px;padding:18px;transition:transform .15s,box-shadow .15s;cursor:pointer}
.p-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(26,61,36,.08)}
.p-card.active{border-color:#1a3d24;background:linear-gradient(135deg,#fdf9ef,#fffbf3)}
.p-card .p-emoji{font-size:32px;margin-bottom:8px}
.p-card .p-scene{font-size:11px;font-weight:700;color:#8a7040;margin-bottom:4px}
.p-card.soft .p-scene{color:#b38600}
.p-grid-label{grid-column:1/-1;font-size:12px;font-weight:700;color:#8a7040;background:#fdf9ef;border-left:3px solid #c9a962;padding:8px 14px;border-radius:6px;letter-spacing:1px;margin-top:4px}
.p-card .p-name{font-size:15px;font-weight:700;color:#1a3d24;margin-bottom:6px}
.p-card .p-desc{font-size:12.5px;color:#777;line-height:1.7}

/* chat area */
.chat-box{max-width:880px;margin:20px auto 0;background:#fff;border:1px solid #e8e4da;border-radius:14px;overflow:hidden}
.chat-hdr{padding:14px 20px;background:#fdf9ef;border-bottom:1px solid #e8e4da;display:flex;align-items:center;gap:12px}
.chat-hdr .ch-title{font-size:14px;font-weight:700;color:#1a3d24;flex:1}
.chat-hdr .ch-turn{font-size:11px;color:#8a7040;background:#fff;padding:3px 10px;border-radius:10px;border:1px solid #e8e4da}
.chat-body{max-height:400px;overflow-y:auto;padding:16px 20px}
.msg{margin-bottom:14px;display:flex;gap:10px}
.msg .avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.msg.client .avatar{background:#ffe8e8}
.msg.me .avatar{background:#e8f4ec}
.msg .bubble{flex:1;padding:12px 16px;border-radius:12px;font-size:16px;line-height:1.7}
.msg.client .bubble{background:#faf5ea;color:#5a4a2a}
.msg.me .bubble{background:#e8f4ec;color:#1a3d24}
.msg .name{font-size:11px;color:#999;margin-bottom:3px}

/* choices */
.choices{padding:14px 20px;background:#faf5ea;border-top:1px solid #e8e4da}
.choices .c-label{font-size:11px;font-weight:700;color:#8a7040;margin-bottom:10px}
.choices button{display:block;width:100%;text-align:left;background:#fff;border:1px solid #e8e4da;padding:12px 14px;border-radius:10px;font-size:13.5px;color:#333;margin-bottom:8px;cursor:pointer;transition:all .12s;font-family:inherit}
.choices button:hover{background:#1a3d24;color:#fff;border-color:#1a3d24;transform:translateX(4px)}
.choices button:last-child{margin-bottom:0}
.choices button.disabled{opacity:.5;cursor:not-allowed}

/* feedback */
.feedback{max-width:880px;margin:16px auto 0;background:#fff;border:1px solid #e8e4da;border-radius:14px;padding:16px 20px}
.fback-title{font-size:14px;font-weight:700;color:#1a3d24;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.fback-title .fbadge{font-size:11px;padding:2px 8px;border-radius:4px}
.fgood{background:#e8f4ec;color:#2d5a3d}
.fbad{background:#ffe8e8;color:#c25636}
.fback-body{font-size:13px;color:#555;line-height:1.8}
.fback-body strong{color:#1a3d24}

.footer-note{max-width:880px;margin:40px auto 0;padding:22px 24px 34px;border-top:1px solid #e8e4da;font-size:12px;color:#999;text-align:center;line-height:1.9}
</style>

<script>

var state = { sceneId: null, turnIdx: 0, stepIdx: 0, feedbackShown: false, goodCount: 0, choiceCount: 0 };

// ===== 硬技能 8 场景（客户服务时间线 DIM-1~7）=====
var HARD_SCENES = [
  {
    id: 'price-haggle', icon: '💰', scene: 'DIM-4 带看谈判',
    name: '客户砍价砍到你没脾气', desc: '客户看完 380 万的房开口要 320 万，怎么接？',
    intro: '刚带张先生一家看完 380 万两居，房子装修保养好。客户满意但砍价超预期。',
    turns: [
      {speaker:'client', text:'这房子确实还可以，但 380 万太贵了，320 万差不多。'},
      {choices:[
        {text:'"张先生，您说的这个 320 万，我想了解一下是怎么算出来的？"', feedback:'good', fbText:'✅ 好做法！先问预算来源，搞清动机再谈。'},
        {text:'"直接答应沟通看看能不能让一点"', feedback:'bad', fbText:'❌ 直接答应等于让了底线，客户会觉得还有空间。'},
        {text:'"320 万真不行，同户型上周成交 365 万"', feedback:'good', fbText:'✅ 用事实锚定市场价。'},
      ]},
      {speaker:'client', text:'我之前看了隔壁小区差不多的，才 330 万。'},
      {choices:[
        {text:'"哦，阳光家园对吧？学区对口三小，咱们是实验小学，每年差 30-40 万"', feedback:'good', fbText:'✅ 先认同，再指出差异，用数据量化价值。'},
        {text:'"隔壁是回迁房，学区不一样"', feedback:'bad', fbText:'❌ 直接说回迁房容易引起反感。'},
      ]},
    ],
    endMsg:'你用认同差异数据三档回法稳住客户，最后接受 370 万。'
  },
  {
    id: 'need-discovery', icon: '🔍', scene: 'DIM-2 需求洞察',
    name: '客户说随便看看但其实有刚需', desc: '客户走进门店说随便看看，其实替孩子找学区房',
    intro: '刘阿姨穿得体面走进门店说随便看看。典型隐性需求场景，你要挖。',
    turns: [
      {speaker:'client', text:'你们这附近有什么好房子？随便看看。'},
      {choices:[
        {text:'"阿姨您眼光好，这片区最热门。您是自己住还是帮孩子看呀？"', feedback:'good', fbText:'✅ 二选一提问，帮孩子大概率=学区房。'},
        {text:'"阿姨您大概要几室？预算多少？"', feedback:'bad', fbText:'❌ 直接问预算防御心起来。'},
      ]},
      {speaker:'client', text:'嗨，别提了，我孙子今年要上学，找学区房呢。'},
      {choices:[
        {text:'"那您孙子今年几年级？对口哪个学校？"', feedback:'good', fbText:'✅ 问年级判断紧急度。'},
        {text:'"好的好的，我给您推几套"', feedback:'bad', fbText:'❌ 推之前先搞清预算面积位置偏好。'},
      ]},
    ],
    endMsg:'挖到预算 500 万两居步行 10 分钟内，匹配效率提升 3 倍。'
  },
  {
    id: 'fear-closing', icon: '🎯', scene: 'DIM-4 带看谈判',
    name: '客户犹豫不决怎么临门一脚', desc: '客户看完 3 次犹豫 2 周，你怎么让他下决心？',
    intro: '李哥看房 3 次，预算够房子也满意，但就是不下决心。',
    turns: [
      {speaker:'client', text:'我再想想，不急不急。'},
      {choices:[
        {text:'"李哥跟您说实话，这套房昨天有另外一个客户来看了，他今天要给答复。您那边定的话我帮您先沟通预留？"', feedback:'good', fbText:'✅ 真实稀缺性引导，制造紧迫感。'},
        {text:'"好的李哥，我再等等您消息"', feedback:'bad', fbText:'❌ 等于放弃！客户不会主动回来。'},
      ]},
      {speaker:'client', text:'那...那我下午能定，但能不能先让他看别的？'},
      {choices:[
        {text:'"好的李哥！我现在就跟业主说您定了"', feedback:'good', fbText:'✅ 趁热打铁立即行动。'},
        {text:'"好，那您下午过来签合同"', feedback:'bad', fbText:'❌ 太干了没有情感连接。'},
      ]},
    ],
    endMsg:'李哥当天下午签了合同。'
  },
  {
    id: 'client-acquisition', icon: '📣', scene: 'DIM-1 获客触达',
    name: '朋友圈 300 条没人理', desc: '每天发 3 条，300 条零咨询——怎么让客户主动找你？',
    intro: '做了半年经纪，朋友圈 300 条房源信息零咨询。老经纪说要发有用的，什么是有用的？',
    turns: [
      {speaker:'client', text:'（朋友圈点赞）我家孩子明年上学，能发我看看税费清单吗？'},
      {choices:[
        {text:'"好的，您家哪个片区的？我帮您具体算"', feedback:'good', fbText:'✅ 知识获客筛选出精准客户，立刻深入挖掘。'},
        {text:'（发网上搜的通用税费表）"给您参考哈"', feedback:'bad', fbText:'❌ 太敷衍，客户要的是自己的情况。'},
      ]},
    ],
    endMsg:'第一个月就有 20 多个主动咨询，成交 3 单。'
  },
  {
    id: 'solution-design', icon: '📐', scene: 'DIM-3 专业方案',
    name: '4 室学区房预算只有 400 万', desc: '需求和预算完全不匹配，你怎么给他能接受的方案？',
    intro: '孙先生一家五口要 4 室学区房，预算 400 万。片区最低 520 万，差 120 万。',
    turns: [
      {speaker:'client', text:'帮我找个 4 室的实验小学学区房，预算 400 万。'},
      {choices:[
        {text:'"给您 3 个方案：① 隔壁三小 4 室（380 万）；② 实小 3 室改 4 室（400 万）；③ 实老小破 4 室（420 万我帮您谈）。"', feedback:'good', fbText:'✅ 不否定客户，给 3 个具体可选方案。'},
        {text:'"这个预算真找不到，您看看别的片区？"', feedback:'bad', fbText:'❌ 直接否定等于推给别人。'},
      ]},
    ],
    endMsg:'孙先生选了方案二，395 万成交。他说你是第一个没说不行的。'
  },
  {
    id: 'contract-signing', icon: '📝', scene: 'DIM-5 交易履约',
    name: '签约当天客户反悔', desc: '合同摆桌上了，客户说我再想想不签了——怎么拉回来？',
    intro: '张哥约好签 420 万的房，业主也来了。张哥说跟家人商量了想再看看。',
    turns: [
      {speaker:'client', text:'不好意思，跟家人商量了还是想再看看。今天先不签了。'},
      {choices:[
        {text:'（先对业主）"您先喝口水"（拉客户到一边）"张哥是不是家里有顾虑？您跟我说说。"', feedback:'good', fbText:'✅ 先稳业主不让场面僵住，再私下聊给足面子。'},
        {text:'"张哥！你说好来看好的啊？业主都来了你让我怎么说？"', feedback:'bad', fbText:'❌ 指责客户会更反感。'},
      ]},
    ],
    endMsg:'张哥说出老婆担心通勤，你帮她查地铁 25 分钟到公司，当天签了。'
  },
  {
    id: 'after-sale-service', icon: '💗', scene: 'DIM-6 售后复购',
    name: '老客户要装修你管不管', desc: '成交一年没联系，客户说想装修有认识的工人吗',
    intro: '去年帮陈先生买了 350 万刚需两居。他突然发消息要装修工人。',
    turns: [
      {speaker:'client', text:'兄弟，我想把客厅重新装一下，有靠谱工人吗？'},
      {choices:[
        {text:'"有！张师傅性价比高做过 8 套我客户的，李工设计好，王队全包。说是我介绍的给优惠。"', feedback:'good', fbText:'✅ 立刻提供资源有对比有背书有承诺。'},
        {text:'"装修我不懂哦不好意思"', feedback:'bad', fbText:'❌ 直接拒绝断了这条关系。'},
      ]},
    ],
    endMsg:'陈先生把你介绍给了公司 3 个同事买房。'
  },
  {
    id: 'digital-tools', icon: '🤖', scene: 'DIM-7 数字化协同',
    name: '门店要求用新系统你嫌麻烦', desc: '习惯了 Excel 不想迁，结果被客户问时答不上来',
    intro: '门店上了新系统说方便共享生成海报。你做了 5 年习惯 Excel。今天老客户问那套南北通透的 3 室在哪个小区。',
    turns: [
      {speaker:'client', text:'上次你说的那个南北通透 3 室，在哪个小区来着？'},
      {choices:[
        {text:'"稍等我系统里查——阳光花园 3 室 89 平 365 万，我把截图发您。对了系统能一键生成这套房的海报要吗？"', feedback:'good', fbText:'✅ 迁系统效率提升 3 倍还能增值。'},
        {text:'（翻 Excel 5 分钟）"好像被我覆盖掉了？不好意思"', feedback:'bad', fbText:'❌ 低级错误丢信任。'},

    endMsg:'你帮门店做了培训——怎么用系统 10 分钟发一套房的海报。'

// ===== 软技能 10 场景（共情/判断/担当/素养/服务各 2 个）=====
var SOFT_SCENES = [
  {
    id: 'empathy-anxiety', icon: '💞', scene: 'SOFT-1 共情能力',
    name: '客户焦虑到说话发抖', desc: '首付差 20 万急哭了，你说什么能让他冷静下来？',
    intro: '王姐单亲妈妈看上 420 万学区房，首付差 20 万。带看时越说越急。',
    turns: [

    intro: '验收当天客户要赶明天的搬家车，说"差不多了赶紧签了吧"。但你看到客厅踢脚线有 2 处缝隙超过 3mm（合同要求 ≤2mm），卫生间台盆玻璃胶有气泡，餐厅吊顶有 3 个钉眼没补。',
    turns: [
      {speaker:'client', text:'差不多了赶紧签吧，我明天要搬了，工人等着走。'},
      {choices:[
        {text:'"我特别理解你着急搬进去。这 3 处问题我也不想耽误你——但合同里写了验收不达标我要返工，不能糊弄你。这样：我让老李今晚加个小班把这 3 处改完，明天早上你搬的时候就好了，今晚我带你去看改完的效果拍照片给你。"', feedback:'good', fbText:'✅ 共情+站客户角度+具体可行的快速解决办法+承诺。'},
        {text:'"行，签吧"（内心知道有问题）', feedback:'bad', fbText:'❌ 放过红线，客户入住后出问题你赔。'},
        {text:'"不行，必须改完才能签"', feedback:'bad', fbText:'❌ 客户明天搬，你要解决问题而不是坚持原则。'},
      ]},
    ],
    endMsg:'客户晚上看到改完的照片，当场签了字。入住后特意给你发微信说"你是我遇到最靠谱的设计师"。'
  }
];

// ===== domain 切换（?domain=DECOR → 家装场景）=====
var CURRENT_DOMAIN_PRACTICE = (new URLSearchParams(location.search)).get('domain') || 'TRANSACTION';
var HARD_SCENES_DOMAIN = CURRENT_DOMAIN_PRACTICE === 'DECOR' ? DECOR_HARD_SCENES : HARD_SCENES;

// 动态更新页面 title 和 label
(function updatePracticeLabels(){
  if(CURRENT_DOMAIN_PRACTICE === 'DECOR'){
    var titleEl = document.querySelector('h1');
    if(titleEl) titleEl.innerHTML = '🎭 家装场景练习 · 6 个真实装修服务对话';
    document.title = '家装场景练习 · 风声聚匠星云';
    var desc = document.querySelector('.hero-desc');
    if(desc) desc.textContent = '量房/报价/交底/软装/验收——每个场景都是家装设计师/项目经理天天遇到的真实情况。';
  }
})();

// ===== 画像分数读取（用于弱项推荐排序）=====
function getPracticeProfileScores() {
  var scores = {};
  var care = null, examR = {};
  try { care = JSON.parse(localStorage.getItem('fs_care_profile')); } catch(e) {}
  try { examR = JSON.parse(localStorage.getItem('fs_exam_results')) || {}; } catch(e) {}
  var HARD_NAMES = ['获客触达','需求洞察','专业方案','带看谈判','交易履约','售后复购','数字化协同'];
  var SOFT_NAMES = ['共情能力','判断能力','责任担当','职业素养','服务意识'];
  for (var i = 0; i < 7; i++) {
    var code = 'DIM-' + (i+1), name = HARD_NAMES[i];
    var cs = care && care.dim_scores ? care.dim_scores[name] : null;
    var es = examR[code] ? examR[code].pct : null;
    if (cs != null && es != null) scores[code] = Math.max(cs, es);
    else if (cs != null) scores[code] = cs;
    else if (es != null) scores[code] = es;
  }
  for (var j = 0; j < 5; j++) {
    var scode = 'SOFT-' + (j+1), sname = SOFT_NAMES[j];
    var scs = care && care.soft_dim_scores ? care.soft_dim_scores[sname] : null;
    var ses = examR[scode] ? examR[scode].pct : null;
    if (scs != null && ses != null) scores[scode] = Math.max(scs, ses);
    else if (scs != null) scores[scode] = scs;
    else if (ses != null) scores[scode] = ses;
  }
  return scores;
}

// 从 scene 字符串提取 DIM-x / SOFT-x
function sceneDim(sceneStr) {
  var m = sceneStr && sceneStr.match(/(DIM-\d|SOFT-\d)/);
  return m ? m[1] : null;
}

function render() {
  var root = document.getElementById('root');
  var html = '';
  var doneMap = {};
  try { doneMap = JSON.parse(localStorage.getItem('fs_practice_done') || '{}'); } catch(e) {}
  var profileScores = getPracticeProfileScores();
  var hasProfile = Object.keys(profileScores).length > 0;

  if (!state.sceneId) {
    var hardList = HARD_SCENES_DOMAIN;
    var hardDone = hardList.filter(function(s){ return doneMap[s.id]; }).length;
    var softDone = SOFT_SCENES.filter(function(s){ return doneMap[s.id]; }).length;
    var totalDone = hardDone + softDone;
    var totalAll = hardList.length + SOFT_SCENES.length;
    var pct = totalDone > 0 ? Math.round(totalDone / totalAll * 100) : 0;

    // 按画像弱项排序
    var sortedHard = hardList.slice();
    var sortedSoft = SOFT_SCENES.slice();
    if (hasProfile) {
      sortedHard.sort(function(a,b){
        var sa = profileScores[sceneDim(a.scene)] != null ? profileScores[sceneDim(a.scene)] : 999;
        var sb = profileScores[sceneDim(b.scene)] != null ? profileScores[sceneDim(b.scene)] : 999;
        return sa - sb;
      });
      sortedSoft.sort(function(a,b){
        var sa = profileScores[sceneDim(a.scene)] != null ? profileScores[sceneDim(a.scene)] : 999;
        var sb = profileScores[sceneDim(b.scene)] != null ? profileScores[sceneDim(b.scene)] : 999;
        return sa - sb;
      });
    }

    // 弱项提示
    var weakCount = 0;
    if (hasProfile) {
      weakCount = sortedHard.concat(sortedSoft).filter(function(s){
        var d = sceneDim(s.scene);
        return d && profileScores[d] != null && profileScores[d] < 70;
      }).length;
    }

    html += '<div class="pg"><h2 class="pg-h">🎭 场景练习</h2>' +
      '<p class="pg-sub">练你的话术反应和价值判断 · 即时反馈 · 反复练习不丢人' +
      (totalDone > 0 ? ' · 已完成 ' + totalDone + '/' + totalAll + '（' + pct + '%）' : '') + '</p>';

    if (hasProfile && weakCount > 0) {
      html += '<div style="background:linear-gradient(135deg,#fdf0ec,#fff);border:1px solid #e8c4b8;border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:12.5px;color:#8a3d2a">⚠️ <b>画像提示</b>：你有 ' + weakCount + ' 个场景所属维度画像分低于 70，排在最前面的就是你优先要练的</div>';
    }

    if (totalDone > 0) {
      html += '<div style="background:#fff;border:1px solid #e8e4da;border-radius:10px;padding:12px 16px;margin-bottom:16px">' +
        '<div style="display:flex;justify-content:space-between;margin-bottom:6px">' +
          '<span style="font-size:12px;color:#666;font-weight:600">📈 练习进度</span>' +
          '<span style="font-size:12px;color:#1a3d24;font-weight:700">' + totalDone + '/' + totalAll + '</span>' +
        '</div>' +
        '<div style="background:#f0ece2;border-radius:6px;height:8px;overflow:hidden">' +
          '<div style="background:linear-gradient(90deg,#2d5a3d,#4a8c5f);height:100%;border-radius:6px;width:' + pct + '%"></div>' +
        '</div>' +
        '<div style="font-size:11px;color:#888;margin-top:6px">硬技能 ' + hardDone + '/' + hardList.length + ' · 软技能 ' + softDone + '/' + SOFT_SCENES.length + '</div>' +
      '</div>';
    }

    html += '<div class="grid">' +
      '<div class="p-grid-label">📐 专业硬技能 · ' + (CURRENT_DOMAIN_PRACTICE === 'DECOR' ? '家装服务 6 场景（报价/效果图/交底/软装/验收）' : '客户服务时间线（' + hardList.length + ' 场景，覆盖 DIM-1~7）') + '</div>' +
      sortedHard.map(function(s) {
        var done = doneMap[s.id];
        var dimCode = sceneDim(s.scene);
        var pScore = dimCode && profileScores[dimCode] != null ? profileScores[dimCode] : null;
        var isWeak = pScore != null && pScore < 70;
        var badge = done ? '✓ 已练' : (isWeak ? '⚠️ 弱项' : '');
        var badgeBg = done ? '#2d5a3d' : '#c25636';
        return '<div class="p-card' + (done ? ' active' : '') + (isWeak && !done ? ' is-weak' : '') + '" onclick="enterScene(\'' + s.id + '\')">' +
          '<div style="display:flex;justify-content:space-between;align-items:flex-start">' +
          '<div class="p-emoji">' + s.icon + '</div>' +
          (badge ? '<span style="font-size:10px;background:' + badgeBg + ';color:#fff;padding:2px 8px;border-radius:10px;font-weight:700">' + badge + '</span>' : '') +
          '</div>' +
          '<div class="p-scene">' + s.scene + '</div>' +
          '<div class="p-name">' + s.name + '</div>' +
          '<div class="p-desc">' + s.desc + '</div>' +
          (pScore != null ? '<div style="font-size:10px;color:' + (isWeak ? '#c25636' : '#999') + ';margin-top:2px">📊 画像分 ' + pScore + '</div>' : '') +
        '</div>';
      }).join('') +
      '<div class="p-grid-label">💞 软技能 · 价值观与判断（' + SOFT_SCENES.length + ' 场景，共情/判断/担当/素养/服务各 2 个可反复练）</div>' +
      sortedSoft.map(function(s) {
        var done = doneMap[s.id];
        var dimCode = sceneDim(s.scene);
        var pScore = dimCode && profileScores[dimCode] != null ? profileScores[dimCode] : null;
        var isWeak = pScore != null && pScore < 70;
        var badge = done ? '✓ 已练' : (isWeak ? '⚠️ 弱项' : '');
        var badgeBg = done ? '#8a7040' : '#c25636';
        return '<div class="p-card soft' + (done ? ' active' : '') + (isWeak && !done ? ' is-weak' : '') + '" onclick="enterScene(\'' + s.id + '\')">' +
          '<div style="display:flex;justify-content:space-between;align-items:flex-start">' +
          '<div class="p-emoji">' + s.icon + '</div>' +
          (badge ? '<span style="font-size:10px;background:' + badgeBg + ';color:#fff;padding:2px 8px;border-radius:10px;font-weight:700">' + badge + '</span>' : '') +
          '</div>' +
          '<div class="p-scene">' + s.scene + '</div>' +
          '<div class="p-name">' + s.name + '</div>' +
          '<div class="p-desc">' + s.desc + '</div>' +
          (pScore != null ? '<div style="font-size:10px;color:' + (isWeak ? '#c25636' : '#999') + ';margin-top:2px">📊 画像分 ' + pScore + '</div>' : '') +
        '</div>';
      }).join('') +
      '</div></div>';
  } else {
    var ALL_SCENES = HARD_SCENES_DOMAIN.concat(SOFT_SCENES);
    var scene = ALL_SCENES.find(function(s){ return s.id === state.sceneId; });
    if (!scene) { state.sceneId = null; render(); return; }
    var turns = scene.turns;

    html += '<div class="pg"><h2 class="pg-h">' + scene.icon + ' ' + scene.name + '</h2>' +
      '<p class="pg-sub">' + scene.scene + ' · ' + scene.intro + '</p></div>';

    html += '<div class="chat-box"><div class="chat-hdr">' +
      '<div class="ch-title">' + scene.icon + ' ' + scene.name + '</div>' +
      '<div class="ch-turn">进度 ' + state.turnIdx + '/' + turns.length + '</div></div>' +
      '<div class="chat-body" id="chat-body">';

    for (var i = 0; i <= state.turnIdx && i < turns.length; i++) {
      var t = turns[i];
      if (t.speaker) {
        html += '<div class="msg ' + (t.speaker === 'me' ? 'me' : 'client') + '">' +
          '<div class="avatar">' + (t.speaker === 'me' ? '🤵' : '👤') + '</div>' +
          '<div><div class="name">' + (t.speaker === 'me' ? '你（经纪人）' : '客户') + '</div>' +
          '<div class="bubble">' + t.text + '</div></div></div>';
      }
    }
    html += '</div>';

    if (state.turnIdx < turns.length && turns[state.turnIdx].choices) {
      var choiceIdx = state.stepIdx;
      var choice = turns[state.turnIdx].choices[choiceIdx];
      html += '<div class="choices">' +
        '<div class="c-label">👆 客户说完了，你准备怎么回？</div>' +
        turns[state.turnIdx].choices.map(function(c, ci) {
          var disabled = state.feedbackShown && ci !== choiceIdx ? ' disabled' : '';
          return '<button onclick="chooseOption(' + ci + ')"' + disabled + '>' + String.fromCharCode(65+ci) + '. ' + c.text + '</button>';
        }).join('') +
      '</div>';

      if (state.feedbackShown) {
        var fbClass = choice.feedback === 'good' ? 'fgood' : 'fbad';
        html += '</div></div>' +
          '<div class="feedback">' +
          '<div class="fback-title"><span class="fbadge ' + fbClass + '">' + (choice.feedback === 'good' ? '✅ 好做法' : '⚠️ 可以改进') + '</span>反馈</div>' +
          '<div class="fback-body">' + choice.fbText + '</div>' +
          '<div style="margin-top:14px;display:flex;gap:10px">' +
            '<button style="font-size:13px;padding:8px 20px;border-radius:8px;border:none;cursor:pointer;background:#1a3d24;color:#fff" onclick="nextTurn()">' +
            (state.turnIdx + 1 >= turns.length ? '🏁 看结局' : '继续 →') + '</button>' +
            '<button style="font-size:13px;padding:8px 20px;border-radius:8px;border:1px solid #e8e4da;background:#fff;cursor:pointer;color:#1a3d24" onclick="resetScene()">🔄 重玩</button>' +
          '</div>' +
        '</div>';
      } else {
        html += '</div></div>';
      }
    } else {
      html += '</div></div>';
      setTimeout(function() { nextTurn(); }, 500);
    }

    if (state.turnIdx >= turns.length) {
      try {
        var done = JSON.parse(localStorage.getItem('fs_practice_done') || '{}');
        if (!done[scene.id]) {
          done[scene.id] = { timestamp: new Date().toISOString() };
          localStorage.setItem('fs_practice_done', JSON.stringify(done));
        }
      } catch(e) {}

      // 新架构：Person 聚合层
      if (window.Person) {
        try {
          var _score = state.choiceCount > 0 ? Math.round(state.goodCount / state.choiceCount * 100) : 100;
          var _p = new window.Person();
          _p.submitPractice(scene.id, _score);
        } catch(e2) {}
      }

      html += '<div class="feedback" style="margin-top:20px">' +
        '<div class="fback-title">🏁 场景结局 <span style="font-size:10px;background:#e8f4ec;color:#2d5a3d;padding:2px 8px;border-radius:10px;margin-left:8px">✓ 已解锁徽章</span></div>' +
        '<div class="fback-body">' + scene.endMsg + '</div>' +
        '<div style="margin-top:14px;display:flex;gap:10px">' +
          '<button onclick="resetScene()" style="font-size:13px;padding:8px 20px;border-radius:8px;border:none;cursor:pointer;background:#1a3d24;color:#fff">🔄 重玩这个</button>' +
          '<button onclick="backToList()" style="font-size:13px;padding:8px 20px;border-radius:8px;border:1px solid #e8e4da;background:#fff;cursor:pointer;color:#1a3d24">🎭 选下一个</button>' +
          '<a href="/academy/profile/" style="display:inline-block;background:#fdf9ef;color:#8a7040;font-size:13px;padding:8px 20px;border-radius:8px;border:1px solid #e8e4da;text-decoration:none">🏆 看画像 →</a>' +
        '</div>' +
      '</div>';
    }
  }

  root.innerHTML = html;
  var cb = document.getElementById('chat-body');
  if (cb) cb.scrollTop = cb.scrollHeight;
}

function enterScene(id) {
  state.sceneId = id; state.turnIdx = 0; state.stepIdx = 0; state.feedbackShown = false;
  state.goodCount = 0; state.choiceCount = 0;
  render();
}
function chooseOption(i) {
  state.stepIdx = i; state.feedbackShown = true;
  var ALL_SCENES = HARD_SCENES_DOMAIN.concat(SOFT_SCENES);
  var scene = ALL_SCENES.find(function(s){ return s.id === state.sceneId; });
  if (scene && scene.turns[state.turnIdx] && scene.turns[state.turnIdx].choices && scene.turns[state.turnIdx].choices[i]) {
    state.choiceCount++;
    if (scene.turns[state.turnIdx].choices[i].feedback === 'good') state.goodCount++;
  }
  render();
}
function nextTurn() {
  state.turnIdx++; state.stepIdx = 0; state.feedbackShown = false; render();
}
function resetScene() {
  state.turnIdx = 0; state.stepIdx = 0; state.feedbackShown = false; render();
}
function backToList() { state.sceneId = null; render(); }

// URL 参数支持
(function bootstrap() {
  var params = new URLSearchParams(location.search);
  var sceneId = params.get('scene');
  var dim = params.get('dim');
  if (sceneId) {
    var all = HARD_SCENES_DOMAIN.concat(SOFT_SCENES);
    for (var i = 0; i < all.length; i++) {
      if (all[i].id === sceneId) { state.sceneId = sceneId; break; }
    }
  }
  if (!state.sceneId && dim) {
    var all2 = HARD_SCENES_DOMAIN.concat(SOFT_SCENES);
    for (var j = 0; j < all2.length; j++) {
      if (all2[j].scene && all2[j].scene.indexOf(dim) >= 0) {
        state.sceneId = all2[j].id; break;
      }
    }
  }
})();

render();
</script>
