<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>风声 · 浏览历史</title>
<meta name="description" content="风声知识底座 · 浏览历史 · 最近查看">
<style>
:root {
  --p: #3d5a3e; --p-light: #5a7d5b; --fire: #c46a3a; --fire-light: #e08a3c;
  --cream: #f7f4ef; --cream-deep: #ede7dc; --ink: #1a2b26; --ink-soft: #5a6b65;
  --wood: #c8956d; --line: rgba(61,90,62,0.12);
  --shadow-sm: 0 2px 8px rgba(61,90,62,0.06);
  --shadow-md: 0 8px 24px rgba(61,90,62,0.10);
  --layer-dao: #3d5a3e; --layer-fa: #c46a3a; --layer-shu: #6b5fa8; --layer-qi: #c8956d;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--cream);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}

/* Nav */
.nav{position:sticky;top:0;z-index:100;background:rgba(247,244,239,0.88);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
.nav-inner{max-width:1240px;margin:0 auto;padding:14px 32px;display:flex;align-items:center;gap:32px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;flex-shrink:0}
.brand-mark{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--p),var(--p-light));display:grid;place-items:center;color:white;font-weight:800}
.nav-links{display:flex;gap:4px;flex:1;flex-wrap:wrap}
.nav-link{padding:8px 16px;border-radius:8px;font-size:14px;color:var(--ink-soft);transition:all .2s;white-space:nowrap}
.nav-link:hover{background:rgba(61,90,62,0.06);color:var(--p)}
.nav-link.active{color:var(--p);font-weight:600;background:rgba(61,90,62,0.08)}

/* Main */
main{flex:1;max-width:1240px;width:100%;margin:0 auto;padding:32px 32px 60px}

/* Hero */
.hero{margin-bottom:28px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px}
.hero-left h1{font-size:32px;font-weight:800;letter-spacing:-0.5px;margin-bottom:6px}
.hero-sub{font-size:14px;color:var(--ink-soft)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;border:none;white-space:nowrap}
.btn-danger{background:rgba(196,106,58,0.08);border:1px solid rgba(196,106,58,0.2);color:var(--fire)}
.btn-danger:hover{background:rgba(196,106,58,0.15)}

/* Timeline */
.timeline{position:relative;padding-left:24px}
.timeline::before{content:'';position:absolute;left:8px;top:0;bottom:0;width:2px;background:var(--line)}
.timeline-group{margin-bottom:28px}
.timeline-date{font-size:13px;font-weight:700;color:var(--ink-soft);margin-bottom:12px;padding-left:8px;position:relative}
.timeline-date::before{content:'';position:absolute;left:-20px;top:50%;transform:translateY(-50%);width:10px;height:10px;border-radius:50%;background:var(--p);border:2px solid var(--cream)}
.timeline-items{display:flex;flex-direction:column;gap:0}
.timeline-item{background:white;border:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:14px 18px;transition:all .2s;cursor:pointer}
.timeline-item:first-child{border-radius:12px 12px 0 0}
.timeline-item:last-child{border-radius:0 0 12px 12px}
.timeline-item:only-child{border-radius:12px}
.timeline-item+.timeline-item{border-top:none}
.timeline-item:hover{background:rgba(247,244,239,0.5);border-color:rgba(61,90,62,0.2)}
.timeline-item:hover+.timeline-item{border-top-color:rgba(61,90,62,0.2)}
.timeline-time{font-size:11px;color:var(--ink-soft);flex-shrink:0;width:40px;text-align:right}
.timeline-body{flex:1;min-width:0}
.timeline-name{font-size:14px;font-weight:700;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.timeline-answer{font-size:12px;color:var(--ink-soft);line-height:1.5;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
.timeline-meta{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.timeline-tag{font-size:10px;font-weight:600;padding:2px 6px;border-radius:3px;white-space:nowrap}
.timeline-tag.type{background:rgba(61,90,62,0.08);color:var(--p)}
.timeline-tag.sev{background:rgba(196,106,58,0.08);color:var(--fire)}
.timeline-tag.pri{color:var(--ink-soft)}
.timeline-tag.pri.P0{color:var(--fire);font-weight:700}
.timeline-tag.layer.dao{background:rgba(61,90,62,0.08);color:var(--layer-dao)}
.timeline-tag.layer.fa{background:rgba(196,106,58,0.08);color:var(--layer-fa)}
.timeline-tag.layer.shu{background:rgba(107,95,168,0.08);color:var(--layer-shu)}
.timeline-tag.layer.qi{background:rgba(200,149,109,0.08);color:var(--layer-qi)}

/* Empty */
.empty{text-align:center;padding:80px 20px;color:var(--ink-soft)}
.empty-icon{font-size:64px;margin-bottom:16px;opacity:0.3}
.empty-title{font-size:20px;font-weight:700;color:var(--ink);margin-bottom:8px}
.empty-desc{font-size:14px;max-width:360px;margin:0 auto 20px}
.empty-link{display:inline-block;padding:10px 24px;border-radius:8px;background:var(--p);color:white;font-weight:600;font-size:14px;transition:all .2s}
.empty-link:hover{background:var(--p-light)}

/* Loading */
.loading-row{text-align:center;padding:40px;color:var(--ink-soft)}
.spinner{display:inline-block;width:24px;height:24px;border:3px solid var(--line);border-top-color:var(--p);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:8px}
@keyframes spin{to{transform:rotate(360deg)}}

/* Toast */
.toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%);padding:10px 24px;border-radius:10px;background:var(--ink);color:white;font-size:13px;font-weight:600;z-index:200;opacity:0;transition:all .3s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-8px)}

/* Footer */
footer{background:var(--cream-deep);padding:30px 32px 20px;color:var(--ink-soft);font-size:13px;border-top:1px solid var(--line)}
.footer-inner{max-width:1240px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px}

@media(max-width:768px){
  .nav-links{display:none}
  .hero h1{font-size:24px}
  main{padding:20px 16px}
  .timeline{padding-left:18px}
  .timeline-item{padding:10px 12px}
  .timeline-name{font-size:13px}
}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="/" class="brand">
      <div class="brand-mark">风</div><span>风声</span>
    </a>
    <div class="nav-links">
      <a href="/" class="nav-link">首页</a>
      <a href="/knowledge/" class="nav-link">知识底座</a>
      <a href="/scene/" class="nav-link">场景导航</a>
      <a href="/search/" class="nav-link">搜索</a>
      <a href="/dictionary/" class="nav-link">全量词典</a>
      <a href="/history/" class="nav-link active">历史</a>
    </div>
  </div>
</nav>

<main>
  <div class="hero">
    <div class="hero-left">
      <h1>浏览历史</h1>
      <p class="hero-sub" id="countLabel">最近 0 条浏览记录</p>
    </div>
    <button class="btn btn-danger" id="btnClearAll" style="display:none">清空历史</button>
  </div>

  <div class="timeline" id="timeline">
    <div class="loading-row"><div class="spinner"></div><div>加载中...</div></div>
  </div>

  <div class="empty" id="emptyState" style="display:none">
    <div class="empty-icon">&#128270;</div>
    <div class="empty-title">还没有浏览记录</div>
    <div class="empty-desc">浏览词条详情时，会自动记录在这里，方便你快速回顾最近查看的内容</div>
    <a href="/dictionary/" class="empty-link">去全量词典看看</a>
  </div>
</main>

<footer>
  <div class="footer-inner">
    <span>风声 · 居住服务者专业基础设施</span>
    <span>通过独立价值获得尊重</span>
  </div>
</footer>

<div class="toast" id="toast"></div>

<script>
(function() {
  'use strict';

  var $ = function(s) { return document.querySelector(s); };
  var STORAGE_KEY = 'fengsheng_history';
  var MAX_HISTORY = 100;
  var layerLabels = { dao: '道', fa: '法', shu: '术', qi: '器' };
  var severityLabels = { hard: '硬边界', medium: '中边界', soft: '软边界' };

  function getHistory() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    } catch(e) {
      return [];
    }
  }

  function clearAll() {
    localStorage.setItem(STORAGE_KEY, '[]');
    render();
  }

  function showToast(msg) {
    var t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(function() { t.classList.remove('show'); }, 2000);
  }

  function formatTime(ts) {
    var d = new Date(ts);
    var now = new Date();
    var diff = now - d;
    if (diff < 60000) return '刚刚';
    if (diff < 3600000) return Math.floor(diff / 60000) + '分钟前';
    if (diff < 86400000) return Math.floor(diff / 3600000) + '小时前';
    var pad = function(n) { return n < 10 ? '0' + n : '' + n; };
    return pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  function formatDate(ts) {
    var d = new Date(ts);
    var now = new Date();
    var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var yd = new Date(today.getTime() - 86400000);
    if (d >= today) return '今天';
    if (d >= yd) return '昨天';
    var pad = function(n) { return n < 10 ? '0' + n : '' + n; };
    return pad(d.getFullYear()) + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }

  async function loadEntryDetails(ids) {
    if (ids.length === 0) return {};
    var unique = [...new Set(ids)];
    var map = {};
    var batchSize = 50;
    for (var i = 0; i < unique.length; i += batchSize) {
      var batch = unique.slice(i, i + batchSize);
      var promises = batch.map(function(id) {
        return fetch('/api/entry?id=' + encodeURIComponent(id))
          .then(function(r) { return r.ok ? r.json() : null; })
          .catch(function() { return null; });
      });
      var results = await Promise.all(promises);
      results.forEach(function(e) {
        if (e) map[e.id] = e;
      });
    }
    return map;
  }

  async function render() {
    var records = getHistory();
    $('#countLabel').textContent = '最近 ' + records.length + ' 条浏览记录';
    $('#btnClearAll').style.display = records.length > 0 ? '' : 'none';

    if (records.length === 0) {
      $('#timeline').innerHTML = '';
      $('#emptyState').style.display = '';
      return;
    }

    $('#emptyState').style.display = 'none';
    $('#timeline').innerHTML = '<div class="loading-row"><div class="spinner"></div><div>加载词条详情...</div></div>';

    var ids = records.map(function(r) { return r.id; });
    var entryMap = await loadEntryDetails(ids);

    // Group by date
    var groups = {};
    records.forEach(function(r) {
      var date = formatDate(r.ts);
      if (!groups[date]) groups[date] = [];
      groups[date].push(r);
    });

    var html = '';
    Object.keys(groups).forEach(function(date) {
      html += '<div class="timeline-group">';
      html += '<div class="timeline-date">' + escapeHtml(date) + '</div>';
      html += '<div class="timeline-items">';
      groups[date].forEach(function(r, idx) {
        var e = entryMap[r.id];
        var name = e ? e.name : r.id;
        var answer = e ? (e.oneLineAnswer || '') : '';
        var entryType = e ? e.entryType : '';
        var severity = e ? e.severity : '';
        var priority = e ? e.priority : '';
        var layer = e ? ((e.tags || {}).layer || '') : '';
        var layerName = layerLabels[layer] || layer;

        html += '<div class="timeline-item" onclick="window.location.href=\'/entry/?id=' + encodeURIComponent(r.id) + '\'">' +
          '<div class="timeline-time">' + escapeHtml(formatTime(r.ts)) + '</div>' +
          '<div class="timeline-body">' +
            '<div class="timeline-name">' + escapeHtml(name) + '</div>' +
            (answer ? '<div class="timeline-answer">' + escapeHtml(answer) + '</div>' : '') +
            '<div class="timeline-meta">' +
              (entryType ? '<span class="timeline-tag type">' + escapeHtml(entryType) + '</span>' : '') +
              (severity ? '<span class="timeline-tag sev">' + escapeHtml(severityLabels[severity] || severity) + '</span>' : '') +
              (priority ? '<span class="timeline-tag pri ' + escapeHtml(priority) + '">' + escapeHtml(priority) + '</span>' : '') +
              (layer ? '<span class="timeline-tag layer ' + escapeHtml(layer) + '">' + escapeHtml(layerName) + '</span>' : '') +
            '</div>' +
          '</div>' +
        '</div>';
      });
      html += '</div></div>';
    });

    $('#timeline').innerHTML = html;
  }

  function escapeHtml(s) {
    if (!s) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  $('#btnClearAll').addEventListener('click', function() {
    if (confirm('确定要清空所有浏览历史吗？')) {
      clearAll();
      showToast('已清空浏览历史');
    }
  });

  render();
})();
</script>
</body>
</html>
