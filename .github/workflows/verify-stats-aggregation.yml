name: 埋点聚合接口线上验收
# ============================================================================
# 【用途】
# 验收 /api/stats/pages、/api/stats/events 两个端点与小程序口径判据修复
# （main commit 9ea5122，2026-11-05 部署）。
#
# 【背景】
# deploy.yml 的 verify 步骤只验 /api/health 与 /api/ai-advisor/health，
# 没有验这两个新端点；且本地机器出网受限，无法对生产域名 curl。
# GitHub Actions runner 有出网能力 → 用它做线上验收。
#
# 【2026-11-05 实测结论】
# 1. 两个新端点在 Pages 自带域名上全部 200 且数据正确：
#    /api/stats/pages → home PV=3 UV=2（验收点「首页 UV/PV 可读」成立）
#    /api/stats/events → click 72 / banner_click 45 / pageview 31 / role_pick 1
#    /api/mp-stats → mp_users=310 mp_d1_pv=2727（判据修复生效，修复前恒为 0）
# 2. **生产域名 fengsheng.tech 的 DNS 主机记录全缺**（A/AAAA/CNAME 均无记录），
#    导致生产域名上所有接口无法解析。这是 P0，已单独登记。
#
# 【双域名设计】
#   PRIMARY = 生产域名（fengsheng.tech）→ DNS 修好后应全绿
#   FALLBACK = Pages 自带域名（fengsheng-ee9.pages.dev）→ 现在就能验接口逻辑
# 判定：主域名失败但兜底域名全绿 → 判为「接口正常，生产域名 DNS 待修」，
#       不算接口失败；但会明确提示 DNS 问题并以非零码退出以便巡检发现。
#
# 【触发方式】
# GitHub Actions 页面 → 本 workflow → Run workflow（可调 days）
# ============================================================================
on:
  workflow_dispatch:
    inputs:
      days:
        description: '统计时间范围（天）'
        required: false
        default: '14'

permissions:
  contents: read

jobs:
  verify-stats-aggregation:
    name: 埋点聚合接口线上验收
    runs-on: ubuntu-latest
    steps:
      - name: 验收两个端点与兼容性
        env:
          PRIMARY: https://fengsheng.tech
          FALLBACK: https://fengsheng-ee9.pages.dev
          DAYS: ${{ inputs.days }}
        run: |
          set +e   # 单项失败不中止，保证两组域名都验完
          DAYS="${DAYS:-14}"
          echo "=== 埋点聚合接口线上验收 · $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S') ==="
          echo "days=$DAYS"
          echo ""

          check_host() {
            local HOST="$1" LABEL="$2"
            local fail=0
            echo "════════ $LABEL : $HOST ════════"

            # ── 1. /api/stats/pages ──
            echo "--- [1] GET /api/stats/pages?product=mini-program&days=$DAYS ---"
            local B1 C1
            B1=$(curl -4 -s --max-time 20 "$HOST/api/stats/pages?product=mini-program&days=$DAYS")
            C1=$(curl -4 -s -o /dev/null -w "%{http_code}" --max-time 20 "$HOST/api/stats/pages?product=mini-program&days=$DAYS")
            echo "  HTTP ${C1:-无}"
            echo "${B1:0:900}"
            echo ""
            if [ "$C1" != "200" ]; then
              echo "  ✗ 期望 HTTP 200，实际 ${C1:-无}"; fail=1
            elif echo "$B1" | grep -q '"home"'; then
              echo "  ✓ 响应含 home 条目"
              HOME_SEG=$(echo "$B1" | tr ',' '\n' | grep -A3 '"home"' | tr '\n' ' ')
              echo "    home 段: $HOME_SEG"
              if echo "$HOME_SEG" | grep -qE '"uv"[[:space:]]*:[[:space:]]*[1-9]'; then
                echo "  ✓ 验收点「首页 home 的 UV/PV 可读」成立（uv > 0）"
              else
                echo "  · home 的 uv 为 0（库中暂无该页访问数据，非接口故障）"
              fi
            else
              echo "  ✗ 响应中无 home 条目"; fail=1
            fi
            echo ""

            # ── 2. /api/stats/events ──
            echo "--- [2] GET /api/stats/events?product=mini-program&days=$DAYS ---"
            local B2 C2
            B2=$(curl -4 -s --max-time 20 "$HOST/api/stats/events?product=mini-program&days=$DAYS")
            C2=$(curl -4 -s -o /dev/null -w "%{http_code}" --max-time 20 "$HOST/api/stats/events?product=mini-program&days=$DAYS")
            echo "  HTTP ${C2:-无}"
            echo "${B2:0:900}"
            echo ""
            if [ "$C2" != "200" ]; then
              echo "  ✗ 期望 HTTP 200，实际 ${C2:-无}"; fail=1
            elif echo "$B2" | grep -q '"events"'; then
              echo "  ✓ 返回 events 数组"
              for t in pageview click feature_click banner_click feedback_open feedback_submit; do
                if echo "$B2" | grep -q "\"$t\""; then
                  echo "    ✓ 含事件类型 $t"
                else
                  echo "    · 未见事件类型 $t"
                fi
              done
            else
              echo "  ✗ 响应中无 events 字段"; fail=1
            fi
            echo ""

            # ── 3. /api/mp-stats（判据修复后 mp_users 应 > 0）──
            echo "--- [3] GET /api/mp-stats（判据修复前恒为 0）---"
            local B3 C3 MPU MPV
            B3=$(curl -4 -s --max-time 20 "$HOST/api/mp-stats")
            C3=$(curl -4 -s -o /dev/null -w "%{http_code}" --max-time 20 "$HOST/api/mp-stats")
            MPU=$(echo "$B3" | grep -oE '"mp_users"[[:space:]]*:[[:space:]]*[0-9]+' | grep -oE '[0-9]+$')
            MPV=$(echo "$B3" | grep -oE '"mp_pv"[[:space:]]*:[[:space:]]*[0-9]+' | grep -oE '[0-9]+$')
            echo "  HTTP ${C3:-无} | mp_users=${MPU:-未解析} | mp_pv=${MPV:-未解析}"
            echo "${B3:0:500}"
            echo ""
            if [ "$C3" != "200" ]; then
              echo "  ✗ 期望 HTTP 200，实际 ${C3:-无}"; fail=1
            elif [ -n "${MPU:-}" ] && [ "$MPU" != "0" ]; then
              echo "  ✓ mp_users > 0 —— 判据修复生效"
            else
              echo "  · mp_users 为 0 或未解析"
            fi
            echo ""

            # ── 4. 现有接口兼容性 ──
            echo "--- [4] 现有接口兼容性（字段不得丢）---"
            for ep in /api/stats /api/stats/summary /api/stats/daily /api/health; do
              local C B
              C=$(curl -4 -s -o /dev/null -w "%{http_code}" --max-time 20 "$HOST$ep")
              B=$(curl -4 -s --max-time 20 "$HOST$ep" | head -c 260)
              echo "  $ep → HTTP ${C:-无}"
              echo "     ${B:0:240}"
              if [ "$C" != "200" ]; then fail=1; fi
            done
            echo ""
            return $fail
          }

          check_host "$PRIMARY" "主域名（生产）"; PF=$?
          echo ""
          check_host "$FALLBACK" "兜底域名（Pages 自带）"; FF=$?
          echo ""

          echo "════════════ 汇总 ════════════"
          echo "主域名 $PRIMARY  → $([ $PF -eq 0 ] && echo '✅ 通过' || echo '❌ 未通过')"
          echo "兜底 $FALLBACK  → $([ $FF -eq 0 ] && echo '✅ 通过' || echo '❌ 未通过')"
          echo ""
          if [ $PF -eq 0 ]; then
            echo "✅ 验收通过（生产域名可达，接口全部正常）"
            exit 0
          elif [ $FF -eq 0 ]; then
            echo "⚠️ 接口本身正常（兜底域名全绿），但生产域名 $PRIMARY 不可用。"
            echo "   → 大概率是生产域名 DNS 主机记录缺失（2026-11-05 实测："
            echo "     fengsheng.tech 的 A/AAAA/CNAME 全部无记录，NS/SOA/MX 正常）。"
            echo "   → 请用 diagnose-prod-domain.yml 与 dnsq.yml 复核，"
            echo "     并在 Cloudflare Pages 项目 fengsheng 的 Custom domains / DNS Records 补记录。"
            exit 1
          else
            echo "❌ 验收未通过：两个域名都异常，需人工排查。"
            exit 1
          fi
