name: DNS 记录逐类型查询
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  q:
    runs-on: ubuntu-latest
    steps:
      - name: 查询各类型 DNS 记录
        env:
          PARSE: |
            import json, sys
            try:
                d = json.load(open(sys.argv[1], encoding="utf-8"))
            except Exception as e:
                print("  parse fail:", e)
                sys.exit(0)
            print("  Status:", d.get("Status"))
            ans = d.get("Answer") or []
            if not ans:
                print("   (no Answer record)")
            for a in ans:
                print("  ", a.get("type"), "->", a.get("data"), "(TTL", a.get("TTL"), ")")
        run: |
          set +e
          echo "$PARSE" > /tmp/parse_dns.py
          for rt in A AAAA CNAME NS SOA MX TXT; do
            echo "----- fengsheng.tech  $rt -----"
            curl -s --max-time 15 -H "accept: application/dns-json" \
              "https://dns.google/resolve?name=fengsheng.tech&type=$rt" -o /tmp/dns.json
            python3 /tmp/parse_dns.py /tmp/dns.json
            echo ""
          done
          echo "===== 对照组 fengsheng-ee9.pages.dev A ====="
          curl -s --max-time 15 -H "accept: application/dns-json" \
            "https://dns.google/resolve?name=fengsheng-ee9.pages.dev&type=A" -o /tmp/dns.json
          python3 /tmp/parse_dns.py /tmp/dns.json
          echo ""
          echo "===== www.fengsheng.tech A ====="
          curl -s --max-time 15 -H "accept: application/dns-json" \
            "https://dns.google/resolve?name=www.fengsheng.tech&type=A" -o /tmp/dns.json
          python3 /tmp/parse_dns.py /tmp/dns.json
          exit 0
