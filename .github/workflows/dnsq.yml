name: DNS 记录逐类型查询
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  q:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: 查询各类型 DNS 记录
        run: |
          set +e
          for rt in A AAAA CNAME NS SOA MX TXT; do
            echo "----- fengsheng.tech  $rt -----"
            curl -s --max-time 15 -H "accept: application/dns-json" \
              "https://dns.google/resolve?name=fengsheng.tech&type=$rt" -o /tmp/dns.json
            python3 scripts/parse_dns_json.py /tmp/dns.json
            echo ""
          done
          echo "===== 对照组 fengsheng-ee9.pages.dev A ====="
          curl -s --max-time 15 -H "accept: application/dns-json" \
            "https://dns.google/resolve?name=fengsheng-ee9.pages.dev&type=A" -o /tmp/dns.json
          python3 scripts/parse_dns_json.py /tmp/dns.json
          echo ""
          echo "===== www.fengsheng.tech A ====="
          curl -s --max-time 15 -H "accept: application/dns-json" \
            "https://dns.google/resolve?name=www.fengsheng.tech&type=A" -o /tmp/dns.json
          python3 scripts/parse_dns_json.py /tmp/dns.json
          exit 0
