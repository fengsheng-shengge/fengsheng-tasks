name: Auto-Configure Cloudflare Credentials from Issue

# 每小时检查 GitHub Issue #42，查看小鱼儿(Coze)是否回复了 Cloudflare 部署凭证
# (Account ID + API Token)。如果检测到完整凭证，自动配置为 GitHub Secrets
# 并触发 deploy.yml 部署工作流。

# ============================================================
# 前置配置：仓库 Settings → Secrets → New repository secret
#   Name:  AUTOMATION_PAT
#   Value: GitHub PAT（classic，需 repo 权限；或 fine-grained：
#          Issues: Read, Actions: Read & Write, Secrets: Read & Write）
# 凭证来源：https://github.com/settings/tokens
# ============================================================

on:
  schedule:
    # 每小时整点执行
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '强制重处理（忽略已处理标记）'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read
  issues: read

concurrency:
  group: auto-deploy-credentials
  cancel-in-progress: false

env:
  ISSUE_NUMBER: 42
  COZE_MARKERS: '小鱼儿|Coze|扣子|🤖|🐟|小扣子'

jobs:
  check-and-deploy:
    name: 检查小鱼儿是否回复 Cloudflare 凭证
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_credentials: ${{ steps.parse.outputs.has_credentials }}
      comment_id: ${{ steps.parse.outputs.comment_id }}
      comment_author: ${{ steps.parse.outputs.comment_author }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 校验 AUTOMATION_PAT 是否配置
        run: |
          if [ -z "${{ secrets.AUTOMATION_PAT }}" ]; then
            echo "::error::缺少 AUTOMATION_PAT secret — 无法写入 Secrets 或触发部署"
            echo ""
            echo "请到 GitHub 仓库 Settings → Secrets and variables → Actions → New repository secret 添加："
            echo "  Name:  AUTOMATION_PAT"
            echo "  Value: GitHub Personal Access Token"
            echo ""
            echo "PAT 权限要求："
            echo "  Classic: 勾选 repo (Full control of private repositories)"
            echo "  Fine-grained: Repository access=This repo; Permissions:"
            echo "    Actions: Read & Write"
            echo "    Secrets: Read & Write"
            echo "    Issues: Read"
            echo ""
            echo "生成地址：https://github.com/settings/tokens"
            exit 1
          fi
          echo "✓ AUTOMATION_PAT 已配置"

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 抓取并解析 Issue #42 评论
        id: parse
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT }}
          GITHUB_OUTPUT: ${{ github.output }}
        run: |
          FORCE="${{ inputs.force }}" python scripts/check_cloudflare_credentials.py \
            --repo "${{ github.repository }}" \
            --issue ${{ env.ISSUE_NUMBER }} \
            --coze-marker "${{ env.COZE_MARKERS }}" \
            --output /tmp/cred_result.json

          echo "=== 解析结果（已脱敏）==="
          python -c "
          import json
          r = json.load(open('/tmp/cred_result.json'))
          masked = {}
          for k, v in r.items():
            if 'token' in k.lower() or 'account_id' in k.lower():
              masked[k] = '***MASKED***' if v else ''
            else:
              masked[k] = v
          print(json.dumps(masked, ensure_ascii=False, indent=2))
          "

      - name: 写入 CLOUDFLARE_ACCOUNT_ID
        if: steps.parse.outputs.has_credentials == 'true'
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT }}
        run: |
          echo "正在配置 CLOUDFLARE_ACCOUNT_ID..."
          echo "${{ steps.parse.outputs.account_id }}" | gh secret set CLOUDFLARE_ACCOUNT_ID --repo "${{ github.repository }}"
          echo "✓ CLOUDFLARE_ACCOUNT_ID 已写入 GitHub Secrets"

      - name: 写入 CLOUDFLARE_API_TOKEN
        if: steps.parse.outputs.has_credentials == 'true'
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT }}
        run: |
          echo "正在配置 CLOUDFLARE_API_TOKEN..."
          echo "${{ steps.parse.outputs.api_token }}" | gh secret set CLOUDFLARE_API_TOKEN --repo "${{ github.repository }}"
          echo "✓ CLOUDFLARE_API_TOKEN 已写入 GitHub Secrets"

      - name: 触发部署工作流
        if: steps.parse.outputs.has_credentials == 'true'
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT }}
        run: |
          echo "正在触发 deploy.yml ..."
          gh workflow run deploy.yml --ref main --repo "${{ github.repository }}"
          echo "✓ 部署已触发"
          echo "查看运行：https://github.com/${{ github.repository }}/actions/workflows/deploy.yml"

      - name: 在来源评论加 👀 反应标记为已处理
        if: steps.parse.outputs.has_credentials == 'true'
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT }}
        run: |
          COMMENT_ID="${{ steps.parse.outputs.comment_id }}"
          if [ -n "$COMMENT_ID" ]; then
            gh api "repos/${{ github.repository }}/issues/comments/$COMMENT_ID/reactions" \
              -f content=eyes -q '.id' > /dev/null 2>&1 || true
            echo "✓ 评论 #$COMMENT_ID 已标记 👀"
          fi

      - name: 发送成功通知到 Issue
        if: steps.parse.outputs.has_credentials == 'true'
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT }}
        run: |
          BODY=$(cat <<'NOTIFY_EOF'
          🤖 **小扣子已自动处理 Cloudflare 凭证**

          - 来源评论：#${{ steps.parse.outputs.comment_id }} (@${{ steps.parse.outputs.comment_author }})
          - 提取方式：\`${{ steps.parse.outputs.format }}\`
          - ✅ \`CLOUDFLARE_ACCOUNT_ID\` 已写入 Secrets
          - ✅ \`CLOUDFLARE_API_TOKEN\` 已写入 Secrets
          - 🚀 \`deploy.yml\` 已触发 → [查看运行](${{ github.server_url }}/${{ github.repository }}/actions/workflows/deploy.yml)

          小鱼儿，部署完成后请回复确认 ✅ 或报错 ❌。
          NOTIFY_EOF
          )
          echo "$BODY" | gh issue comment ${{ env.ISSUE_NUMBER }} --repo "${{ github.repository }}" --body-file -

      - name: 检查失败时发送通知
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT }}
        run: |
          BODY=$(cat <<'ERROR_EOF'
          🤖 **小扣子定时检查告警**

          - 状态：⚠️ 工作流失败
          - 运行日志：[查看](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          - 下次检查：1 小时后自动重试

          <details><summary>可能原因</summary>

          1. \`AUTOMATION_PAT\` 过期或权限不足
          2. 小鱼儿(Coze)尚未在 Issue #42 回复完整凭证
          3. 凭证格式不在自动识别范围内

          </details>
          ERROR_EOF
          )
          echo "$BODY" | gh issue comment ${{ env.ISSUE_NUMBER }} --repo "${{ github.repository }}" --body-file - || true

      - name: 运行总结
        if: always()
        run: |
          echo "## 🤖 Cloudflare 凭证自动配置运行总结"
          echo ""
          echo "| 字段 | 值 |"
          echo "|------|-----|"
          echo "| 是否找到凭证 | ${{ steps.parse.outputs.has_credentials }} |"
          echo "| 来源评论 | ${{ steps.parse.outputs.comment_id }} |"
          echo "| 作者 | ${{ steps.parse.outputs.comment_author }} |"
          echo "| 解析方式 | ${{ steps.parse.outputs.format }} |"
          echo "| 备注 | ${{ steps.parse.outputs.error }} |"
          echo "| 运行ID | ${{ github.run_id }} |"
