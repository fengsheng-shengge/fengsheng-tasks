name: 🔬 D1 额度真凶诊断

# ============================================================================
# 【用途】
# 定位 D1 免费额度（500 万 rows read/天）到底被谁打穿。
# 手段：Cloudflare GraphQL Analytics API → d1AnalyticsAdaptiveGroups，
#       按查询维度拆 sum.rowsRead，直接看谁吃得最多。
#
# 【为什么需要】
# 2026-11-05 事故：额度被打穿后，UTC 00:00 已过（北京时间 08:00）仍处于锁死，
#   说明恢复后又被打穿了第二次。只靠读代码猜不出真凶（CI/deploy/巡检都不碰 D1，
#   daily-health-check 引用的 scripts/daily_check.py 在仓库里根本不存在），
#   只能用官方 analytics 拿实证。
#
# 【只读】本 workflow 只调用 GraphQL 查询接口，不做任何写操作。
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      hours:
        description: '回溯时长（小时）'
        required: false
        default: '48'
      top:
        description: '输出条数'
        required: false
        default: '30'

permissions:
  contents: read

jobs:
  diagnose:
    name: 查 D1 rows read 排行
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 查询 D1 analytics（按查询维度拆 rows read）
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HOURS: ${{ inputs.hours }}
          TOP: ${{ inputs.top }}
        run: |
          set -e
          echo "=== D1 额度诊断 · 回溯 ${HOURS:-48} 小时 ==="
          python3 scripts/diagnose_d1_quota.py

      - name: 查询 D1 库清单与大小
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          echo ""
          echo "=== D1 数据库清单 ==="
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database" \
            -o /tmp/dblist.json
          python3 scripts/format_d1_list.py /tmp/dblist.json

      - name: 列出账户下的 Workers / Pages（找 D1 查询的真凶归属）
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          echo ""
          python3 scripts/list_cloudflare_apps.py
          exit 0

      - name: 取证 · events 索引清单与规模（RAISE 诊断件）
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          npm i -g wrangler >/dev/null 2>&1
          echo "=== 取证 · events 索引与规模 ==="
          echo "（本步骤预期报错：RAISE 把取证文本写进错误信息，这是刻意设计）"
          echo ""
          wrangler d1 execute fengsheng-events --remote \
            --file migrations/009_probe_events_query_plan.sql 2>&1 | tail -20

      - name: 取证 · 热点查询执行计划（额度恢复后可用）
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          echo ""
          echo "=== 热点查询执行计划（EXPLAIN QUERY PLAN）==="
          echo "说明：--command 走 query API，额度锁死时会被预检拦住；恢复后才出结果。"
          echo ""
          wrangler d1 execute fengsheng-events --remote --command \
            "EXPLAIN QUERY PLAN SELECT id, uid, event_type, product, page FROM events WHERE page = 'home' ORDER BY created_at ASC LIMIT 100;" 2>&1 | tail -20
          echo ""
          echo "--- 对照：无索引时的计划（应走 SCAN events USING INDEX idx_events_created_at）---"
          wrangler d1 execute fengsheng-events --remote --command \
            "EXPLAIN QUERY PLAN SELECT page, COUNT(*) as cnt FROM events WHERE page != '' GROUP BY page ORDER BY cnt DESC LIMIT 50;" 2>&1 | tail -20
          exit 0
