name: Setup Cloudflare Secrets
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/setup-secrets.yml'

jobs:
  setup:
    name: Configure Cloudflare Secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      secrets: write
    steps:
      - name: Set CLOUDFLARE_ACCOUNT_ID
        uses: actions/github-script@v7
        with:
          script: |
            const accountId = '820ba2e41397586d11f7c6bbf47cda0f';
            const { data: pubkey } = await github.rest.actions.getRepoPublicKey({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const sodium = require('tweetsodium');
            const messageBytes = Buffer.from(accountId);
            const keyBytes = Buffer.from(pubkey.key, 'base64');
            const encryptedBytes = sodium.seal(messageBytes, keyBytes);
            const encryptedValue = Buffer.from(encryptedBytes).toString('base64');

            await github.rest.actions.createOrUpdateRepoSecret({
              owner: context.repo.owner,
              repo: context.repo.repo,
              secret_name: 'CLOUDFLARE_ACCOUNT_ID',
              encrypted_value: encryptedValue,
              key_id: pubkey.key_id,
            });
            console.log('CLOUDFLARE_ACCOUNT_ID set successfully');

      - name: Set CLOUDFLARE_API_TOKEN
        uses: actions/github-script@v7
        with:
          script: |
            const apiToken = 'cfut_yXKzr53BVlRa4e5DsXC4s7h5qmo0qjfU6acSqkive5858f06';
            const { data: pubkey } = await github.rest.actions.getRepoPublicKey({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const sodium = require('tweetsodium');
            const messageBytes = Buffer.from(apiToken);
            const keyBytes = Buffer.from(pubkey.key, 'base64');
            const encryptedBytes = sodium.seal(messageBytes, keyBytes);
            const encryptedValue = Buffer.from(encryptedBytes).toString('base64');

            await github.rest.actions.createOrUpdateRepoSecret({
              owner: context.repo.owner,
              repo: context.repo.repo,
              secret_name: 'CLOUDFLARE_API_TOKEN',
              encrypted_value: encryptedValue,
              key_id: pubkey.key_id,
            });
            console.log('CLOUDFLARE_API_TOKEN set successfully');

      - name: Trigger Deploy
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yml',
              ref: 'main',
              inputs: {
                environment: 'production'
              }
            });
            console.log('Deploy workflow triggered');
