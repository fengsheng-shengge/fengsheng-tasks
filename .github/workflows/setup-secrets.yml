name: Setup Cloudflare Secrets
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: '触发部署'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  trigger-deploy:
    name: Trigger Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Deploy to Cloudflare Pages
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yml',
              ref: 'main',
              inputs: {
                environment: 'production'
              }
            });
            console.log('Deploy workflow triggered');
