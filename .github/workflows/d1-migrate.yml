name: D1 Database Migration
on:
  workflow_dispatch:
    inputs:
      migration_file:
        description: '要执行的 SQL 文件名（migrations/ 目录下）'
        required: true
        default: '003_create_leads.sql'
      db_name:
        description: 'D1 数据库名'
        required: true
        default: 'fengsheng-db'
        type: choice
        options:
          - fengsheng-db
          - fengsheng-db-prod

permissions:
  contents: read

jobs:
  migrate:
    name: Execute D1 migration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Wrangler
        run: npm i -g wrangler

      - name: List all D1 databases in account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "=== Listing all D1 databases ==="
          wrangler d1 list --json
          echo "=== Done ==="

      - name: Show migration file
        run: |
          echo "=== Migration file: migrations/${{ github.event.inputs.migration_file }} ==="
          cat "migrations/${{ github.event.inputs.migration_file }}"

      - name: Execute D1 migration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "=== Executing wrangler d1 execute ${{ github.event.inputs.db_name }} --remote --file=migrations/${{ github.event.inputs.migration_file }} ==="
          wrangler d1 execute "${{ github.event.inputs.db_name }}" \
            --remote \
            --file "migrations/${{ github.event.inputs.migration_file }}"

      - name: Verify leads table
        if: contains(github.event.inputs.migration_file, 'leads')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "=== Verify ==="
          wrangler d1 execute "${{ github.event.inputs.db_name }}" \
            --remote \
            --command "SELECT name FROM sqlite_master WHERE type='table' AND name='leads';"
