<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>风声 · 全量词典</title>
<meta name="description" content="风声知识底座 · 全量词典 · 多维度筛选 · 道法术器 · 6597条词条">
<style>
:root {
  --p: #3d5a3e; --p-light: #5a7d5b; --fire: #c46a3a; --fire-light: #e08a3c;
  --cream: #f7f4ef; --cream-deep: #ede7dc; --ink: #1a2b26; --ink-soft: #5a6b65;
  --wood: #c8956d; --line: rgba(61,90,62,0.12);
  --shadow-sm: 0 2px 8px rgba(61,90,62,0.06);
  --shadow-md: 0 8px 24px rgba(61,90,62,0.10);
  --layer-dao: #3d5a3e; --layer-fa: #c46a3a; --layer-shu: #6b5fa8; --layer-qi: #c8956d;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--cream);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}

/* Nav */
.nav{position:sticky;top:0;z-index:100;background:rgba(247,244,239,0.88);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
.nav-inner{max-width:1240px;margin:0 auto;padding:14px 32px;display:flex;align-items:center;gap:32px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;flex-shrink:0}
.brand-mark{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--p),var(--p-light));display:grid;place-items:center;color:white;font-weight:800}
.nav-links{display:flex;gap:4px;flex:1;flex-wrap:wrap}
.nav-link{padding:8px 16px;border-radius:8px;font-size:14px;color:var(--ink-soft);transition:all .2s;white-space:nowrap}
.nav-link:hover{background:rgba(61,90,62,0.06);color:var(--p)}
.nav-link.active{color:var(--p);font-weight:600;background:rgba(61,90,62,0.08)}

/* Main */
main{flex:1;max-width:1240px;width:100%;margin:0 auto;padding:32px 32px 60px}

/* Hero */
.hero{margin-bottom:24px}
.hero h1{font-size:32px;font-weight:800;letter-spacing:-0.5px;margin-bottom:8px}
.hero-sub{font-size:14px;color:var(--ink-soft);margin-bottom:16px}

/* Scene Tabs — 业务场景 */
.scene-tabs{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap;padding:6px;background:rgba(61,90,62,0.06);border-radius:12px}
.scene-tab{padding:8px 18px;border-radius:8px;font-size:13px;font-weight:600;color:var(--ink-soft);cursor:pointer;transition:all .15s;white-space:nowrap}
.scene-tab:hover{color:var(--p)}
.scene-tab.active{background:var(--p);color:white;box-shadow:0 2px 8px rgba(61,90,62,0.15)}
.scene-tab .count{font-size:10px;opacity:0.7;margin-left:4px;font-weight:500}
.scene-tab.active .count{opacity:0.8}

/* Search */
.search-row{display:flex;gap:10px;align-items:center;margin-bottom:20px;flex-wrap:wrap}
.search-box{display:flex;align-items:center;gap:10px;padding:10px 16px;background:white;border:1.5px solid var(--line);border-radius:10px;flex:1;min-width:240px;max-width:480px;transition:all .2s}
.search-box:focus-within{border-color:var(--p);box-shadow:var(--shadow-sm)}
.search-box input{flex:1;border:none;outline:none;font-size:14px;color:var(--ink);background:transparent;font-family:inherit}
.search-box input::placeholder{color:var(--ink-soft)}
.search-box svg{color:var(--ink-soft);flex-shrink:0}
.search-clear{width:24px;height:24px;border-radius:50%;background:var(--cream);border:none;cursor:pointer;display:none;align-items:center;justify-content:center;font-size:12px;color:var(--ink-soft);flex-shrink:0}
.search-clear.visible{display:flex}
.search-btn{padding:10px 20px;border-radius:8px;background:var(--p);color:white;font-size:13px;font-weight:600;border:none;cursor:pointer;transition:all .2s;white-space:nowrap}
.search-btn:hover{background:var(--p-light)}
.count-badge{font-size:13px;color:var(--ink-soft);white-space:nowrap}
.count-badge strong{color:var(--p);font-size:16px}

/* Filters */
.filters-wrap{display:flex;flex-direction:column;gap:8px;margin-bottom:20px;padding:16px 20px;background:white;border:1px solid var(--line);border-radius:12px}
.filter-row{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap;padding:6px 0;border-bottom:1px dashed var(--line)}
.filter-row:last-child{border-bottom:none;padding-bottom:0}
.filter-row:first-child{padding-top:0}
.filter-label{font-size:11px;font-weight:700;color:var(--p);letter-spacing:0.5px;min-width:56px;padding-top:6px;flex-shrink:0;display:flex;align-items:center;gap:4px}
.filter-label .help-icon{font-size:10px;cursor:help;opacity:0.6}
.filter-chips{display:flex;gap:5px;flex-wrap:wrap;flex:1}
.filter-chips.grouped{flex-direction:column;gap:2px;align-items:stretch}
.filter-chip{font-size:12px;padding:4px 12px;border-radius:100px;background:var(--cream);border:1px solid transparent;color:var(--ink-soft);cursor:pointer;transition:all .15s;white-space:nowrap;user-select:none}
.filter-chip:hover{background:rgba(61,90,62,0.08);color:var(--p)}
.filter-chip.active{background:var(--p);color:white;border-color:var(--p);font-weight:600}
.filter-chip .count{font-size:10px;opacity:0.7;margin-left:3px}

/* Filter groups */
.filter-group-title{font-size:11px;font-weight:800;color:var(--ink);margin:4px 0 2px;letter-spacing:0.5px}
.filter-subgroup{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:4px}
.filter-subgroup-label{font-size:10px;font-weight:700;color:var(--ink-soft);min-width:44px;padding-top:5px;flex-shrink:0}

/* Severity tooltip */
.sev-help{position:relative;display:inline-block}
.sev-help-popup{display:none;position:absolute;top:100%;left:0;margin-top:6px;padding:10px 14px;background:var(--ink);color:white;border-radius:8px;font-size:12px;line-height:1.8;white-space:nowrap;z-index:10;box-shadow:var(--shadow-md)}
.sev-help:hover .sev-help-popup{display:block}
.sev-help-popup .sev-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}

/* Table */
.table-wrap{overflow-x:auto;background:white;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-sm);margin-bottom:24px}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{padding:12px 14px;text-align:left;font-weight:700;font-size:12px;color:var(--ink-soft);border-bottom:2px solid var(--line);white-space:nowrap;background:rgba(61,90,62,0.03);position:sticky;top:0;cursor:pointer;user-select:none;transition:all .15s}
thead th:hover{color:var(--p);background:rgba(61,90,62,0.06)}
thead th .sort-arrow{font-size:10px;margin-left:4px;opacity:0.4}
thead th.sorted .sort-arrow{opacity:1;color:var(--p)}
tbody td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:rgba(61,90,62,0.03)}
tbody tr{cursor:pointer;transition:background .15s}
.col-name{font-weight:600;color:var(--ink);max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.col-answer{max-width:300px;color:var(--ink-soft);font-size:12px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.col-layer{font-size:11px;font-weight:600;padding:2px 8px;border-radius:4px;white-space:nowrap}
.col-layer.dao{background:rgba(61,90,62,0.08);color:var(--layer-dao)}
.col-layer.fa{background:rgba(196,106,58,0.08);color:var(--layer-fa)}
.col-layer.shu{background:rgba(107,95,168,0.08);color:var(--layer-shu)}
.col-layer.qi{background:rgba(200,149,109,0.08);color:var(--layer-qi)}
.col-type{font-size:11px;font-weight:600;padding:2px 6px;border-radius:4px;background:rgba(61,90,62,0.06);color:var(--p);white-space:nowrap}
.col-sev{font-size:11px;font-weight:600;white-space:nowrap}
.col-sev.hard{color:var(--fire)}
.col-sev.medium{color:var(--fire-light)}
.col-sev.soft{color:var(--ink-soft)}
.col-pri{font-size:11px;font-weight:700;white-space:nowrap}
.col-pri.P0{color:var(--fire)}
.col-pri.P1{color:var(--fire-light)}
.col-pri.P2{color:var(--p)}
.col-pri.P3{color:var(--ink-soft)}

/* Pagination */
.pagination{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:40px;flex-wrap:wrap}
.page-btn{padding:8px 14px;border-radius:8px;background:white;border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--ink-soft);cursor:pointer;transition:all .15s}
.page-btn:hover:not(:disabled){background:var(--p);color:white;border-color:var(--p)}
.page-btn.active{background:var(--p);color:white;border-color:var(--p);font-weight:700}
.page-btn:disabled{opacity:0.4;cursor:not-allowed}
.page-info{font-size:12px;color:var(--ink-soft);padding:0 8px}

/* Loading */
.loading-row{text-align:center;padding:40px;color:var(--ink-soft)}
.spinner{display:inline-block;width:24px;height:24px;border:3px solid var(--line);border-top-color:var(--p);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:8px}
@keyframes spin{to{transform:rotate(360deg)}}

/* Empty */
.empty{text-align:center;padding:60px 20px;color:var(--ink-soft)}
.empty-icon{font-size:48px;margin-bottom:12px;opacity:0.3}
.empty-title{font-size:18px;font-weight:700;color:var(--ink);margin-bottom:8px}
.empty-desc{font-size:14px}

/* Footer */
footer{background:var(--cream-deep);padding:30px 32px 20px;color:var(--ink-soft);font-size:13px;border-top:1px solid var(--line)}
.footer-inner{max-width:1240px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px}

/* Filter toggle — 折叠筛选器 */
.filter-toggle{display:flex;align-items:center;gap:10px;padding:10px 16px;background:white;border:1px solid var(--line);border-radius:10px;cursor:pointer;transition:all .2s;margin-bottom:12px;user-select:none}
.filter-toggle:hover{border-color:var(--p);background:rgba(61,90,62,0.03)}
.filter-toggle .ft-label{font-size:13px;font-weight:600;color:var(--ink)}
.filter-toggle .ft-badge{font-size:11px;padding:2px 10px;border-radius:100px;background:var(--p);color:white;font-weight:600;margin-left:4px;display:none}
.filter-toggle .ft-badge.show{display:inline-block}
.filter-toggle .ft-arrow{font-size:14px;color:var(--ink-soft);margin-left:auto;transition:transform .25s ease}
.filter-toggle.open .ft-arrow{transform:rotate(180deg)}
.filters-wrap.collapsed{display:none}

/* Active filters — 当前筛选条 */
.active-filters{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:14px;min-height:0}
.active-filters:empty{display:none}
.active-filters .af-label{font-size:11px;font-weight:700;color:var(--ink-soft);margin-right:4px;white-space:nowrap}
.active-filter-chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:4px 10px 4px 14px;border-radius:100px;background:rgba(61,90,62,0.08);color:var(--p);font-weight:500;cursor:pointer;transition:all .15s;border:1px solid transparent}
.active-filter-chip:hover{background:rgba(61,90,62,0.15);border-color:rgba(61,90,62,0.2)}
.active-filter-chip .af-remove{font-size:10px;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);transition:all .15s}
.active-filter-chip .af-remove:hover{background:rgba(61,90,62,0.2);color:var(--ink)}
.active-filter-chip .af-clear-all{font-size:12px;color:var(--fire);font-weight:600;margin-left:4px;padding:4px 12px;border-radius:100px;background:rgba(196,106,58,0.08);cursor:pointer}
.active-filter-chip .af-clear-all:hover{background:rgba(196,106,58,0.15)}

/* 场景导航模式 */
.lifecycle-toggle{display:flex;align-items:center;gap:8px;padding:8px 16px;border-radius:8px;background:white;border:1.5px solid var(--line);cursor:pointer;transition:all .2s;font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:12px;user-select:none}
.lifecycle-toggle:hover{border-color:var(--p);color:var(--p)}
.lifecycle-toggle.active{background:rgba(61,90,62,0.06);border-color:var(--p);color:var(--p)}
.lifecycle-toggle .lt-icon{font-size:16px;margin-right:4px}
.lifecycle-toggle .lt-arrow{font-size:12px;margin-left:auto;transition:transform .25s}
.lifecycle-toggle.active .lt-arrow{transform:rotate(180deg)}

.lifecycle-nav{display:none;margin-bottom:16px;padding:16px 20px;background:white;border:1px solid var(--line);border-radius:12px;flex-direction:column;gap:12px}
.lifecycle-nav.visible{display:flex}
.lifecycle-nav .ln-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lifecycle-nav .ln-label{font-size:11px;font-weight:700;color:var(--p);min-width:48px;flex-shrink:0}
.lifecycle-ct-btn{padding:6px 14px;border-radius:8px;border:1.5px solid var(--line);background:white;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;color:var(--ink-soft);white-space:nowrap}
.lifecycle-ct-btn:hover{border-color:var(--p);color:var(--p)}
.lifecycle-ct-btn.active{background:var(--p);color:white;border-color:var(--p);box-shadow:var(--shadow-sm)}
.lifecycle-stage-btn{padding:7px 16px;border-radius:100px;border:1.5px solid var(--line);background:white;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;color:var(--ink-soft);white-space:nowrap;display:flex;align-items:center;gap:5px}
.lifecycle-stage-btn:hover{border-color:var(--p);color:var(--p);background:rgba(61,90,62,0.03)}
.lifecycle-stage-btn.active{background:var(--p);color:white;border-color:var(--p);box-shadow:var(--shadow-sm)}
.lifecycle-stage-btn .ls-icon{font-size:15px}
.lifecycle-stage-btn .ls-desc{font-size:11px;color:var(--ink-soft);font-weight:400;display:none}
.lifecycle-stage-btn.active .ls-desc{color:rgba(255,255,255,0.7)}
.lifecycle-stage-btn:hover .ls-desc{display:inline}
.lifecycle-nav .ln-badge{font-size:11px;padding:2px 10px;border-radius:100px;background:rgba(61,90,62,0.06);color:var(--ink-soft);font-weight:500}

@media(max-width:768px){
  .nav-links{display:none}
  .hero h1{font-size:24px}
  main{padding:20px 16px}
  .filter-row{flex-direction:column;gap:6px}
  .table-wrap{font-size:12px}
  thead th,tbody td{padding:8px 10px}
  .col-name{max-width:200px}
  .col-answer{max-width:160px}
  .lifecycle-nav{padding:12px}
  .lifecycle-stage-btn{font-size:12px;padding:5px 12px}
}
</style>
<script src="/tracker.js" async></script>
</head>

<nav class="nav">
  <div class="nav-inner">
    <a href="/" class="brand">
      <div class="brand-mark">风</div>
      <span>风声</span>
    </a>
    <div class="nav-links">
      <a href="/" class="nav-link">首页</a>
      <a href="/knowledge/" class="nav-link">知识底座</a>
      <a href="/dictionary/?sceneMode=true" class="nav-link">场景导航</a>
      <a href="/search/" class="nav-link">搜索</a>
      <a href="/dictionary/" class="nav-link active">全量词典</a>
    </div>
  </div>
</nav>

<main>
  <div class="hero">
    <h1>全量词典</h1>
    <p class="hero-sub">6597条词条 · 按业务场景分类 · 多维度筛选定位</p>
  </div>

  <!-- 业务场景 Tabs -->
  <div class="scene-tabs" id="sceneTabs">
    <span class="scene-tab active" data-scene="all">全部场景</span>
    <span class="scene-tab" data-scene="rental">租赁服务</span>
    <span class="scene-tab" data-scene="trading">房屋买卖</span>
    <span class="scene-tab" data-scene="owner">业主服务</span>
    <span class="scene-tab" data-scene="career">职业成长</span>
    <span class="scene-tab" data-scene="cross">跨域通用</span>
  </div>

  <!-- 场景导航模式切换 -->
  <div class="lifecycle-toggle" id="lifecycleToggle">

    <span>场景导航模式</span>
    <span class="lt-badge" id="lifecycleBadge" style="font-size:11px;padding:2px 8px;border-radius:100px;background:var(--p);color:white;display:none">已开启</span>

  </div>

  <!-- 生命周期阶段选择器 -->
  <div class="lifecycle-nav" id="lifecycleNav">
    <div class="ln-row">
      <span class="ln-label">客户类型</span>
      <div id="lifecycleClientTypes">
        <button class="lifecycle-ct-btn active" data-ct="buyer">🏠 买方</button>
        <button class="lifecycle-ct-btn" data-ct="seller">💰 卖家</button>
        <button class="lifecycle-ct-btn" data-ct="owner">🔑 业主</button>
        <button class="lifecycle-ct-btn" data-ct="landlord">🏘️ 房东</button>
        <button class="lifecycle-ct-btn" data-ct="tenant">🏡 租户</button>
      </div>
    </div>
    <div class="ln-row">
      <span class="ln-label">业务阶段</span>
      <div id="lifecycleStages" class="ln-row" style="min-width:0;flex:1"></div>
    </div>
  </div>

  <!-- Search -->
  <div class="search-row">
    <div class="search-box">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="keywordInput" placeholder="搜索词条名称、一句话回答、消费者问题..." autocomplete="off">
      <button class="search-clear" id="searchClear">✕</button>
    </div>
    <button class="search-btn" id="searchBtn">搜索</button>
    <button class="search-btn" id="exportBtn" style="background:white;color:var(--p);border:1px solid var(--line)">导出</button>
    <span class="count-badge" id="countBadge"></span>
  </div>

  <!-- Filter toggle 折叠按钮 -->
  <div class="filter-toggle" id="filterToggle">
    <span class="ft-label">筛选条件</span>
    <span class="ft-badge" id="filterBadge">0</span>
    <span class="ft-arrow">▼</span>
  </div>

  <!-- Filters -->
  <div class="filters-wrap" id="filtersWrap">
    <div class="filter-row">
      <span class="filter-label">服务对象</span>
      <div class="filter-chips" id="filterClientType"></div>
    </div>
    <div class="filter-row">
      <span class="filter-label">服务阶段</span>
      <div class="filter-chips" id="filterStage"></div>
    </div>
    <div class="filter-row">
      <span class="filter-label">知识域</span>
      <div class="filter-chips grouped" id="filterDomain"></div>
    </div>
    <div class="filter-row">
      <span class="filter-label">知识层级</span>
      <div class="filter-chips" id="filterLayer"></div>
    </div>
    <div class="filter-row">
      <span class="filter-label">词条类型</span>
      <div class="filter-chips" id="filterEntryType"></div>
    </div>
    <div class="filter-row">
      <span class="filter-label">
        风险等级
        <span class="sev-help">
          <span class="help-icon">ⓘ</span>
          <span class="sev-help-popup">
            <span><span class="sev-dot" style="background:#c46a3a"></span>红线：绝对不能碰，必出问题</span><br>
            <span><span class="sev-dot" style="background:#e08a3c"></span>提醒：需要注意，容易出纠纷</span><br>
            <span><span class="sev-dot" style="background:#5a7d5b"></span>建议：做好了更专业，客户更信任</span>
          </span>
        </span>
      </span>
      <div class="filter-chips" id="filterSeverity"></div>
    </div>
    <div class="filter-row">
      <span class="filter-label">优先级</span>
      <div class="filter-chips" id="filterPriority"></div>
    </div>
    <div class="filter-row">
      <span class="filter-label">业务场景</span>
      <div class="filter-chips" id="filterSubSceneGroup"></div>
    </div>
  </div>

  <!-- Active filters 当前筛选条 -->
  <div class="active-filters" id="activeFilters"></div>

  <!-- Table -->
  <div class="table-wrap" id="tableWrap">
    <table>
      <thead>
        <tr>
          <th data-sort="name" style="width:30%">词条名称 <span class="sort-arrow">↕</span></th>
          <th data-sort="priority" style="width:7%">优先级 <span class="sort-arrow">↕</span></th>
          <th data-sort="severity" style="width:8%">风险等级 <span class="sort-arrow">↕</span></th>
          <th style="width:6%">层级</th>
          <th style="width:8%">类型</th>
          <th style="width:41%">一句话回答</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr class="loading-row"><td colspan="6"><div class="spinner"></div><div>加载中...</div></td></tr>
      </tbody>
    </table>
  </div>

  <!-- Pagination -->
  <div class="pagination" id="pagination"></div>
</main>

<footer>
  <div class="footer-inner">
    <span>风声 · 居住服务者专业基础设施</span>
    <span>通过独立价值获得尊重</span>
  </div>
</footer>

<script>
(function() {
  'use strict';

  var state = {
    filters: {
      clientType: '', stage: '', domain: '', layer: '', entryType: '', severity: '', priority: '', subSceneGroup: ''
    },
    filterOptions: {},
    keyword: '',
    page: 1, pageSize: 20, total: 0, totalPages: 0,
    sort: 'priority', order: 'asc',
    entries: [],
    loading: false
  };

  var $ = function(s) { return document.querySelector(s); };
  var $$ = function(s) { return document.querySelectorAll(s); };

  var layerLabels = { dao: '道', fa: '法', shu: '术', qi: '器' };
  var severityLabels = { hard: '红线', medium: '提醒', soft: '建议' };
  var ctLabels = {
    agent: '经纪人', buyer: '买方', landlord: '房东',
    owner: '业主', seller: '卖家', tenant: '租户',
    renter: '租户'
  };
  var stLabels = {
    pre: '售前', mid: '售中', post: '售后',
    holding: '持有中', own: '业主侧', pst: '售后',
    selling: '出售中', sng: '场景中',
    all: '全阶段'
  };
  var entryTypeLabels = {
    CASE: '案例类', Knowledge: '知识类', LAW: '法律类',
    POL: '政策类', PROC: '流程类', RISK: '风险类',
    STD: '标准类', TERM: '术语类', SKILL: '技能类'
  };
  var priorityLabels = {
    P0: '最高优', P1: '高优', P2: '中优', P3: '一般'
  };
  // 知识域全量中文映射（含代码→中文）
  var domainLabels = {
    // 生命周期类
    '签约前': '签约前', '签约中': '签约中', '签约后': '签约后',
    '居住中': '居住中', '退租出售': '退租出售',
    // 业务职能类
    '业主': '业主服务', '职业成长': '职业成长',
    '资产持有与运营': '资产持有与运营', '跨域通用': '跨域通用',
    '资产持有与运营·业主侧': '资产持有·业主侧',
    '业主侧': '业主侧', '业主出售': '业主出售',
    // 子域类
    '谈判斡旋': '谈判斡旋', '客户解码': '客户解码',
    '法规政策': '法规政策', '学区教育': '学区教育',
    '带看服务': '带看服务', '交房售后': '交房售后',
    '购房': '购房', '房东出租': '房东出租', '租住': '租住',
    // 英文代码 → 中文
    'CAR': '资产域', 'OWN': '业主域', 'SNG': '场景域',
    'trade': '交易域', 'CRO': '客关域',
    // 岗位代码 → 中文（A类=交易线，B类=租赁/家装，C类=家政线，G类=适老，H类=...）
    'A1': '房产经纪人', 'A2': '居住服务顾问', 'A3': 'A3岗', 'A4': 'A4岗',
    'B1': '租赁管家', 'B2': '整装设计师', 'B3': '家装监理', 'B4': 'B4岗',
    'C1': '家政服务员', 'C2': '收纳整理师', 'C3': 'C3岗',
    'G1': 'G1岗', 'G2': 'G2岗', 'G3': 'G3岗', 'G4': 'G4岗',
    'H1': 'H1岗', 'H2': 'H2岗', 'H3': 'H3岗', 'H4': 'H4岗'
  };
  // 知识域分组（按类别组织，便于用户理解）
  var domainGroups = [
    { key: 'lifecycle', label: '客户生命周期', items: ['签约前', '签约中', '签约后', '居住中', '退租出售'] },
    { key: 'business',  label: '业务职能域', items: ['业主服务', '资产持有与运营', '职业成长', '跨域通用'] },
    { key: 'code',      label: '代码域', items: ['资产域', '业主域', '场景域', '交易域'] },
    { key: 'post',      label: '岗位域', items: ['房产经纪人', '居住服务顾问', '租赁管家', '整装设计师', '家装监理', '家政服务员', '收纳整理师', 'A3岗', 'A4岗', 'B4岗', 'C3岗', 'G1岗', 'G2岗', 'G3岗', 'G4岗', 'H1岗', 'H2岗', 'H3岗', 'H4岗'] },
  ];
  // 业务场景 → 筛选条件映射
  var sceneFilters = {
    all:     { clientType: null, domain: null,  label: '全部场景' },
    rental:  { clientType: 'tenant', domain: null, label: '租赁服务' },
    trading: { clientType: 'buyer',  domain: null, label: '房屋买卖' },
    owner:   { clientType: 'owner',  domain: null, label: '业主服务' },
    career:  { clientType: null, domain: '职业成长', label: '职业成长' },
    cross:   { clientType: null, domain: '跨域通用', label: '跨域通用' },
  };

  function init() {
    var params = new URLSearchParams(window.location.search);
    ['clientType','stage','domain','layer','entryType','severity','priority','subSceneGroup'].forEach(function(k) {
      var v = params.get(k);
      if (v) state.filters[k] = v;
    });
    // Convert English codes to Chinese values for clientType/stage if needed
    var ctReverse = { agent: '经纪人', buyer: '买方', landlord: '房东', owner: '业主', seller: '卖家', tenant: '租户', renter: '租户' };
    var stReverse = { pre: '售前', mid: '售中', post: '售后', holding: '持有中', own: '业主侧', pst: '售后', selling: '出售中', sng: '场景中', all: '全阶段' };
    if (state.filters.clientType && ctReverse[state.filters.clientType]) {
      state.filters.clientType = ctReverse[state.filters.clientType];
    }
    if (state.filters.stage && stReverse[state.filters.stage]) {
      state.filters.stage = stReverse[state.filters.stage];
    }
    state.keyword = params.get('keyword') || '';

    // 从URL参数或当前筛选推断业务场景
    var scene = params.get('scene') || detectScene();
    setScene(scene, false);

    if (state.keyword) {
      $('#keywordInput').value = state.keyword;
      $('#searchClear').classList.add('visible');
    }

    loadData();
    setupEvents();

    // 初始折叠筛选器（默认收起）
    $('#filtersWrap').classList.add('collapsed');
  }

  // 根据当前筛选推断所在场景
  function detectScene() {
    var f = state.filters;
    if (f.domain === '职业成长') return 'career';
    if (f.domain === '跨域通用') return 'cross';
    if (f.clientType === 'tenant' || f.clientType === 'landlord') return 'rental';
    if (f.clientType === 'buyer' || f.clientType === 'seller') return 'trading';
    if (f.clientType === 'owner') return 'owner';
    return 'all';
  }

  function setScene(sceneKey, reload) {
    var sf = sceneFilters[sceneKey];
    if (!sf) return;
    state.currentScene = sceneKey;

    // 更新 Tab 样式
    document.querySelectorAll('.scene-tab').forEach(function(tab) {
      tab.classList.toggle('active', tab.dataset.scene === sceneKey);
    });

    // 应用场景筛选（覆盖对应的筛选维度）
    if (sf.clientType !== undefined) state.filters.clientType = sf.clientType || '';
    if (sf.domain !== undefined) state.filters.domain = sf.domain || '';

    if (reload !== false) {
      state.page = 1;
      loadData();
      renderFilters();
    }
  }

  function setupEvents() {
    // 业务场景 Tab
    document.querySelectorAll('.scene-tab').forEach(function(tab) {
      tab.addEventListener('click', function() {
        setScene(this.dataset.scene, true);
      });
    });

    $('#searchBtn').addEventListener('click', function() {
      state.keyword = $('#keywordInput').value.trim();
      state.page = 1;
      loadData();
    });

    $('#keywordInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        state.keyword = this.value.trim();
        state.page = 1;
        loadData();
      }
    });

    $('#keywordInput').addEventListener('input', function() {
      $('#searchClear').classList.toggle('visible', this.value.length > 0);
    });

    $('#searchClear').addEventListener('click', function() {
      $('#keywordInput').value = '';
      $('#searchClear').classList.remove('visible');
      state.keyword = '';
      state.page = 1;
      loadData();
    });

    // Filter chips
    $('#filtersWrap').addEventListener('click', function(e) {
      var chip = e.target.closest('.filter-chip');
      if (!chip) return;
      var filter = chip.dataset.filter;
      var value = chip.dataset.value;
      state.filters[filter] = value;
      state.page = 1;
      loadData();
      renderFilters();
    });

    // Sort
    $('#tableWrap').addEventListener('click', function(e) {
      var th = e.target.closest('th[data-sort]');
      if (!th) return;
      var sort = th.dataset.sort;
      if (state.sort === sort) {
        state.order = state.order === 'asc' ? 'desc' : 'asc';
      } else {
        state.sort = sort;
        state.order = 'asc';
      }
      loadData();
    });

    // Row click -> entry detail
    $('#tableBody').addEventListener('click', function(e) {
      var tr = e.target.closest('tr[data-id]');
      if (!tr) return;
      window.location.href = '/entry/?id=' + encodeURIComponent(tr.dataset.id);
    });

    // Filter toggle
    $('#filterToggle').addEventListener('click', function() {
      var wrap = $('#filtersWrap');
      wrap.classList.toggle('collapsed');
      this.classList.toggle('open');
    });

    // Export button
    $('#exportBtn').addEventListener('click', function() {
      doExport();
    });
  }

  function loadData() {
    if (state.loading) return;
    state.loading = true;

    var url = '/api/dictionary?page=' + state.page + '&pageSize=' + state.pageSize +
      '&sort=' + state.sort + '&order=' + state.order;

    Object.keys(state.filters).forEach(function(k) {
      if (state.filters[k]) url += '&' + k + '=' + encodeURIComponent(state.filters[k]);
    });
    if (state.keyword) url += '&keyword=' + encodeURIComponent(state.keyword);

    // Update URL
    var params = new URLSearchParams();
    Object.keys(state.filters).forEach(function(k) {
      if (state.filters[k]) params.set(k, state.filters[k]);
    });
    if (state.keyword) params.set('keyword', state.keyword);
    params.set('page', state.page);
    params.set('sort', state.sort);
    params.set('order', state.order);
    var qs = params.toString();
    var newUrl = window.location.pathname + (qs ? '?' + qs : '');
    if (window.location.search !== (qs ? '?' + qs : '')) {
      window.history.replaceState({}, '', newUrl);
    }

    fetch(url)
      .then(function(r) { return r.json(); })
      .then(function(data) {
        state.entries = data.entries || [];
        state.total = data.total || 0;
        state.totalPages = Math.ceil(state.total / state.pageSize);
        state.filterOptions = data.filters || {};
        state.loading = false;

        renderFilters();
        renderTable();
        renderPagination();
        renderCount();
        updateActiveFilters();
      })
      .catch(function(err) {
        console.error('Load failed:', err);
        state.loading = false;
        $('#tableBody').innerHTML = '<tr class="loading-row"><td colspan="6">加载失败，请重试</td></tr>';
      });
  }

  function renderFilters() {
    var opts = state.filterOptions;
    renderFilterChips('filterClientType', 'clientType', opts.clientTypes || [], ctLabels);
    // 过滤掉"all"阶段（和默认"全部"重复）
    var stages = (opts.stages || []).filter(function(s) { return s !== 'all'; });
    renderFilterChips('filterStage', 'stage', stages, stLabels);
    renderDomainChips('filterDomain', opts.domains || []);
    renderFilterChips('filterLayer', 'layer', opts.layers || [], layerLabels);
    renderFilterChips('filterEntryType', 'entryType', opts.entryTypes || [], entryTypeLabels);
    renderFilterChips('filterSeverity', 'severity', opts.severities || [], severityLabels);
    renderFilterChips('filterPriority', 'priority', opts.priorities || [], priorityLabels);
    renderFilterChips('filterSubSceneGroup', 'subSceneGroup', opts.subSceneGroups || [], null);
  }

  function renderFilterChips(containerId, filterKey, options, labelMap) {
    var container = $('#' + containerId);
    if (!container) return;
    var html = '<span class="filter-chip' + (!state.filters[filterKey] ? ' active' : '') + '" data-filter="' + filterKey + '" data-value="">全部</span>';
    options.forEach(function(opt) {
      var label = labelMap ? (labelMap[opt] || opt) : opt;
      html += '<span class="filter-chip' + (state.filters[filterKey] === opt ? ' active' : '') + '" data-filter="' + filterKey + '" data-value="' + escapeHtml(opt) + '">' + escapeHtml(label) + '</span>';
    });
    container.innerHTML = html;
  }

  // 知识域分组渲染
  function renderDomainChips(containerId, options) {
    var container = $('#' + containerId);
    if (!container) return;

    // 先把原始 domain 值映射成中文 label，并建立 label→原始值的反向映射
    var rawByLabel = {};
    options.forEach(function(opt) {
      var label = domainLabels[opt] || opt;
      if (!rawByLabel[label]) rawByLabel[label] = [];
      rawByLabel[label].push(opt);
    });

    // 全部按钮
    var html = '<span class="filter-chip' + (!state.filters.domain ? ' active' : '') + '" data-filter="domain" data-value="">全部</span>';

    // 按分组渲染
    var allLabels = Object.keys(rawByLabel);
    var rendered = new Set();

    domainGroups.forEach(function(group) {
      var groupLabels = group.items.filter(function(l) {
        return allLabels.indexOf(l) >= 0;
      });
      if (groupLabels.length === 0) return;

      groupLabels.forEach(function(l) { rendered.add(l); });

      html += '<div class="filter-group-title">' + group.label + '</div>';
      html += '<div class="filter-subgroup">';
      groupLabels.forEach(function(label) {
        var rawValues = rawByLabel[label];
        var rawVal = rawValues[0]; // 取第一个原始值（多数情况只有一个）
        html += '<span class="filter-chip' + (state.filters.domain === rawVal ? ' active' : '') + '" data-filter="domain" data-value="' + escapeHtml(rawVal) + '">' + escapeHtml(label) + '</span>';
      });
      html += '</div>';
    });

    // 未分类的（兜底）
    var ungrouped = allLabels.filter(function(l) { return !rendered.has(l); });
    if (ungrouped.length > 0) {
      html += '<div class="filter-group-title">其他</div>';
      html += '<div class="filter-subgroup">';
      ungrouped.forEach(function(label) {
        var rawValues = rawByLabel[label];
        var rawVal = rawValues[0];
        html += '<span class="filter-chip' + (state.filters.domain === rawVal ? ' active' : '') + '" data-filter="domain" data-value="' + escapeHtml(rawVal) + '">' + escapeHtml(label) + '</span>';
      });
      html += '</div>';
    }

    container.innerHTML = html;
  }

  function renderTable() {
    var tbody = $('#tableBody');
    if (!state.entries.length) {
      tbody.innerHTML = '<tr><td colspan="6"><div class="empty"><div class="empty-icon">📚</div><div class="empty-title">暂无匹配词条</div><div class="empty-desc">尝试调整筛选条件或清空关键词</div></div></td></tr>';
      return;
    }

    // Update sort indicator
    $$('thead th[data-sort]').forEach(function(th) {
      th.classList.toggle('sorted', th.dataset.sort === state.sort);
      var arrow = th.querySelector('.sort-arrow');
      if (arrow) {
        if (th.dataset.sort === state.sort) {
          arrow.textContent = state.order === 'asc' ? '↑' : '↓';
        } else {
          arrow.textContent = '↕';
        }
      }
    });

    var html = '';
    state.entries.forEach(function(e) {
      var layer = Array.isArray(e.layer) ? e.layer[0] : (e.layer || '');
      html += '<tr data-id="' + escapeHtml(e.id) + '">' +
        '<td class="col-name" title="' + escapeHtml(e.name || '') + '">' + escapeHtml(e.name || '') + '</td>' +
        '<td><span class="col-pri ' + escapeHtml(e.priority || '') + '">' + escapeHtml(priorityLabels[e.priority] || e.priority || '') + '</span></td>' +
        '<td><span class="col-sev ' + escapeHtml(e.severity || '') + '">' + escapeHtml(severityLabels[e.severity] || e.severity || '') + '</span></td>' +
        '<td><span class="col-layer ' + escapeHtml(layer) + '">' + escapeHtml(layerLabels[layer] || layer || '') + '</span></td>' +
        '<td><span class="col-type">' + escapeHtml(entryTypeLabels[e.entryType] || e.entryType || '') + '</span></td>' +
        '<td class="col-answer">' + escapeHtml(e.oneLineAnswer || '') + '</td>' +
        '</tr>';
    });
    tbody.innerHTML = html;
  }

  function renderPagination() {
    var pager = $('#pagination');
    if (state.totalPages <= 1) {
      pager.innerHTML = '';
      return;
    }

    var html = '';
    html += '<button class="page-btn" data-page="' + (state.page - 1) + '"' + (state.page <= 1 ? ' disabled' : '') + '>‹ 上一页</button>';

    var maxVisible = 7;
    var start = Math.max(1, state.page - Math.floor(maxVisible / 2));
    var end = Math.min(state.totalPages, start + maxVisible - 1);
    if (end - start < maxVisible - 1) start = Math.max(1, end - maxVisible + 1);

    if (start > 1) {
      html += '<button class="page-btn" data-page="1">1</button>';
      if (start > 2) html += '<span class="page-info">...</span>';
    }
    for (var i = start; i <= end; i++) {
      html += '<button class="page-btn' + (i === state.page ? ' active' : '') + '" data-page="' + i + '"' + (i === state.page ? ' disabled' : '') + '>' + i + '</button>';
    }
    if (end < state.totalPages) {
      if (end < state.totalPages - 1) html += '<span class="page-info">...</span>';
      html += '<button class="page-btn" data-page="' + state.totalPages + '">' + state.totalPages + '</button>';
    }

    html += '<button class="page-btn" data-page="' + (state.page + 1) + '"' + (state.page >= state.totalPages ? ' disabled' : '') + '>下一页 ›</button>';

    pager.innerHTML = html;

    pager.querySelectorAll('.page-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var p = parseInt(this.dataset.page, 10);
        if (p && p >= 1 && p <= state.totalPages && p !== state.page) {
          state.page = p;
          loadData();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      });
    });
  }

  function renderCount() {
    var badge = $('#countBadge');
    if (badge) {
      badge.innerHTML = '共 <strong>' + state.total + '</strong> 条词条';
    }
  }

  function updateActiveFilters() {
    var container = $('#activeFilters');
    var badge = $('#filterBadge');
    var filterLabels = {
      clientType: ctLabels, stage: stLabels, domain: domainLabels,
      layer: layerLabels, entryType: entryTypeLabels,
      severity: severityLabels, priority: priorityLabels
    };
    var filterNames = {
      clientType: '服务对象', stage: '服务阶段', domain: '知识域',
      layer: '知识层级', entryType: '词条类型',
      severity: '风险等级', priority: '优先级', subSceneGroup: '业务场景'
    };

    var active = [];
    Object.keys(state.filters).forEach(function(k) {
      var v = state.filters[k];
      if (v) {
        var labelMap = filterLabels[k];
        var display = labelMap ? (labelMap[v] || v) : v;
        active.push({ key: k, value: v, display: display, name: filterNames[k] || k });
      }
    });

    // 更新 badge
    if (active.length > 0) {
      badge.textContent = active.length;
      badge.classList.add('show');
    } else {
      badge.classList.remove('show');
    }

    if (active.length === 0) {
      container.innerHTML = '';
      return;
    }

    var html = '<span class="af-label">当前筛选</span>';
    active.forEach(function(a) {
      html += '<span class="active-filter-chip" data-key="' + a.key + '" data-value="' + escapeHtml(a.value) + '">' +
        escapeHtml(a.name) + ': ' + escapeHtml(a.display) +
        ' <span class="af-remove">✕</span></span>';
    });
    html += '<span class="active-filter-chip" id="clearAllFilters" style="color:var(--fire);background:rgba(196,106,58,0.08)">清除全部 ✕</span>';
    container.innerHTML = html;

    // 点击单个筛选标签移除
    container.querySelectorAll('.active-filter-chip[data-key]').forEach(function(chip) {
      chip.addEventListener('click', function(e) {
        if (e.target.closest('.af-remove')) {
          var key = this.dataset.key;
          state.filters[key] = '';
          state.page = 1;
          loadData();
          renderFilters();
        }
      });
    });

    // 清除全部
    var clearBtn = $('#clearAllFilters');
    if (clearBtn) {
      clearBtn.addEventListener('click', function() {
        Object.keys(state.filters).forEach(function(k) { state.filters[k] = ''; });
        state.keyword = '';
        $('#keywordInput').value = '';
        $('#searchClear').classList.remove('visible');
        state.page = 1;
        loadData();
        renderFilters();
      });
    }
  }

  function escapeHtml(str) {
    if (!str) return '';
    var div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function doExport() {
    var btn = $('#exportBtn');
    var origText = btn.textContent;
    btn.textContent = '导出中...';
    btn.disabled = true;

    var filters = {};
    Object.keys(state.filters).forEach(function(k) {
      if (state.filters[k]) filters[k] = state.filters[k];
    });

    fetch('/api/dictionary/export', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        filters: filters,
        keyword: state.keyword,
        format: 'csv',
        fields: ['name', 'oneLineAnswer', 'entryType', 'severity', 'priority', 'layer', 'subScene', 'consumerQ']
      })
    })
    .then(function(r) {
      if (!r.ok) throw new Error('Export failed');
      return r.blob();
    })
    .then(function(blob) {
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'fengsheng-dictionary-' + new Date().toISOString().slice(0, 10) + '.csv';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      btn.textContent = origText;
      btn.disabled = false;
    })
    .catch(function(err) {
      console.error('Export failed:', err);
      btn.textContent = origText;
      btn.disabled = false;
      alert('导出失败，请重试');
    });
  }

  // Map lifecycle clientType/stage codes to the Chinese values used in data
  var LC_CT_MAP = { buyer: '买方', seller: '卖家', owner: '业主', landlord: '房东', tenant: '租户' };
  var LC_STAGE_MAP = { pre: '售前', mid: '售中', post: '售后' };

  var lifecycleState = {
    enabled: false,
    clientType: 'buyer',
    activeLifecycle: null,
  };

  function initLifecycleMode() {
    // Check URL param for sceneMode
    var params = new URLSearchParams(window.location.search);
    if (params.get('sceneMode') === 'true') {
      toggleLifecycleMode(true);
    }

    // Lifecycle toggle click
    $('#lifecycleToggle').addEventListener('click', function() {
      toggleLifecycleMode(!lifecycleState.enabled);
    });

    // Client type selection
    $('#lifecycleClientTypes').addEventListener('click', function(e) {
      var btn = e.target.closest('.lifecycle-ct-btn');
      if (!btn) return;
      if (!lifecycleState.enabled) toggleLifecycleMode(true);
      lifecycleState.clientType = btn.dataset.ct;
      lifecycleState.activeLifecycle = null;
      $$('#lifecycleClientTypes .lifecycle-ct-btn').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      renderLifecycleStages();
      // Apply filter
      applyLifecycleFilter();
    });

    // Stage selection (delegated)
    $('#lifecycleStages').addEventListener('click', function(e) {
      var btn = e.target.closest('.lifecycle-stage-btn');
      if (!btn) return;
      var key = btn.dataset.key;
      lifecycleState.activeLifecycle = (lifecycleState.activeLifecycle === key) ? null : key;
      renderLifecycleStages();
      applyLifecycleFilter();
    });
  }

  function toggleLifecycleMode(force) {
    lifecycleState.enabled = (force !== undefined) ? force : !lifecycleState.enabled;
    var toggle = $('#lifecycleToggle');
    var nav = $('#lifecycleNav');
    var badge = $('#lifecycleBadge');
    toggle.classList.toggle('active', lifecycleState.enabled);
    nav.classList.toggle('visible', lifecycleState.enabled);
    badge.style.display = lifecycleState.enabled ? 'inline-block' : 'none';

    if (lifecycleState.enabled) {
      // Auto collapse the regular filters when in lifecycle mode
      $('#filtersWrap').classList.add('collapsed');
      $('#filterToggle').classList.remove('open');
      renderLifecycleStages();
    } else {
      // Clear lifecycle filter when turning off
      lifecycleState.activeLifecycle = null;
      // Remove lifecycle-applied filters
      state.filters.clientType = '';
      state.filters.stage = '';
      state.page = 1;
      loadData();
      renderFilters();
    }
  }

  function renderLifecycleStages() {
    var ct = lifecycleState.clientType;
    var stages = LIFECYCLE_STAGES[ct] || LIFECYCLE_STAGES.buyer;
    var container = $('#lifecycleStages');
    container.innerHTML = stages.map(function(s) {
      var active = (s.key === lifecycleState.activeLifecycle) ? ' active' : '';
      return '<button class="lifecycle-stage-btn' + active + '" data-key="' + s.key + '" data-stage="' + s.stage + '" title="' + s.desc + '">' +
        '<span class="ls-icon">' + s.icon + '</span>' + s.name +
        ' <span class="ls-desc">' + s.desc + '</span></button>';
    }).join('');
  }

  function applyLifecycleFilter() {
    if (!lifecycleState.enabled) return;

    // Map clientType code to Chinese filter value matching data tags
    state.filters.clientType = LC_CT_MAP[lifecycleState.clientType] || '';

    if (lifecycleState.activeLifecycle) {
      var ct = lifecycleState.clientType;
      var stages = LIFECYCLE_STAGES[ct] || LIFECYCLE_STAGES.buyer;
      var current = stages.find(function(s) { return s.key === lifecycleState.activeLifecycle; });
      state.filters.stage = current ? (LC_STAGE_MAP[current.stage] || current.stage) : '';
    } else {
      state.filters.stage = '';
    }

    state.page = 1;
    loadData();
    renderFilters();
  }

  // Override setScene to handle lifecycle mode conflict
  var origSetScene = setScene;
  setScene = function(sceneKey, reload) {
    // If lifecycle mode is on, turn it off when switching scene tabs
    if (lifecycleState.enabled) {
      toggleLifecycleMode(false);
    }
    origSetScene(sceneKey, reload);
  };

  // Hook into init to also init lifecycle mode
  var origInit = init;
  init = function() {
    origInit();
    initLifecycleMode();
  };

  init();
})();
