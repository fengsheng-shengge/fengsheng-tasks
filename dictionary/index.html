<style>
:root {
  --p: #3d5a3e; --p-light: #5a7d5b; --fire: #c46a3a; --fire-light: #e08a3c;
  --cream: #f7f4ef; --cream-deep: #ede7dc; --ink: #1a2b26; --ink-soft: #5a6b65;
  --wood: #c8956d; --line: rgba(61,90,62,0.12);
  --shadow-sm: 0 2px 8px rgba(61,90,62,0.06);
  --shadow-md: 0 8px 24px rgba(61,90,62,0.10);
  --layer-dao: #3d5a3e; --layer-fa: #c46a3a; --layer-shu: #6b5fa8; --layer-qi: #c8956d;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--cream);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}

/* Nav */
.nav{position:sticky;top:0;z-index:100;background:rgba(247,244,239,0.88);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
.nav-inner{max-width:1240px;margin:0 auto;padding:14px 32px;display:flex;align-items:center;gap:32px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;flex-shrink:0}
.brand-mark{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--p),var(--p-light));display:grid;place-items:center;color:white;font-weight:800}
.nav-links{display:flex;gap:4px;flex:1;flex-wrap:wrap}
.nav-link{padding:8px 16px;border-radius:8px;font-size:14px;color:var(--ink-soft);transition:all .2s;white-space:nowrap}
.nav-link:hover{background:rgba(61,90,62,0.06);color:var(--p)}
.nav-link.active{color:var(--p);font-weight:600;background:rgba(61,90,62,0.08)}

/* Main */
main{flex:1;max-width:1240px;width:100%;margin:0 auto;padding:32px 32px 60px}

/* Hero */
.hero{margin-bottom:24px}
.hero h1{font-size:32px;font-weight:800;letter-spacing:-0.5px;margin-bottom:8px}
.hero-sub{font-size:14px;color:var(--ink-soft);margin-bottom:16px}

/* Scene Tabs — 业务场景 */
.scene-tabs{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap;padding:6px;background:rgba(61,90,62,0.06);border-radius:12px}
.scene-tab{padding:8px 18px;border-radius:8px;font-size:13px;font-weight:600;color:var(--ink-soft);cursor:pointer;transition:all .15s;white-space:nowrap}
.scene-tab:hover{color:var(--p)}
.scene-tab.active{background:var(--p);color:white;box-shadow:0 2px 8px rgba(61,90,62,0.15)}
.scene-tab .count{font-size:10px;opacity:0.7;margin-left:4px;font-weight:500}
.scene-tab.active .count{opacity:0.8}

/* Search */
.search-row{display:flex;gap:10px;align-items:center;margin-bottom:20px;flex-wrap:wrap}
.search-box{display:flex;align-items:center;gap:10px;padding:10px 16px;background:white;border:1.5px solid var(--line);border-radius:10px;flex:1;min-width:240px;max-width:480px;transition:all .2s}
.search-box:focus-within{border-color:var(--p);box-shadow:var(--shadow-sm)}
.search-box input{flex:1;border:none;outline:none;font-size:14px;color:var(--ink);background:transparent;font-family:inherit}
.search-box input::placeholder{color:var(--ink-soft)}
.search-box svg{color:var(--ink-soft);flex-shrink:0}
.search-clear{width:24px;height:24px;border-radius:50%;background:var(--cream);border:none;cursor:pointer;display:none;align-items:center;justify-content:center;font-size:12px;color:var(--ink-soft);flex-shrink:0}
.search-clear.visible{display:flex}
.search-btn{padding:10px 20px;border-radius:8px;background:var(--p);color:white;font-size:13px;font-weight:600;border:none;cursor:pointer;transition:all .2s;white-space:nowrap}
.search-btn:hover{background:var(--p-light)}
.count-badge{font-size:13px;color:var(--ink-soft);white-space:nowrap}
.count-badge strong{color:var(--p);font-size:16px}

/* Filters */
.filters-wrap{display:flex;flex-direction:column;gap:8px;margin-bottom:20px;padding:16px 20px;background:white;border:1px solid var(--line);border-radius:12px}
.filter-row{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap;padding:6px 0;border-bottom:1px dashed var(--line)}
.filter-row:last-child{border-bottom:none;padding-bottom:0}
.filter-row:first-child{padding-top:0}
.filter-label{font-size:11px;font-weight:700;color:var(--p);letter-spacing:0.5px;min-width:56px;padding-top:6px;flex-shrink:0;display:flex;align-items:center;gap:4px}
.filter-label .help-icon{font-size:10px;cursor:help;opacity:0.6}
.filter-chips{display:flex;gap:5px;flex-wrap:wrap;flex:1}
.filter-chips.grouped{flex-direction:column;gap:2px;align-items:stretch}
.filter-chip{font-size:12px;padding:4px 12px;border-radius:100px;background:var(--cream);border:1px solid transparent;color:var(--ink-soft);cursor:pointer;transition:all .15s;white-space:nowrap;user-select:none}
.filter-chip:hover{background:rgba(61,90,62,0.08);color:var(--p)}
.filter-chip.active{background:var(--p);color:white;border-color:var(--p);font-weight:600}
.filter-chip .count{font-size:10px;opacity:0.7;margin-left:3px}

/* Filter groups */
.filter-group-title{font-size:11px;font-weight:800;color:var(--ink);margin:4px 0 2px;letter-spacing:0.5px}
.filter-subgroup{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:4px}
.filter-subgroup-label{font-size:10px;font-weight:700;color:var(--ink-soft);min-width:44px;padding-top:5px;flex-shrink:0}

/* Severity tooltip */
.sev-help{position:relative;display:inline-block}
.sev-help-popup{display:none;position:absolute;top:100%;left:0;margin-top:6px;padding:10px 14px;background:var(--ink);color:white;border-radius:8px;font-size:12px;line-height:1.8;white-space:nowrap;z-index:10;box-shadow:var(--shadow-md)}
.sev-help:hover .sev-help-popup{display:block}
.sev-help-popup .sev-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}

/* Table */
.table-wrap{overflow-x:auto;background:white;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-sm);margin-bottom:24px}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{padding:12px 14px;text-align:left;font-weight:700;font-size:12px;color:var(--ink-soft);border-bottom:2px solid var(--line);white-space:nowrap;background:rgba(61,90,62,0.03);position:sticky;top:0;cursor:pointer;user-select:none;transition:all .15s}
thead th:hover{color:var(--p);background:rgba(61,90,62,0.06)}
thead th .sort-arrow{font-size:10px;margin-left:4px;opacity:0.4}
thead th.sorted .sort-arrow{opacity:1;color:var(--p)}
tbody td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:rgba(61,90,62,0.03)}
tbody tr{cursor:pointer;transition:background .15s}
.col-name{font-weight:600;color:var(--ink);max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.col-answer{max-width:300px;color:var(--ink-soft);font-size:12px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.col-layer{font-size:11px;font-weight:600;padding:2px 8px;border-radius:4px;white-space:nowrap}
.col-layer.dao{background:rgba(61,90,62,0.08);color:var(--layer-dao)}
.col-layer.fa{background:rgba(196,106,58,0.08);color:var(--layer-fa)}
.col-layer.shu{background:rgba(107,95,168,0.08);color:var(--layer-shu)}
.col-layer.qi{background:rgba(200,149,109,0.08);color:var(--layer-qi)}
.col-type{font-size:11px;font-weight:600;padding:2px 6px;border-radius:4px;background:rgba(61,90,62,0.06);color:var(--p);white-space:nowrap}
.col-sev{font-size:11px;font-weight:600;white-space:nowrap}
.col-sev.hard{color:var(--fire)}
.col-sev.medium{color:var(--fire-light)}
.col-sev.soft{color:var(--ink-soft)}
.col-pri{font-size:11px;font-weight:700;white-space:nowrap}
.col-pri.P0{color:var(--fire)}
.col-pri.P1{color:var(--fire-light)}
.col-pri.P2{color:var(--p)}
.col-pri.P3{color:var(--ink-soft)}

/* Pagination */
.pagination{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:40px;flex-wrap:wrap}
.page-btn{padding:8px 14px;border-radius:8px;background:white;border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--ink-soft);cursor:pointer;transition:all .15s}
.page-btn:hover:not(:disabled){background:var(--p);color:white;border-color:var(--p)}
.page-btn.active{background:var(--p);color:white;border-color:var(--p);font-weight:700}
.page-btn:disabled{opacity:0.4;cursor:not-allowed}
.page-info{font-size:12px;color:var(--ink-soft);padding:0 8px}

/* Loading */
.loading-row{text-align:center;padding:40px;color:var(--ink-soft)}
.spinner{display:inline-block;width:24px;height:24px;border:3px solid var(--line);border-top-color:var(--p);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:8px}
@keyframes spin{to{transform:rotate(360deg)}}

/* Empty */
.empty{text-align:center;padding:60px 20px;color:var(--ink-soft)}
.empty-icon{font-size:48px;margin-bottom:12px;opacity:0.3}
.empty-title{font-size:18px;font-weight:700;color:var(--ink);margin-bottom:8px}
.empty-desc{font-size:14px}

/* Footer */
footer{background:var(--cream-deep);padding:30px 32px 20px;color:var(--ink-soft);font-size:13px;border-top:1px solid var(--line)}
.footer-inner{max-width:1240px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px}

@media(max-width:768px){
  .nav-links{display:none}
  .hero h1{font-size:24px}
  main{padding:20px 16px}
  .filter-row{flex-direction:column;gap:6px}
  .table-wrap{font-size:12px}
  thead th,tbody td{padding:8px 10px}
  .col-name{max-width:140px}
  .col-answer{max-width:180px}
}
</style>
</head>

<script>
(function() {
  'use strict';

  var state = {
    filters: {
      clientType: '', stage: '', domain: '', layer: '', entryType: '', severity: '', priority: '', subSceneGroup: ''
    },
    filterOptions: {},
    keyword: '',
    page: 1, pageSize: 20, total: 0, totalPages: 0,
    sort: 'priority', order: 'asc',
    entries: [],

  };

  var $ = function(s) { return document.querySelector(s); };
  var $$ = function(s) { return document.querySelectorAll(s); };

  var layerLabels = { dao: '道', fa: '法', shu: '术', qi: '器' };
  var severityLabels = { hard: '红线', medium: '提醒', soft: '建议' };
  var ctLabels = {
    agent: '经纪人', buyer: '买方', landlord: '房东',
    owner: '业主', seller: '卖家', tenant: '租户',

  };
  var stLabels = {

    holding: '持有中', own: '业主侧', pst: '售后',

  };

    STD: '标准类', TERM: '术语类', SKILL: '技能类'
  };
  var priorityLabels = {
    P0: '最高优', P1: '高优', P2: '中优', P3: '一般'
  };
  // 知识域全量中文映射（含代码→中文）
  var domainLabels = {
    // 生命周期类
    '签约前': '签约前', '签约中': '签约中', '签约后': '签约后',
    '居住中': '居住中', '退租出售': '退租出售',
    // 业务职能类
    '业主': '业主服务', '职业成长': '职业成长',
    '资产持有与运营': '资产持有与运营', '跨域通用': '跨域通用',

    'CAR': '资产域', 'OWN': '业主域', 'SNG': '场景域',
    'trade': '交易域', 'CRO': '客关域',

  };
  // 知识域分组（按类别组织，便于用户理解）
  var domainGroups = [
    { key: 'lifecycle', label: '客户生命周期', items: ['签约前', '签约中', '签约后', '居住中', '退租出售'] },
    { key: 'business',  label: '业务职能域', items: ['业主服务', '资产持有与运营', '职业成长', '跨域通用'] },
    { key: 'code',      label: '代码域', items: ['资产域', '业主域', '场景域', '交易域'] },
    { key: 'post',      label: '岗位域', items: ['房产经纪人', '居住服务顾问', '租赁管家', '整装设计师', '家装监理', '家政服务员', '收纳整理师', 'A3岗', 'A4岗', 'B4岗', 'C3岗', 'G1岗', 'G2岗', 'G3岗', 'G4岗', 'H1岗', 'H2岗', 'H3岗', 'H4岗'] },

  var sceneFilters = {

  function init() {

    ['clientType','stage','domain','layer','entryType','severity','priority','subSceneGroup'].forEach(function(k) {

    loadData();
    setupEvents();
  }

  // 根据当前筛选推断所在场景
  function detectScene() {
    var f = state.filters;
    if (f.domain === '职业成长') return 'career';
    if (f.domain === '跨域通用') return 'cross';
    if (f.clientType === 'tenant' || f.clientType === 'landlord') return 'rental';
    if (f.clientType === 'buyer' || f.clientType === 'seller') return 'trading';
    if (f.clientType === 'owner') return 'owner';
    return 'all';
  }

  function setScene(sceneKey, reload) {
    var sf = sceneFilters[sceneKey];
    if (!sf) return;
    state.currentScene = sceneKey;

    // 更新 Tab 样式
    document.querySelectorAll('.scene-tab').forEach(function(tab) {
      tab.classList.toggle('active', tab.dataset.scene === sceneKey);
    });

    // 应用场景筛选（覆盖对应的筛选维度）
    if (sf.clientType !== undefined) state.filters.clientType = sf.clientType || '';
    if (sf.domain !== undefined) state.filters.domain = sf.domain || '';

    if (reload !== false) {
      state.page = 1;
      loadData();
      renderFilters();
    }
  }

  function setupEvents() {
    // 业务场景 Tab
    document.querySelectorAll('.scene-tab').forEach(function(tab) {
      tab.addEventListener('click', function() {
        setScene(this.dataset.scene, true);
      });
    });

    $('#searchBtn').addEventListener('click', function() {
      state.keyword = $('#keywordInput').value.trim();
      state.page = 1;
      loadData();
    });

    $('#keywordInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        state.keyword = this.value.trim();
        state.page = 1;
        loadData();
      }
    });

    $('#keywordInput').addEventListener('input', function() {
      $('#searchClear').classList.toggle('visible', this.value.length > 0);
    });

    $('#searchClear').addEventListener('click', function() {
      $('#keywordInput').value = '';
      $('#searchClear').classList.remove('visible');
      state.keyword = '';
      state.page = 1;
      loadData();
    });

    // Filter chips
    $('#filtersWrap').addEventListener('click', function(e) {
      var chip = e.target.closest('.filter-chip');
      if (!chip) return;
      var filter = chip.dataset.filter;
      var value = chip.dataset.value;
      state.filters[filter] = value;
      state.page = 1;
      loadData();
      renderFilters();
    });

    // Sort
    $('#tableWrap').addEventListener('click', function(e) {
      var th = e.target.closest('th[data-sort]');
      if (!th) return;
      var sort = th.dataset.sort;
      if (state.sort === sort) {
        state.order = state.order === 'asc' ? 'desc' : 'asc';
      } else {
        state.sort = sort;
        state.order = 'asc';
      }
      loadData();
    });

    // Row click -> entry detail
    $('#tableBody').addEventListener('click', function(e) {
      var tr = e.target.closest('tr[data-id]');
      if (!tr) return;
      window.location.href = '/entry/?id=' + encodeURIComponent(tr.dataset.id);
    });

    // Export button
    $('#exportBtn').addEventListener('click', function() {
      doExport();
    });
  }

  function loadData() {
    if (state.loading) return;
    state.loading = true;

    var url = '/api/dictionary?page=' + state.page + '&pageSize=' + state.pageSize +
      '&sort=' + state.sort + '&order=' + state.order;

    Object.keys(state.filters).forEach(function(k) {
      if (state.filters[k]) url += '&' + k + '=' + encodeURIComponent(state.filters[k]);
    });
    if (state.keyword) url += '&keyword=' + encodeURIComponent(state.keyword);

    // Update URL
    var params = new URLSearchParams();
    Object.keys(state.filters).forEach(function(k) {
      if (state.filters[k]) params.set(k, state.filters[k]);
    });
    if (state.keyword) params.set('keyword', state.keyword);
    params.set('page', state.page);
    params.set('sort', state.sort);
    params.set('order', state.order);
    var qs = params.toString();
    var newUrl = window.location.pathname + (qs ? '?' + qs : '');
    if (window.location.search !== (qs ? '?' + qs : '')) {
      window.history.replaceState({}, '', newUrl);
    }

    fetch(url)
      .then(function(r) { return r.json(); })
      .then(function(data) {
        state.entries = data.entries || [];
        state.total = data.total || 0;
        state.totalPages = Math.ceil(state.total / state.pageSize);
        state.filterOptions = data.filters || {};
        state.loading = false;

        renderFilters();
        renderTable();
        renderPagination();
        renderCount();
      })
      .catch(function(err) {
        console.error('Load failed:', err);
        state.loading = false;
        $('#tableBody').innerHTML = '<tr class="loading-row"><td colspan="6">加载失败，请重试</td></tr>';
      });
  }

  function renderFilters() {
    var opts = state.filterOptions;
    renderFilterChips('filterClientType', 'clientType', opts.clientTypes || [], ctLabels);
    // 过滤掉"all"阶段（和默认"全部"重复）
    var stages = (opts.stages || []).filter(function(s) { return s !== 'all'; });
    renderFilterChips('filterStage', 'stage', stages, stLabels);
    renderDomainChips('filterDomain', opts.domains || []);
    renderFilterChips('filterLayer', 'layer', opts.layers || [], layerLabels);
    renderFilterChips('filterEntryType', 'entryType', opts.entryTypes || [], entryTypeLabels);
    renderFilterChips('filterSeverity', 'severity', opts.severities || [], severityLabels);
    renderFilterChips('filterPriority', 'priority', opts.priorities || [], priorityLabels);
    renderFilterChips('filterSubSceneGroup', 'subSceneGroup', opts.subSceneGroups || [], null);
  }

  function renderFilterChips(containerId, filterKey, options, labelMap) {
    var container = $('#' + containerId);
    if (!container) return;
    var html = '<span class="filter-chip' + (!state.filters[filterKey] ? ' active' : '') + '" data-filter="' + filterKey + '" data-value="">全部</span>';
    options.forEach(function(opt) {
      var label = labelMap ? (labelMap[opt] || opt) : opt;
      html += '<span class="filter-chip' + (state.filters[filterKey] === opt ? ' active' : '') + '" data-filter="' + filterKey + '" data-value="' + escapeHtml(opt) + '">' + escapeHtml(label) + '</span>';
    });
    container.innerHTML = html;
  }

  // 知识域分组渲染
  function renderDomainChips(containerId, options) {
    var container = $('#' + containerId);
    if (!container) return;

    // 先把原始 domain 值映射成中文 label，并建立 label→原始值的反向映射
    var rawByLabel = {};
    options.forEach(function(opt) {
      var label = domainLabels[opt] || opt;
      if (!rawByLabel[label]) rawByLabel[label] = [];
      rawByLabel[label].push(opt);
    });

    // 全部按钮
    var html = '<span class="filter-chip' + (!state.filters.domain ? ' active' : '') + '" data-filter="domain" data-value="">全部</span>';

    // 按分组渲染
    var allLabels = Object.keys(rawByLabel);
    var rendered = new Set();

    domainGroups.forEach(function(group) {
      var groupLabels = group.items.filter(function(l) {
        return allLabels.indexOf(l) >= 0;
      });
      if (groupLabels.length === 0) return;

      groupLabels.forEach(function(l) { rendered.add(l); });

      html += '<div class="filter-group-title">' + group.label + '</div>';
      html += '<div class="filter-subgroup">';
      groupLabels.forEach(function(label) {
        var rawValues = rawByLabel[label];
        var rawVal = rawValues[0]; // 取第一个原始值（多数情况只有一个）
        html += '<span class="filter-chip' + (state.filters.domain === rawVal ? ' active' : '') + '" data-filter="domain" data-value="' + escapeHtml(rawVal) + '">' + escapeHtml(label) + '</span>';
      });
      html += '</div>';
    });

    // 未分类的（兜底）
    var ungrouped = allLabels.filter(function(l) { return !rendered.has(l); });
    if (ungrouped.length > 0) {
      html += '<div class="filter-group-title">其他</div>';
      html += '<div class="filter-subgroup">';
      ungrouped.forEach(function(label) {
        var rawValues = rawByLabel[label];
        var rawVal = rawValues[0];
        html += '<span class="filter-chip' + (state.filters.domain === rawVal ? ' active' : '') + '" data-filter="domain" data-value="' + escapeHtml(rawVal) + '">' + escapeHtml(label) + '</span>';
      });
      html += '</div>';
    }

    container.innerHTML = html;
  }

  function renderTable() {
    var tbody = $('#tableBody');
    if (!state.entries.length) {
      tbody.innerHTML = '<tr><td colspan="6"><div class="empty"><div class="empty-icon">📚</div><div class="empty-title">暂无匹配词条</div><div class="empty-desc">尝试调整筛选条件或清空关键词</div></div></td></tr>';
      return;
    }

    // Update sort indicator
    $$('thead th[data-sort]').forEach(function(th) {
      th.classList.toggle('sorted', th.dataset.sort === state.sort);
      var arrow = th.querySelector('.sort-arrow');
      if (arrow) {
        if (th.dataset.sort === state.sort) {
          arrow.textContent = state.order === 'asc' ? '↑' : '↓';
        } else {
          arrow.textContent = '↕';
        }
      }
    });

    var html = '';
    state.entries.forEach(function(e) {
      var layer = Array.isArray(e.layer) ? e.layer[0] : (e.layer || '');
      html += '<tr data-id="' + escapeHtml(e.id) + '">' +
        '<td class="col-name" title="' + escapeHtml(e.name || '') + '">' + escapeHtml(e.name || '') + '</td>' +
        '<td><span class="col-pri ' + escapeHtml(e.priority || '') + '">' + escapeHtml(priorityLabels[e.priority] || e.priority || '') + '</span></td>' +
        '<td><span class="col-sev ' + escapeHtml(e.severity || '') + '">' + escapeHtml(severityLabels[e.severity] || e.severity || '') + '</span></td>' +
        '<td><span class="col-layer ' + escapeHtml(layer) + '">' + escapeHtml(layerLabels[layer] || layer || '') + '</span></td>' +
        '<td><span class="col-type">' + escapeHtml(entryTypeLabels[e.entryType] || e.entryType || '') + '</span></td>' +
        '<td class="col-answer">' + escapeHtml(e.oneLineAnswer || '') + '</td>' +
        '</tr>';
    });
    tbody.innerHTML = html;
  }

  function renderPagination() {
    var pager = $('#pagination');
    if (state.totalPages <= 1) {
      pager.innerHTML = '';
      return;
    }

    var html = '';
    html += '<button class="page-btn" data-page="' + (state.page - 1) + '"' + (state.page <= 1 ? ' disabled' : '') + '>‹ 上一页</button>';

    var maxVisible = 7;
    var start = Math.max(1, state.page - Math.floor(maxVisible / 2));
    var end = Math.min(state.totalPages, start + maxVisible - 1);
    if (end - start < maxVisible - 1) start = Math.max(1, end - maxVisible + 1);

    if (start > 1) {
      html += '<button class="page-btn" data-page="1">1</button>';
      if (start > 2) html += '<span class="page-info">...</span>';
    }
    for (var i = start; i <= end; i++) {
      html += '<button class="page-btn' + (i === state.page ? ' active' : '') + '" data-page="' + i + '"' + (i === state.page ? ' disabled' : '') + '>' + i + '</button>';
    }
    if (end < state.totalPages) {
      if (end < state.totalPages - 1) html += '<span class="page-info">...</span>';
      html += '<button class="page-btn" data-page="' + state.totalPages + '">' + state.totalPages + '</button>';
    }

    html += '<button class="page-btn" data-page="' + (state.page + 1) + '"' + (state.page >= state.totalPages ? ' disabled' : '') + '>下一页 ›</button>';

    pager.innerHTML = html;

    pager.querySelectorAll('.page-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var p = parseInt(this.dataset.page, 10);
        if (p && p >= 1 && p <= state.totalPages && p !== state.page) {
          state.page = p;
          loadData();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      });
    });
  }

  function renderCount() {
    var badge = $('#countBadge');
    if (badge) {
      badge.innerHTML = '共 <strong>' + state.total + '</strong> 条词条';
    }
  }

  function escapeHtml(str) {
    if (!str) return '';
    var div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function doExport() {
    var btn = $('#exportBtn');
    var origText = btn.textContent;
    btn.textContent = '导出中...';
    btn.disabled = true;

    var filters = {};
    Object.keys(state.filters).forEach(function(k) {
      if (state.filters[k]) filters[k] = state.filters[k];
    });

    fetch('/api/dictionary/export', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        filters: filters,
        keyword: state.keyword,
        format: 'csv',
        fields: ['name', 'oneLineAnswer', 'entryType', 'severity', 'priority', 'layer', 'subScene', 'consumerQ']
      })
    })
    .then(function(r) {
      if (!r.ok) throw new Error('Export failed');
      return r.blob();
    })
    .then(function(blob) {
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'fengsheng-dictionary-' + new Date().toISOString().slice(0, 10) + '.csv';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      btn.textContent = origText;
      btn.disabled = false;
    })
    .catch(function(err) {
      console.error('Export failed:', err);
      btn.textContent = origText;
      btn.disabled = false;
      alert('导出失败，请重试');
    });
  }

  init();
})();
</script>
</body>
</html>
