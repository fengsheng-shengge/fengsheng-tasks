<style>
:root{

*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit;text-decoration:none}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}
nav{position:sticky;top:0;z-index:100;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 24px;display:flex;align-items:center;gap:24px}
.nav-logo{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--p);font-size:14px;flex-shrink:0}
.nav-logo-mark{width:28px;height:28px;background:var(--p);color:#fff;border-radius:7px;display:grid;place-items:center;font-size:13px;font-weight:700}
.nav-links{display:flex;gap:18px;font-size:13px;flex:1;justify-content:center;flex-wrap:wrap}
.nav-links a{color:var(--ink-soft);transition:color .15s}
.nav-links a:hover,.nav-links a.active{color:var(--p);font-weight:600}

.hero{max-width:1120px;margin:0 auto;padding:48px 24px 32px}
.hero-tag{display:inline-block;font-size:12px;font-weight:600;color:var(--p);background:rgba(26,61,36,.08);padding:5px 12px;border-radius:20px;margin-bottom:16px;letter-spacing:.5px}
.hero h1{font-size:36px;font-weight:800;letter-spacing:-1px;margin-bottom:10px;line-height:1.15}
.hero h1 span{background:linear-gradient(135deg,var(--p),var(--p-soft));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero-sub{font-size:15px;color:var(--ink-soft);margin-bottom:28px;max-width:520px}
.client-row{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.client-btn{display:flex;align-items:center;gap:7px;padding:10px 16px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-size:14px;font-weight:600;color:var(--ink-soft);transition:all .18s}
.client-btn:hover{border-color:var(--p);color:var(--p)}

.client-btn .emoji{font-size:16px}
.stage-wrap{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:8px}
.stage-label{font-size:12px;font-weight:600;color:var(--ink-soft);letter-spacing:.5px;margin-bottom:12px}
.stage-row{display:flex;gap:6px;flex-wrap:wrap}
.stage-btn{padding:8px 14px;border-radius:8px;font-size:13px;font-weight:500;color:var(--ink-soft);background:var(--bg);border:1px solid var(--line);transition:all .15s;display:flex;align-items:center;gap:5px}
.stage-btn:hover{color:var(--p);border-color:var(--p)}
.stage-btn.active{background:var(--p);color:#fff;border-color:var(--p);font-weight:600}
.stage-btn .icon{font-size:14px}
.hot-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.hot-label{font-size:12px;color:var(--ink-soft);align-self:center;margin-right:4px}
.hot-chip{padding:5px 12px;border-radius:20px;font-size:12px;color:var(--ink-soft);background:var(--card);border:1px solid var(--line);cursor:pointer;transition:all .15s}
.hot-chip:hover{background:rgba(26,61,36,.08);color:var(--p);border-color:var(--p)}
.layer-wrap{max-width:1120px;margin:0 auto;padding:16px 24px 48px}
.layer-tabs{display:flex;gap:0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:16px;overflow:hidden}
.layer-tab{flex:1;padding:12px 10px;border-radius:8px;font-size:14px;font-weight:600;text-align:center;color:var(--ink-soft);transition:all .2s;cursor:pointer;white-space:nowrap}
.layer-tab:hover{color:var(--ink)}
.layer-tab.active{color:#fff}
.layer-tab.dao.active{background:var(--dao)}
.layer-tab.fa.active{background:var(--fa)}
.layer-tab.shu.active{background:var(--shu)}
.layer-tab.qi.active{background:var(--qi)}
.layer-tab .count{font-size:11px;font-weight:400;opacity:.7;display:block;margin-top:2px}
.filter-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.filter-sep{width:1px;height:14px;background:var(--line);margin:0 4px}
.filter-chip{padding:5px 12px;border-radius:20px;font-size:12px;color:var(--ink-soft);background:var(--card);border:1px solid var(--line);cursor:pointer;transition:all .15s}
.filter-chip:hover{color:var(--p);border-color:var(--p)}
.filter-chip.active{background:var(--p);color:#fff;border-color:var(--p);font-weight:600}
.entry-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.entry-card{padding:16px 18px;border-radius:10px;background:var(--card);border:1px solid var(--line);cursor:pointer;transition:all .18s}

.ec-head{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px}
.ec-icon{font-size:18px;flex-shrink:0;margin-top:1px}
.ec-title{font-size:14.5px;font-weight:700;line-height:1.4;flex:1}
.ec-answer{font-size:13px;color:var(--ink-soft);line-height:1.5;margin-bottom:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ec-badges{display:flex;gap:5px;flex-wrap:wrap}
.ec-badge{padding:2px 8px;border-radius:4px;font-size:10.5px;font-weight:600;letter-spacing:.3px}
.ec-badge.p0{background:rgba(138,109,47,.12);color:var(--p0)}
.ec-badge.p1{background:rgba(201,169,98,.18);color:var(--p1)}
.ec-badge.p2{background:rgba(45,90,61,.1);color:var(--p2)}
.ec-badge.p3{background:rgba(107,122,116,.1);color:var(--p3)}
.ec-badge.hard{background:rgba(196,106,58,.1);color:var(--fa)}
.ec-badge.medium{background:rgba(201,169,98,.16);color:var(--p1)}
.ec-badge.soft{background:rgba(45,90,61,.1);color:var(--p2)}
.ec-badge.type{background:rgba(26,61,36,.07);color:var(--p)}
.ec-goto{display:block;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:11.5px;color:var(--p);opacity:.65;transition:opacity .15s}
.ec-goto:hover{opacity:1;font-weight:600}
.empty-state{text-align:center;padding:48px 20px;color:var(--ink-soft)}
.empty-icon{font-size:40px;margin-bottom:12px}
.empty-title{font-size:16px;font-weight:700;color:var(--ink);margin-bottom:4px}
.empty-desc{font-size:13px}
.loading{display:flex;align-items:center;justify-content:center;padding:48px;gap:10px;color:var(--ink-soft);font-size:13px}
.spinner{width:20px;height:20px;border:2.5px solid var(--line);border-top-color:var(--p);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.modal-overlay{position:fixed;inset:0;background:rgba(26,43,38,.55);backdrop-filter:blur(3px);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px}

.modal{background:#fff;border-radius:16px;max-width:640px;width:100%;max-height:82vh;overflow-y:auto;box-shadow:0 24px 60px rgba(0,0,0,.25)}

.m-badge.p2{background:rgba(45,90,61,.1);color:var(--p2)}
.m-badge.p3{background:rgba(107,122,116,.1);color:var(--p3)}
.m-badge.hard{background:rgba(196,106,58,.1);color:var(--fa)}
.m-badge.medium{background:rgba(201,169,98,.16);color:var(--p1)}

</style>

document.addEventListener('DOMContentLoaded',()=>{
  const p=new URLSearchParams(location.search);
  if(p.get('clientType')&&['buyer','seller','owner','landlord','tenant'].includes(p.get('clientType'))){
    currentCT=p.get('clientType');
    $$('#clientRow .client-btn').forEach(b=>b.classList.toggle('active',b.dataset.ct===currentCT));
  }
  renderStages(currentCT);
  if(p.get('lifecycle')){currentLC=p.get('lifecycle');$$('#stageRow .stage-btn').forEach(b=>b.classList.toggle('active',b.dataset.lc===currentLC))}
  bindEvents();loadSceneData();
});
function bindEvents(){
  $('#clientRow').addEventListener('click',e=>{const b=e.target.closest('.client-btn');if(!b)return;$$('#clientRow .client-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');currentCT=b.dataset.ct;currentLC=(LIFECYCLE_STAGES[currentCT]||LIFECYCLE_STAGES.buyer)[0].key;renderStages(currentCT);loadSceneData()});
  $('#stageRow').addEventListener('click',e=>{const b=e.target.closest('.stage-btn');if(!b)return;$$('#stageRow .stage-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');currentLC=b.dataset.lc;loadSceneData()});
  $('#hotRow').addEventListener('click',e=>{const c=e.target.closest('.hot-chip');if(!c)return;currentCT=c.dataset.ct;currentLC=c.dataset.lc;$$('#clientRow .client-btn').forEach(b=>b.classList.toggle('active',b.dataset.ct===currentCT));renderStages(currentCT);loadSceneData()});
  $('#layerTabs').addEventListener('click',e=>{const t=e.target.closest('.layer-tab');if(!t)return;currentLayer=t.dataset.layer;$$('#layerTabs .layer-tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');renderGrid()});
  document.querySelectorAll('[data-type]').forEach(c=>c.addEventListener('click',()=>{currentType=c.dataset.type||null;document.querySelectorAll('[data-type]').forEach(x=>x.classList.toggle('active',x.dataset.type===currentType));renderGrid()}));
  document.querySelectorAll('[data-sev]').forEach(c=>c.addEventListener('click',()=>{currentSev=c.dataset.sev||null;document.querySelectorAll('[data-sev]').forEach(x=>x.classList.toggle('active',x.dataset.sev===currentSev));renderGrid()}));
  $('#modalOverlay').addEventListener('click',e=>{if(e.target===$('#modalOverlay'))closeModal()});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
}
function renderStages(ct){const s=LIFECYCLE_STAGES[ct]||LIFECYCLE_STAGES.buyer;$('#stageRow').innerHTML=s.map(x=>`<button class="stage-btn ${x.key===currentLC?'active':''}" data-lc="${x.key}"><span class="icon">${x.icon}</span>${x.name}</button>`).join('');if(!s.some(x=>x.key===currentLC)){currentLC=s[0].key;$('#stageRow').querySelector('.stage-btn').classList.add('active')}}
function getStage(){const s=LIFECYCLE_STAGES[currentCT]||LIFECYCLE_STAGES.buyer;const x=s.find(y=>y.key===currentLC);return x?x.stage:'pre'}
async function loadSceneData(){$('#loading').style.display='flex';$('#emptyState').style.display='none';try{const sd=LIFECYCLE_SCENE_DOMAIN[currentLC]||[];const r=await fetch(`/api/scene/detail?clientType=${currentCT}&stage=${getStage()}&sceneDomain=${encodeURIComponent(sd[0]||'')}`);const data=await r.json();sceneData=data;allEntries=[];(data.groups||[]).forEach(g=>(g.entries||[]).forEach(e=>allEntries.push({...e,_layer:g.layer})));const bl=data.byLayer||{};['dao','fa','shu','qi'].forEach(l=>{const el=document.getElementById(l+'Count');if(el)el.textContent=(bl[l]||0)+' 条'});renderGrid()}catch(err){console.error(err);$('#emptyState').style.display='block'}$('#loading').style.display='none')}
function renderGrid(){const f=allEntries.filter(e=>e._layer===currentLayer).filter(e=>!currentType||e.entryType===currentType).filter(e=>!currentSev||e.severity===currentSev);$('#emptyState').style.display='none';const g=$('#entryGrid');if(f.length===0){g.innerHTML='';$('#emptyState').style.display='block';return}g.innerHTML=f.map(e=>{const ic=TYPE_ICONS[e.entryType]||'📋';const pr=e.priority?`<span class="ec-badge ${e.priority.toLowerCase()}">${PRIORITY_LABELS[e.priority]||e.priority}</span>`:'';const sv=e.severity?`<span class="ec-badge ${e.severity.toLowerCase()}">${SEVERITY_LABELS[e.severity]||e.severity}</span>`:'';const tp=e.entryType?`<span class="ec-badge type">${TYPE_LABELS[e.entryType]||e.entryType}</span>`:'';return `<div class="entry-card" onclick="openDetail('${e.id}')"><div class="ec-head"><span class="ec-icon">${ic}</span><span class="ec-title">${esc(e.name)}</span></div>${e.oneLineAnswer?`<div class="ec-answer">${esc(e.oneLineAnswer)}</div>`:''}<div class="ec-badges">${pr}${sv}${tp}</div><a class="ec-goto" href="/knowledge/?q=${encodeURIComponent(e.name)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">🔎 知识底座查证 →</a></div>`}).join('')}
async function openDetail(id){$('#modalOverlay').classList.add('active');$('#modalTitle').textContent='加载中...';$('#modalBody').innerHTML='<div class="loading"><div class="spinner"></div></div>';try{const r=await fetch(`/api/entry?id=${encodeURIComponent(id)}`);const data=await r.json();const e=data.entry||data;if(!e||!e.name){$('#modalBody').innerHTML='<div class="empty-state"><div class="empty-title">词条不存在</div></div>';return}$('#modalIcon').textContent=TYPE_ICONS[e.entryType]||'📋';$('#modalTitle').textContent=e.name;$('#modalId').textContent=e.id||'';let h='';if(e.oneLineAnswer)h+=`<div class="m-section"><div class="m-def">${esc(e.oneLineAnswer)}</div></div>`;h+=`<div class="m-section"><div class="m-badges">`;if(e.priority)h+=`<span class="m-badge ${e.priority.toLowerCase()}">${PRIORITY_LABELS[e.priority]}</span>`;if(e.severity)h+=`<span class="m-badge ${e.severity.toLowerCase()}">${SEVERITY_LABELS[e.severity]}</span>`;if(e.entryType)h+=`<span class="m-badge type">${TYPE_LABELS[e.entryType]}</span>`;h+=`</div></div>`;if(e.def)h+=`<div class="m-section"><div class="m-section-title">📖 详细定义</div><div class="m-def">${esc(e.def)}</div></div>`;if(e.consumerQ||e.ownerQ){h+=`<div class="m-section"><div class="m-section-title">💬 对话示例</div>`;if(e.consumerQ)h+=`<div class="m-field"><span class="m-field-label">客户问</span><span>${esc(e.consumerQ)}</span></div>`;if(e.ownerQ)h+=`<div class="m-field"><span class="m-field-label">业主问</span><span>${esc(e.ownerQ)}</span></div>`;h+=`</div>`}if(e.legalRef)h+=`<div class="m-section"><div class="m-section-title">⚖️ 法条依据</div><div>${esc(e.legalRef)}</div></div>`;if(e.caveat)h+=`<div class="m-section"><div class="m-section-title">⚠️ 适用边界</div><div>${esc(e.caveat)}</div></div>`;if(e.corePoint&&e.corePoint.length)h+=`<div class="m-section"><div class="m-section-title">🔑 核心要点</div><div>${e.corePoint.map(esc).join('；')}</div></div>`;if(e.relatedEntries&&e.relatedEntries.length){h+=`<div class="m-section"><div class="m-section-title">🔗 关联词条</div>`;e.relatedEntries.slice(0,5).forEach(x=>h+=`<div class="m-field" style="cursor:pointer" onclick="event.stopPropagation();openDetail('${x.id}')"><span class="m-field-label" style="color:var(--p)">▶</span><span>${esc(x.name)}</span></div>`);h+=`</div>`}$('#modalBody').innerHTML=h}catch(err){console.error(err);$('#modalBody').innerHTML='<div class="empty-state"><div class="empty-title">加载失败</div></div>'}}function closeModal(){$('#modalOverlay').classList.remove('active')}function esc(s){if(!s)return'';const d=document.createElement('div');d.textContent=s;return d.innerHTML}
</script>
</body>
</html>
