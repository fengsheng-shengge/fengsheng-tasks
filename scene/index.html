<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>场景导航 · 风声</title>
<meta name="description" content="风声场景导航 · 已合并至全量词典">
<script src="/tracker.js" async></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#f7f4ef;color:#1a2b26;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:40px 20px;text-align:center}
.icon{font-size:64px;margin-bottom:8px}
h1{font-size:28px;font-weight:800;color:#1a2b26}
p{font-size:15px;color:#5a6b65;max-width:400px;line-height:1.6}
a{display:inline-flex;align-items:center;gap:8px;padding:14px 28px;border-radius:12px;background:#3d5a3e;color:white;text-decoration:none;font-size:16px;font-weight:700;transition:all .2s;margin-top:8px}
a:hover{background:#5a7d5b;transform:translateY(-2px)}
.countdown{font-size:13px;color:#5a6b65;margin-top:4px}
</style>
</head>
<body>
<div class="icon">🧭</div>
<h1>场景导航已升级</h1>
<p>场景导航功能已合并至全量词典，在词典中开启「场景导航模式」即可按客户类型和生命周期阶段精准筛选词条。</p>
<a href="/dictionary/?sceneMode=true" id="redirectLink">进入全量词典 · 场景导航模式 →</a>
<p class="countdown" id="countdown">即将自动跳转...</p>

<script>
(function() {
  var seconds = 5;
  var countdownEl = document.getElementById('countdown');
  var link = document.getElementById('redirectLink');

  function tick() {
    seconds--;
    if (seconds <= 0) {
      window.location.href = link.href;
      return;
    }
    countdownEl.textContent = seconds + ' 秒后自动跳转...';
    setTimeout(tick, 1000);
  }
  setTimeout(tick, 1000);
})();
</script>
</body>
</html>
