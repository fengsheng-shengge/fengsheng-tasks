<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>咨询辅导 · 风声 · 数字员工落地</title>
<meta name="description" content="线上功能全部免费使用。如需落地到自己的门店，加微信预约线下辅导。">
<style>
:root{--bg:#f7f4ef;--bg2:#e8e4d9;--card:#fff;--p:#3d5a3e;--p-d:#2c4430;--p-l:#7a9a7c;--accent:#c46a3a;--accent-l:#e89060;--dk:#1a1a1a;--tx:#555;--ts:#7a8478;--td:#a8b0a6;--r:4px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;background:var(--bg);color:var(--tx);line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
a{color:var(--p);text-decoration:none}
/* 导航 */
.nav{display:flex;align-items:center;justify-content:space-between;height:52px;padding:0 5%;background:linear-gradient(135deg,#3d5a3e 0%,#2c4430 100%);color:#fff;position:sticky;top:0;z-index:100}
.nav-l{display:flex;align-items:center;gap:8px}
.nav-l a{color:rgba(255,255,255,.7);font-size:13px}
.nav-l a:hover{color:#fff}
.nav-r{font-size:13px;display:flex;align-items:center;gap:8px}
/* 主区域 */
.main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 5%}
.consult-card{background:var(--card);border-radius:var(--r);padding:48px 40px;max-width:560px;width:100%;text-align:center;border:1px solid rgba(0,0,0,.06);box-shadow:0 4px 24px rgba(0,0,0,.06)}
.consult-card .hero-icon{font-size:48px;margin-bottom:16px}
.consult-card h1{font-size:26px;color:var(--p-d);margin-bottom:8px;font-weight:800}
.consult-card .subtitle{font-size:15px;color:var(--ts);margin-bottom:28px;line-height:1.7;max-width:400px;margin-left:auto;margin-right:auto}
.consult-card .contact-item{display:flex;align-items:center;gap:16px;padding:16px 20px;background:var(--bg);border-radius:var(--r);margin-bottom:12px;text-align:left}
.consult-card .contact-item .ci-icon{font-size:22px;flex-shrink:0}
.consult-card .contact-item .ci-label{font-size:12px;color:var(--ts);margin-bottom:2px}
.consult-card .contact-item .ci-value{font-size:16px;font-weight:700;color:var(--p-d);letter-spacing:1px}
.consult-card .contact-item .ci-note{font-size:11px;color:var(--td);margin-top:2px}
.consult-card .divider{width:40px;height:2px;background:var(--bg2);margin:24px auto;border-radius:2px}
.consult-card .free-note{font-size:13px;color:var(--ts);line-height:1.6;padding:12px 16px;background:rgba(61,90,62,.06);border-radius:var(--r);margin-bottom:24px}
.consult-card .actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.consult-card .actions .btn{display:inline-flex;align-items:center;gap:6px;padding:12px 28px;border-radius:var(--r);font-size:14px;font-weight:600;border:none;cursor:pointer;transition:background .2s}
.consult-card .actions .btn-primary{background:var(--p);color:#fff}
.consult-card .actions .btn-primary:hover{background:var(--p-d)}
.consult-card .actions .btn-secondary{background:var(--bg2);color:var(--tx)}
.consult-card .actions .btn-secondary:hover{background:var(--td)}
@media(max-width:640px){
  .consult-card{padding:32px 24px}
  .consult-card .contact-item{padding:12px 16px}
}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-l">
    <a href="/">风声首页</a>
    <span style="color:rgba(255,255,255,.3)">/</span>
    <a href="/agent-academy/">智能体学院</a>
    <span style="color:rgba(255,255,255,.3)">/</span>
    <span style="color:rgba(255,255,255,.6);font-size:13px">咨询辅导</span>
  </div>
  <div class="nav-r">
    <a href="/agent-academy/" style="color:rgba(255,255,255,.7)">← 返回学院</a>
  </div>
</nav>

<div class="main">
  <div class="consult-card">
    <div class="hero-icon">🤝</div>
    <h1>预约线下辅导</h1>
    <p class="subtitle">线上功能全部免费使用。如果你想把自己的门店也配上数字员工团队，加微信聊聊，帮你定制方案。</p>

    <div class="contact-item">
      <div class="ci-icon">📱</div>
      <div>
        <div class="ci-label">微信号</div>
        <div class="ci-value">wilson2483lee</div>
        <div class="ci-note">手机号同号，添加请备注「智能体学院」</div>
      </div>
    </div>

    <div class="divider"></div>

    <div class="free-note">
      <strong>📌 线上全部免费</strong><br>
      智能体学院、数字员工看板、策展引擎、五把尺子考核……所有线上功能均免费开放体验。<br>
      觉得有用再联系，落地辅导按需定制。
    </div>

    <div class="actions">
      <a href="/agent-academy/" class="btn btn-primary">← 返回智能体学院</a>
      <a href="/" class="btn btn-secondary">回到首页</a>
    </div>
  </div>
</div>
</body>
</html>
