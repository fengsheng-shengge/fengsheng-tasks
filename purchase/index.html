<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>咨询辅导 · 风声聚匠星云 · 数字员工落地</title>
<meta name="description" content="线上功能全部免费使用。如需落地到自己的门店，加微信预约线下辅导。">
<style>
:root{--bg:#f7f5f0;--bg2:#e6ede7;--card:#fff;--p:#1a3d24;--p-d:#12291a;--p-l:#6b8f70;--accent:#1a3d24;--accent-l:#12291a;--dk:#1a1a1a;--tx:#555;--ts:#7a8478;--td:#a8b0a6;--r:4px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;background:var(--bg);color:var(--tx);line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
a{color:var(--p);text-decoration:none}
/* 导航 */
.nav{display:flex;align-items:center;justify-content:space-between;height:52px;padding:0 5%;background:linear-gradient(135deg,#1a3d24 0%,#12291a 100%);color:#fff;position:sticky;top:0;z-index:100}
.nav-l{display:flex;align-items:center;gap:8px}
.nav-l a{color:rgba(255,255,255,.7);font-size:13px}
.nav-l a:hover{color:#fff}
.nav-r{font-size:13px;display:flex;align-items:center;gap:8px}
/* 主区域 */
.main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 5%}
.consult-card{background:var(--card);border-radius:var(--r);padding:48px 40px;max-width:560px;width:100%;text-align:center;border:1px solid rgba(0,0,0,.06);box-shadow:0 4px 24px rgba(0,0,0,.06)}
.consult-card .hero-icon{font-size:48px;margin-bottom:16px}
.consult-card h1{font-size:26px;color:var(--p-d);margin-bottom:8px;font-weight:800}
.consult-card .subtitle{font-size:15px;color:var(--ts);margin-bottom:28px;line-height:1.7;max-width:400px;margin-left:auto;margin-right:auto}
.consult-card .contact-item{display:flex;align-items:center;gap:16px;padding:16px 20px;background:var(--bg);border-radius:var(--r);margin-bottom:12px;text-align:left}
.consult-card .contact-item .ci-icon{font-size:22px;flex-shrink:0}
.consult-card .contact-item .ci-label{font-size:12px;color:var(--ts);margin-bottom:2px}
.consult-card .contact-item .ci-value{font-size:16px;font-weight:700;color:var(--p-d);letter-spacing:1px}
.consult-card .contact-item .ci-note{font-size:11px;color:var(--td);margin-top:2px}
.consult-card .divider{width:40px;height:2px;background:var(--bg2);margin:24px auto;border-radius:2px}
.consult-card .free-note{font-size:13px;color:var(--ts);line-height:1.6;padding:12px 16px;background:rgba(26,61,36,.06);border-radius:var(--r);margin-bottom:24px}
.consult-card .actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.consult-card .actions .btn{display:inline-flex;align-items:center;gap:6px;padding:12px 28px;border-radius:var(--r);font-size:14px;font-weight:600;border:none;cursor:pointer;transition:background .2s}
.consult-card .actions .btn-primary{background:var(--p);color:#fff}
.consult-card .actions .btn-primary:hover{background:var(--p-d)}
.consult-card .actions .btn-secondary{background:var(--bg2);color:var(--tx)}
.consult-card .actions .btn-secondary:hover{background:var(--td)}
@media(max-width:640px){
  .consult-card{padding:32px 24px}
  .consult-card .contact-item{padding:12px 16px}
}
</style>

<!-- V2.2 移动端全局补丁 -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style id="__fs_mobile_patch">
  /* === 1. 基础保护：禁止横向溢出 === */
  html, body { max-width: 100vw; overflow-x: hidden; -webkit-text-size-adjust: 100%; }
  body { min-height: 100dvh; }
  
  /* === 2. 图片视频防宽溢出 === */
  img, video, canvas, svg, iframe, object, embed { max-width: 100%; height: auto; }
  
  /* === 3. 触控目标 ≥ 44px (Apple 推荐) === */
  @media (max-width: 768px) {
    a, button, [role="button"], input, select, textarea {
      min-height: 44px;
      font-size: max(14px, 1rem); /* 避免 iOS 自动放大 */
    }
    input[type="text"], input[type="tel"], input[type="email"], select, textarea {
      font-size: 16px !important; /* iOS 聚焦不放大 */
    }
    .js-ad, .topbar, .top-nav { min-height: 48px; }
  }
  
  /* === 4. 480px 断点：核心折叠 === */
  @media (max-width: 480px) {
    /* 禁止横向滚动兜底 */
    * { max-width: 100%; box-sizing: border-box; }
    
    /* 固定/粘性顶部栏 桌面宽度强制收敛 */
    .top-nav, .topbar, .fs-top-nav, .mentor-top-bar, 
    [class*="top-nav"], [class*="topbar"], [class*="fixed-top"],
    .role-banner, .three-step-bar, .value-intro, .growth-bar,
    .search-section, .filter-zone, .proof-strip, .proof-cards,
    .kb-trust-grid, .kb-trust-card, .pillar-icons, .stats,
    .fs-guide-panel {
      width: 100% !important;
      max-width: 100vw !important;
      overflow-x: hidden !important;
    }
    
    /* 汉堡菜单替代：如果有 .nav-links 这类固定宽度 div，改为 auto-flow */
    .domain-tabs, .skill-tabs, .stage-tabs, .module-tabs,
    [class*="-tabs"], [class*="-links"], [class*="-nav-links"] {
      flex-wrap: wrap !important;
      max-width: 100vw !important;
    }
    
    /* 两列网格降为单列 */
    [class*="grid-2"], [class*="-grid-2"] { grid-template-columns: 1fr !important; }
    
    /* 三列及以上降为单列或双列 */
    [class*="grid-3"], [class*="-grid-3"], 
    [class*="grid-4"], [class*="-grid-4"],
    [class*="grid-5"], [class*="-grid-5"] { grid-template-columns: 1fr !important; }
    
    /* hero 标题缩字号 */
    h1, .hero h1 { font-size: 1.6rem !important; line-height: 1.3 !important; }
    h2 { font-size: 1.3rem !important; }
    h3 { font-size: 1.15rem !important; }
    
    /* 搜索框全宽 */
    input[type="search"], .search-input, .fs-search-input { width: 100% !important; max-width: 100% !important; }
  }
  
  /* === 5. 375px 断点：终极收敛 === */
  @media (max-width: 375px) {
    .hero h1 { font-size: 1.4rem !important; }
    .section-title { font-size: 1.15rem !important; }
    h1, .hero h1 { font-size: 1.4rem !important; }
    .care-grid, .benefits, .mentors { grid-template-columns: 1fr !important; }
    .care-grid > *, .benefits > * { grid-column: span 1 !important; }
  }
  
  /* === 6. safe-area-inset (iPhone) === */
  @supports (padding: max(0px)) {
    .topbar, .top-nav, .fs-top-nav { padding-top: max(16px, env(safe-area-inset-top)); }
  }
  
  /* === 7. 禁止用户缩放的 viewport 自动补充（如果页面有 user-scalable=no 就去掉）=== */
</style>
